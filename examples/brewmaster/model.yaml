  LI-01:
    a: LC-WATER
    b: LC-THERMAL
    flow: water flow rate, level, no-flow
  LI-02:
    a: LC-THERMAL
    b: LC-BREW
    flow: hot water 92–96 °C
  LI-03:
    a: LC-CTRL
    b: LC-THERMAL
    flow: setpoint, heater enable, fault
  LI-04:
    a: LC-CTRL
    b: LC-WATER
    flow: pump/valve commands, flow count
  LI-05:
    a: LC-CTRL
    b: LC-HMI
    flow: status, faults, schedule input
  LI-06:
    a: LC-CTRL
    b: LC-CONN
    flow: schedule, telemetry, OTA
  LI-07:
    a: LC-BREW
    b: LC-CTRL
    flow: carafe present, drip-stop state
