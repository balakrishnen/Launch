process_steps:
  PS-01:
    name: Mold and trim housing
    station: Molding
    parts:
    - P-ENCL
    team: TM-MFG
    tooling_usd: 185000
    cycle_s: 42
    controls: Process window locked; first-off approval
    seq: 10
    machine: Haitian MA2500 250 t + tool MV-26-0117; resin dryer 80 °C 3 h
    characteristics:
    - name: Wall thickness at basket rail
      kind: product
      spec: 2.5 ±0.15 mm
      method: Ultrasonic gauge
      size: 5 pcs
      freq: per shift
      control: Process window locked (melt 230 °C, hold 450 bar)
      reaction: Quarantine shift output; adjust hold pressure; 100 % check until 3 good shifts
      sc: ''
    - name: Resin grade / lot
      kind: process
      spec: PP copolymer BJ380MO, CoC
      method: Barcode scan + CoC
      size: each drum
      freq: each load
      control: Dryer interlock
      reaction: Stop machine; purge; segregate parts since last good scan
      sc: ''
  PS-02:
    name: PCBA main + HMI
    station: EMS
    parts:
    - P-MAIN
    - P-HMI
    team: TM-MFG
    cycle_s: 38
    controls: Feeder verification; SPI/AOI 100 %
    seq: 20
    machine: Fuji NXT III + Heller 1809 reflow; Koh Young SPI/AOI
    characteristics:
    - name: Solder voids at triac tab
      kind: product
      spec: ≤ 25 % voids
      method: X-ray
      size: 5 boards
      freq: per lot
      control: Qualified reflow profile
      reaction: Hold lot; 100 % X-ray; re-profile
      sc: SC
    - name: Component placement
      kind: product
      spec: IPC-A-610 class 2
      method: AOI
      size: 100 %
      freq: continuous
      control: Feeder verification
      reaction: Repair per IPC-7711; trend top 3 defects daily
      sc: ''
  PS-03:
    name: Assemble water/thermal path
    station: Line 1
    parts:
    - P-RES
    - P-PUMP
    - P-TB
    - P-SHOWER
    team: TM-MFG
    capex_usd: 28000
    cycle_s: 58
    controls: Force-monitored clamp tool
    seq: 30
    machine: Line 1 st. 3-5; Oetiker HO 3000 force-monitored pliers
    characteristics:
    - name: Hot-side clamp crimp force
      kind: process
      spec: 2.2 ±0.2 kN
      method: Force-monitored pliers log
      size: 100 %
      freq: continuous
      control: Tool calibration weekly
      reaction: Re-crimp; quarantine since last calibration
      sc: SC
    - name: Thermoblock orientation
      kind: product
      spec: Inlet Ø8 / outlet Ø6
      method: Visual + keyed barb
      size: 100 %
      freq: continuous
      control: Different barb sizes
      reaction: Re-assemble
      sc: ''
  PS-04:
    name: Final assembly & cord
    station: Line 1
    parts:
    - P-CORD
    - P-BASKET
    - P-CARAFE
    team: TM-MFG
    cycle_s: 55
    controls: Torque driver with counter; MES interlock
    seq: 40
    machine: Line 1 st. 7-8; Kilews SKD-BN512 torque driver with counter
    characteristics:
    - name: Earth bond screw torque
      kind: product
      spec: 0.8 ±0.1 N·m, 3 screws
      method: Torque driver with counter
      size: 100 %
      freq: continuous
      control: MES interlock on count
      reaction: Stop unit; drive missing screw; ground bond retest
      sc: SC
    - name: Basket rail gap (IF-15)
      kind: product
      spec: 0.4 ±0.15 mm
      method: Feeler gauge
      size: 5 pcs
      freq: per 2 h
      control: Housing CTQ at PS-01
      reaction: 100 % gauge; notify SUP-05
      sc: ''
  PS-05:
    name: 'End-of-line test: hipot, ground bond, brew, provisioning'
    station: EoL
    parts:
    - P-BM1
    team: TM-MFG
    capex_usd: 42000
    eol_test: TST-13
    cycle_s: 228
    controls: Signed fixture config; daily known-bad sample
    seq: 50
    machine: EoL fixture BM1-EOL-01 (Chroma 19032 hipot/ground bond, NI cDAQ brew rig)
    characteristics:
    - name: Hipot
      kind: product
      spec: 1,250 V AC 1 s, I ≤ 5 mA
      method: Chroma 19032
      size: 100 %
      freq: continuous
      control: Signed fixture config; daily known-bad sample
      reaction: Fail → scrap/teardown; known-bad not failing stops line
      sc: SC
    - name: Ground bond
      kind: product
      spec: 25 A, ≤ 0.1 Ω
      method: Chroma 19032
      size: 100 %
      freq: continuous
      control: Daily reference
      reaction: Fail → check earth screw; re-test
      sc: SC
    - name: Brew water temperature (300 ml)
      kind: product
      spec: 92–96 °C
      method: Type-T TC, NI cDAQ
      size: 100 %
      freq: continuous
      control: Gauge R&R 8.4 %
      reaction: Fail → re-test once; second fail to MRB
      sc: CC
    - name: Wi-Fi provisioning + RSSI
      kind: product
      spec: RSSI ≥ −55 dBm at 1 m
      method: Golden AP
      size: 100 %
      freq: continuous
      control: Shielded box
      reaction: Re-test; antenna check
      sc: ''
  PS-06:
    name: ICT and firmware flash (main + HMI)
    station: EMS test
    machine: ICT bed-of-nails BM1-ICT-01; J-Link flasher with HSM signing
    parts:
    - P-MAIN
    - P-HMI
    - P-FW
    team: TM-MFG
    cycle_s: 48
    controls: MES record per board; signed image only
    seq: 25
    characteristics:
    - name: ICT pass (shorts, opens, triac gate, PSU rails)
      kind: product
      spec: All ICT limits
      method: ICT BM1-ICT-01
      size: 100 %
      freq: continuous
      control: MES record per board
      reaction: Fail → debug bench; > 2 % fail rate stops line
      sc: ''
    - name: Firmware image signature
      kind: product
      spec: FW 2.3.x signed; secure boot fused
      method: Flasher log + fuse read
      size: 100 %
      freq: continuous
      control: HSM signing
      reaction: Stop; quarantine boards since last good; security lead sign-off
      sc: SC
  PS-07:
    name: 'Thermoblock sub-assembly: TCO, NTC, wiring'
    station: Line 1 st. 1-2
    machine: Torque driver 1.2 N·m; NTC clip fixture; TCO clamp gauge
    parts:
    - P-TB
    - P-TCO
    - P-NTC
    team: TM-MFG
    cycle_s: 52
    controls: Fixture poka-yoke for TCO position; torque monitor
    seq: 28
    characteristics:
    - name: TCO position on block
      kind: product
      spec: Clamped in pocket, gap ≤ 0.2 mm
      method: Go/no-go gauge
      size: 100 %
      freq: continuous
      control: Fixture poka-yoke
      reaction: Rework; 100 % gauge for shift
      sc: SC
    - name: NTC clip torque
      kind: process
      spec: 1.2 ±0.1 N·m
      method: Torque driver monitor
      size: 100 %
      freq: continuous
      control: Torque-controlled driver
      reaction: Re-torque; check driver calibration
      sc: ''
  PS-08:
    name: Install main board, HMI, radio and harness
    station: Line 1 st. 6
    machine: ESD bench; connector latch gauge
    parts:
    - P-MAIN
    - P-HMI
    - P-RADIO
    team: TM-MFG
    cycle_s: 61
    controls: Color-coded keyed connectors; latch check
    seq: 36
    characteristics:
    - name: Connector latch (NTC, flow, level FPC)
      kind: product
      spec: Latched, color match
      method: Latch gauge + visual
      size: 100 %
      freq: continuous
      control: Keyed color-coded connectors
      reaction: Re-seat; audit 20 units
      sc: ''
  PS-09:
    name: 'Pack-out: carafe, manual, label, carton'
    station: Pack
    machine: Label printer Zebra ZT411; carton weigh scale ±2 g
    parts:
    - P-CARAFE
    - P-BM1
    team: TM-MFG
    cycle_s: 35
    controls: MES blocks pack without EoL pass; weight check
    eol_test: null
    seq: 60
    characteristics:
    - name: Carton weight (residual water, missing items)
      kind: product
      spec: 2,950 ±20 g
      method: Scale ±2 g
      size: 100 %
      freq: continuous
      control: MES EoL pass record required
      reaction: Open carton; check items and water
      sc: ''
    - name: Rating label
      kind: product
      spec: Model, serial, 120 V 1,400 W or 230 V; UL/CE marks
      method: Vision label check
      size: 100 %
      freq: continuous
      control: Label from MES
      reaction: Re-label; audit lot
      sc: ''
  PS-10:
    name: Water-path leak test
    station: Line 1 st. 5b
    machine: ATEQ F620 pressure-decay 0.5 bar
    parts:
    - P-RES
    - P-PUMP
    - P-TB
    team: TM-MFG
    cycle_s: 30
    controls: Leak test 100 %; MES record
    seq: 33
    characteristics:
    - name: Water path leak rate
      kind: product
      spec: ≤ 2 Pa/s at 0.5 bar
      method: ATEQ F620 pressure decay
      size: 100 %
      freq: continuous
      control: Master leak check each shift
      reaction: Fail → leak hunt; > 1 % fails stops line
      sc: SC
