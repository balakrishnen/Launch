states:
  S-OFF:
    name: Off / standby
  S-IDLE:
    name: Idle, ready
  S-HEAT:
    name: Pre-heating
  S-BREW:
    name: Brewing
  S-WARM:
    name: Keep warm
  S-FAULT:
    name: Fault / safe state
  S-DESCALE:
    name: Descaling
transitions:
  T-01:
    frm: S-OFF
    to: S-IDLE
    trigger: dial press or app wake
    guard: ''
    sensor: null
    func: F-12
  T-02:
    frm: S-IDLE
    to: S-HEAT
    trigger: brew start (dial, app, schedule)
    guard: water level > min and carafe present
    sensor: P-LEVEL
    func: F-08
  T-03:
    frm: S-HEAT
    to: S-BREW
    trigger: thermoblock at setpoint
    guard: ''
    sensor: P-NTC
    func: F-01
  T-04:
    frm: S-BREW
    to: S-WARM
    trigger: flow count = target or reservoir empty
    guard: ''
    sensor: P-FLOW
    func: F-02
  T-05:
    frm: S-WARM
    to: S-IDLE
    trigger: 120 min elapsed or carafe removed > 2 min
    guard: ''
    sensor: P-CARSW
    func: F-05
  T-06:
    frm: S-BREW
    to: S-FAULT
    trigger: no flow with heater on > 5 s or NTC out of range
    guard: ''
    sensor: P-NTC
    func: F-07
  T-07:
    frm: S-IDLE
    to: S-DESCALE
    trigger: user starts descale
    guard: ''
    sensor: null
    func: F-09
  T-08:
    frm: S-IDLE
    to: S-OFF
    trigger: 5 min idle
    guard: ''
    sensor: null
    func: F-12
constraints:
  C-01:
    name: Heat-up energy
    formula: t_heat_s = m_water_kg * 4186 * (T_set - T_in) / (P_heater_W * eta) <= 60
    inputs:
      m_water_kg: 0.15
      T_set: 94
      T_in: 20
      P_heater_W: 1400
      eta: 0.9
    reqs:
    - R-02
    tests:
    - TST-02
  C-02:
    name: Brew time
    formula: t_brew_s = V_ml / flow_ml_s + t_heat_s <= 360
    inputs:
      V_ml: 1500
      flow_ml_s: 5.2
      t_heat_s: 55
    reqs:
    - R-02
    tests:
    - TST-02
  C-03:
    name: Mains load (US)
    formula: P_total_W = P_heater + P_plate + P_pump + P_elec <= 1440
    inputs:
      P_heater: 1400
      P_plate: 0
      P_pump: 20
      P_elec: 5
    reqs:
    - R-02
    - R-05
    tests:
    - TST-06
  C-04:
    name: Standby power
    formula: P_standby_W = P_psu_idle + P_radio_sleep + P_mcu_sleep <= 0.5
    inputs:
      P_psu_idle: 0.18
      P_radio_sleep: 0.12
      P_mcu_sleep: 0.03
    reqs:
    - R-08
    tests:
    - TST-09
  C-05:
    name: Dry-boil cutoff
    formula: t_detect + t_sw + t_triac_off <= 5 s
    inputs:
      t_detect: 3.0
      t_sw: 0.2
      t_triac_off: 0.02
    reqs:
    - R-03
    tests:
    - TST-03
  C-06:
    name: Surface temperature
    formula: T_surface - T_ambient <= 60 K (metal) per 60335-1
    inputs:
      T_ambient: 25
    reqs:
    - R-04
    tests:
    - TST-05
trades:
  TD-01:
    name: 'Heater: thermoblock vs tank boiler'
    question: Which heating architecture meets 92–96 °C at the shower head within 360 s for 10 cups at the lowest cost and risk?
    options:
    - Thermoblock 1400 W
    - Tank boiler 1200 W
    - Thermoblock 1800 W (EU only)
    criteria:
    - Mains load (US 15 A circuit)
    - Time to first cup
    - Brew temperature stability
    - BOM cost
    - Dry-boil risk
    - Descale sensitivity
    - Mass
    weights:
    - 1
    - 4
    - 5
    - 3
    - 4
    - 2
    - 1
    criteria_meta:
      Time to first cup:
        direction: min
        unit: s
        moe: MOE-02
        basis: bench, 1.5 L at 120 V
      Brew temperature stability:
        direction: max
        unit: 1-5
        moe: MOE-01
        basis: ±°C over brew; simulated
      BOM cost:
        direction: min
        unit: USD
        basis: supplier quotes
      Dry-boil risk:
        direction: max
        unit: 1-5
        req: R-03
        basis: DFMEA AP
      Descale sensitivity:
        direction: max
        unit: 1-5
        req: R-07
      Mass:
        direction: min
        unit: g
      Mains load (US 15 A circuit):
        direction: min
        unit: W
        limit: 1440
        req: R-02
        basis: 'NEC 210.23: 80 % of 15 A × 120 V = 1440 W continuous'
    raw:
      Thermoblock 1400 W:
        Time to first cup: 55
        BOM cost: 9.8
        Mass: 450
        Mains load (US 15 A circuit): 1400
      Tank boiler 1200 W:
        Time to first cup: 210
        BOM cost: 7.2
        Mass: 820
        Mains load (US 15 A circuit): 1200
      Thermoblock 1800 W (EU only):
        Time to first cup: 42
        BOM cost: 11.4
        Mass: 470
        Mains load (US 15 A circuit): 1800
    scores:
      Thermoblock 1400 W:
        Brew temperature stability: 4
        Dry-boil risk: 4
        Descale sensitivity: 2
      Tank boiler 1200 W:
        Brew temperature stability: 3
        Dry-boil risk: 3
        Descale sensitivity: 4
      Thermoblock 1800 W (EU only):
        Brew temperature stability: 5
        Dry-boil risk: 4
        Descale sensitivity: 2
    evidence:
      Thermoblock 1400 W:
        Time to first cup:
        - TST-02
        Brew temperature stability:
        - TST-01
        Dry-boil risk:
        - TST-03
        - TST-04
        BOM cost:
        - SUP-01
      Tank boiler 1200 W:
        Time to first cup:
        - TST-02
    datum: Tank boiler 1200 W
    affects:
    - R-01
    - R-02
    - R-03
    - R-07
    elements:
    - P-TB
    - LC-THERMAL
    - F-01
    decision: Thermoblock 1400 W
    rationale: 1800 W exceeds the 15 A NEMA 5-15 circuit for the US variant (1800 W × 1.25 continuous); the 1400 W block meets MOE-02 with margin and keeps one heater across both markets. Descale sensitivity
      is handled by R-07 estimator.
    status: decided
    decided_by: bala@twinmo.ai
    date: '2026-11-12'
    owner_team: TM-THERM
  TD-02:
    name: 'Carafe: glass vs thermal (vacuum stainless)'
    question: Which carafe meets keep-warm and cost targets for the base SKU?
    options:
    - Glass 1.5 L + warm plate
    - Thermal stainless 1.2 L
    - Thermal stainless 1.5 L
    criteria:
    - Keep-warm at 120 min
    - Coffee taste after 60 min
    - BOM cost
    - Standby energy
    - Drop robustness
    - Capacity
    weights:
    - 4
