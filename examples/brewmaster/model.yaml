    consequences:
    - +$0.06 BOM
    - trim fixed by 4 clips
    trade: null
tests:
  TST-01:
    name: Brew temperature profile
    method: 'TP-101: type-T thermocouple at shower head outlet, 10-cup brew at 108/120/132 V and 207/230/253 V, 22 °C inlet water, 5 brews per unit'
    gate: DVT
    passfail: 92.0 ≤ T ≤ 96.0 °C from 100 ml to end of brew, every unit, every voltage
    status: passed
    owner_team: TM-THERM
    units: °C
    samples: 5 units × 6 voltages × 5 brews
    start: '2026-05-04'
    end: '2026-10-02'
    result: DVT min 92.4 °C at 108 V, max 95.6 °C at 132 V; Cpk 1.41
    notes: ''
    metric: brew_temp_c
    kind: test
    attrs: {}
  TST-02:
    name: 10-cup brew time
    method: 'TP-102: 1,500 ml cold fill, stopwatch start key → drip-stop (flow meter = 0 for 10 s), 120 V and 230 V'
