capa:
  CAPA-01:
    title: PSU output ripple above spec on incoming lot HLK-2603
    source: inspection
    source_id: INS-03
    parts:
    - P-PSU
    fm: FA-F-12-degraded
    owner: Nguyen Van Hai
    team: TM-SQ
    status: closed
    containment: Lot rejected; 10 known-good units from prior lot for EVT; 100 % ripple test at incoming until 3 clean lots
    root_cause: Supplier substituted output electrolytic (lower ESR rating) without PCN; 5 Why to missing change control at Hi-Link
    corrective: 'SCAR-26-003: original capacitor restored; PCN clause added to MSA-2026-024'
    preventive: Incoming ripple sampling (AQL 0.65) on every PSU lot; supplier PCN audit
    verification_test: TST-11
    verified: '2026-08-20: 2 lots 0 defects; TST-11 DVT margin 7.2 dB'
    due: '2026-08-31'
    closed: '2026-08-28'
  CAPA-02:
    title: Drip after carafe removal 6.1 g (TST-19 EVT fail)
    source: test
    source_id: TST-19
    parts:
    - P-BASKET
    fm: FA-F-04-unintended
    owner: Marco Bellini
    team: TM-BREW
    status: closed
    containment: EVT beta units given replacement baskets with hand-selected valves
    root_cause: EPDM valve takes 32 % compression set after 100 h at 96 °C; preload drops below 1.2 N
    corrective: LSR valve (Shin-Etsu KE-2090-50) overmolded in TL-02 T2
    preventive: 'Seal material rule in DfM checklist: hot-water seals LSR or FKM only'
    verification_test: TST-19
    verified: '2026-09-26: DVT max 0.8 g over 60 s'
    due: '2026-09-30'
    closed: '2026-09-26'
  CAPA-03:
    title: Networked standby 0.58 W (TST-09 EVT fail)
    source: test
    source_id: TST-09
    parts:
    - P-RADIO
    - P-FW
    fm: FA-F-12-degraded
    owner: Sara Okafor
    team: TM-CTRL
    status: closed
    containment: None needed (pre-production)
    root_cause: Radio stayed in modem sleep after association; app keep-alive reset idle timer
    corrective: 'FW 2.1: light sleep DTIM 3; keep-alive excluded from idle timer'
    preventive: TST-09 added to FW release regression
    verification_test: TST-09
    verified: '2026-09-22: DVT mean 0.34 W'
    due: '2026-09-30'
    closed: '2026-09-22'
  CAPA-04:
    title: 'Beta: second pot lukewarm (FE-01)'
    source: field
    source_id: FE-01
    parts:
    - P-CARSW
    - P-FW
    fm: FA-F-05-degraded
    owner: Ben Carter
    team: TM-FQ
    status: closed
    containment: Beta FW 2.2.1 OTA to 40 beta units
    root_cause: Carafe switch bounce on lift-and-replace reset keep-warm timer and left plate disabled
    corrective: 'FW 2.3: 20 ms debounce and keep-warm state retained for 30 s carafe absence'
    preventive: Carafe lift/replace case added to TST-15 and TST-16
    verification_test: TST-15
    verified: '2026-10-07: TST-15 DVT with lift/replace 81.2 °C min'
    due: '2026-11-15'
    closed: '2026-11-02'
  CAPA-05:
    title: 'ISTA 3A: carafe handle cracked 2/4'
    source: test
    source_id: TST-21
    parts:
    - P-CARAFE
    - P-ENCL
    fm: ''
    owner: Jonas Berg
    team: TM-ID
    status: closed
    containment: DVT beta units shipped in double box
    root_cause: Carafe free to move 6 mm in insert; handle root takes drop load
    corrective: 'ECO-003: insert rib + carafe sleeve; handle root radius 3 mm (TL-05 T2)'
    preventive: ISTA 3A pre-test on EVT packaging from now on
    verification_test: TST-21
    verified: '2026-10-09: 4/4 pass'
    due: '2026-10-31'
    closed: '2026-10-12'
  CAPA-06:
    title: 'DVT EoL: brew temperature low on 2 units (91.1, 91.4 °C)'
