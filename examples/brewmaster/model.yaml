simulations:
  SIM-01:
    name: Thermoblock dry-boil transient
    tool: COMSOL
    element: P-TB
    inputs:
      power_W: 1400
      mass_g: 450
      water: none
    outputs:
      t_to_150C_s: 4.2
      t_to_192C_TCO_s: 7.8
    requirements:
    - R-03
    status: done
    date: '2026-10-26'
    owner_team: TM-THERM
    notes: Software cutoff must act within 3 s of flow loss to stay below 150 °C; TCO is the backstop at 7.8 s.
    correlation: TST-03 worst 3.4 s vs predicted 3.0 s threshold
  SIM-02:
    name: Housing surface temperature
    tool: Ansys Icepak
    element: P-ENCL
    inputs:
      ambient_C: 25
      brew_cycles: 2
    outputs:
      trim_rise_K: 52
      pp_rise_K: 31
    requirements:
    - R-04
    status: done
    date: '2026-11-01'
    owner_team: TM-ID
    notes: Stainless trim at 52 K vs 60 K limit; margin thin near the shower head.
    correlation: TST-05 trim 49 K vs 52 K predicted
  SIM-03:
    name: Shower head CFD — bed wetting (ECO-001)
    tool: OpenFOAM
    element: P-SHOWER
    inputs:
