        direction: max
        unit: 1-5
        basis: sensory panel n=12
      BOM cost:
        direction: min
        unit: USD
      Standby energy:
        direction: min
        unit: W
        moe: MOE-10
      Drop robustness:
        direction: max
        unit: 1-5
        basis: IEC 60335-1 cl. 21
      Capacity:
        direction: max
        unit: ml
    raw:
      Glass 1.5 L + warm plate:
        Keep-warm at 120 min: 82
        BOM cost: 6.1
        Standby energy: 60
        Capacity: 1500
      Thermal stainless 1.2 L:
        Keep-warm at 120 min: 78
        BOM cost: 11.9
        Standby energy: 0
        Capacity: 1200
      Thermal stainless 1.5 L:
        Keep-warm at 120 min: 80
