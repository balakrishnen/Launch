  T-02:
    frm: S-IDLE
    to: S-HEAT
    trigger: brew start (dial, app, schedule)
    guard: water level > min and carafe present
    sensor: P-LEVEL
    func: F-08
  T-03:
    frm: S-HEAT
    to: S-BREW
    trigger: thermoblock at setpoint
    guard: ''
    sensor: P-NTC
    func: F-01
  T-04:
    frm: S-BREW
    to: S-WARM
    trigger: flow count = target or reservoir empty
    guard: ''
    sensor: P-FLOW
    func: F-02
  T-05:
    frm: S-WARM
    to: S-IDLE
    trigger: 120 min elapsed or carafe removed > 2 min
    guard: ''
    sensor: P-CARSW
    func: F-05
  T-06:
    frm: S-BREW
    to: S-FAULT
    trigger: no flow with heater on > 5 s or NTC out of range
    guard: ''
    sensor: P-NTC
    func: F-07
  T-07:
    frm: S-IDLE
    to: S-DESCALE
    trigger: user starts descale
    guard: ''
    sensor: null
    func: F-09
  T-08:
    frm: S-IDLE
    to: S-OFF
    trigger: 5 min idle
    guard: ''
    sensor: null
    func: F-12
constraints:
  C-01:
    name: Heat-up energy
    formula: t_heat_s = m_water_kg * 4186 * (T_set - T_in) / (P_heater_W * eta) <= 60
    inputs:
      m_water_kg: 0.15
      T_set: 94
      T_in: 20
      P_heater_W: 1400
      eta: 0.9
    reqs:
    - R-02
    tests:
    - TST-02
  C-02:
    name: Brew time
    formula: t_brew_s = V_ml / flow_ml_s + t_heat_s <= 360
    inputs:
      V_ml: 1500
      flow_ml_s: 5.2
      t_heat_s: 55
    reqs:
    - R-02
    tests:
    - TST-02
  C-03:
    name: Mains load (US)
    formula: P_total_W = P_heater + P_plate + P_pump + P_elec <= 1440
    inputs:
      P_heater: 1400
      P_plate: 0
      P_pump: 20
      P_elec: 5
    reqs:
    - R-02
    - R-05
    tests:
    - TST-06
  C-04:
    name: Standby power
    formula: P_standby_W = P_psu_idle + P_radio_sleep + P_mcu_sleep <= 0.5
    inputs:
      P_psu_idle: 0.18
      P_radio_sleep: 0.12
      P_mcu_sleep: 0.03
    reqs:
    - R-08
    tests:
    - TST-09
  C-05:
    name: Dry-boil cutoff
    formula: t_detect + t_sw + t_triac_off <= 5 s
    inputs:
      t_detect: 3.0
      t_sw: 0.2
      t_triac_off: 0.02
    reqs:
    - R-03
    tests:
    - TST-03
  C-06:
    name: Surface temperature
    formula: T_surface - T_ambient <= 60 K (metal) per 60335-1
    inputs:
      T_ambient: 25
    reqs:
    - R-04
    tests:
    - TST-05
