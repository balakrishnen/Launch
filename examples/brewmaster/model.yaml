arch_decisions:
  AD-01:
    title: Thermoblock heater, 1400 W, shared US/EU
    decision: Thermoblock 1400 W with triac control and TCO
    rationale: 'TD-01: meets MOE-02 with margin on both mains; one heater SKU'
    reqs:
    - R-01
    - R-02
    - R-03
    trade: TD-01
    consequences:
    - descale estimator required (R-07)
    - class-B software for heater control
  AD-02:
    title: Pre-certified Wi-Fi/BLE module on the platform ICD
    decision: ESP32-C3-MINI-1 module via UART ICD
    rationale: 'TD-03: certification schedule and platform reuse'
    reqs:
    - R-10
    - R-13
    - R-16
    trade: TD-03
    consequences:
    - host SDoC only
    - module EOL risk tracked with SUP-02
  AD-03:
    title: Stainless trim thermally isolated from the thermoblock
    decision: PP standoffs between trim and chassis; 8 mm air gap
    rationale: FD-05; SIM-02 trim rise 52 K → 49 K on TST-05
    reqs:
