meta:
  name: BrewMaster One
  version: DVT
  method: OOSEM
  description: 10-cup connected drip coffee maker, first product of a connected-kitchen platform (fictional). Passed DVT 2026-11-13; PVT build Feb 2027.
  system: P-BM1
  stage: Production
  business:
    price: 179
    target_cost: 58
    launch_date: '2027-09-01'
    channels:
    - Amazon
    - Target
    - D2C
    currency: USD
    builds:
      EVT: 25
      DVT: 120
      PVT: 600
    annual_volume: 150000
    incoterm: FCA Haiphong
    ppm_target: 500
    units_in_field: 40
stakeholders:
  STK-CONSUMER:
    name: Household consumer
    description: Wants consistent great coffee with zero fuss; schedules from the app; descales when told
    concerns: taste, speed, cleaning, safety
  STK-SAFETY:
    name: Safety & certification bodies (UL, NB)
    description: UL 1082 / IEC 60335-2-15 / 60730 compliance
    concerns: dry-boil, surface temp, leakage
  STK-SERVICE:
    name: Service network
    description: Repairs under 2-year warranty; needs field-replaceable board and clear diagnostics
    concerns: diagnosability, spares
  STK-MFG:
    name: Contract manufacturer (Vietnam)
    description: Molds, assembles, tests end-of-line
    concerns: yield, test time, cosmetic defects
  STK-PLATFORM:
    name: Connected-kitchen platform owner
    description: Controller/radio/HMI/app reused across kettle and grinder
    concerns: variant control, OTA
  STK-RETAIL:
    name: Retail & e-commerce
    description: Price point $179, packaging, energy label, reviews
    concerns: returns, star rating
moes:
  MOE-01:
    name: Brew water temperature at shower head
    target: '>= 92 and <= 96 °C, 10-cup brew, steady state'
  MOE-02:
    name: 10-cup brew time
    target: <= 360 s from start to drip-stop
  MOE-03:
    name: Schedule-to-ready notification latency
    target: <= 30 s app and machine
  MOE-04:
    name: Descale detection accuracy
    target: alert within ±10 % of 60 L at 15 °dH
  MOE-05:
    name: Dry-boil protection
    target: heater off within 5 s of empty, TCO never trips in normal use
  MOE-06:
    name: Certifications granted
    target: UL 1082, EN 60335-2-15, FCC/RED, food-contact DoC before PVT
  MOE-07:
    name: Main board replacement time
    target: <= 15 min with standard tools
  MOE-08:
    name: End-of-line test time
    target: <= 240 s
  MOE-09:
    name: Platform reuse
    target: controller, radio, HMI, app unchanged across 3 products
  MOE-10:
    name: Standby power
    target: <= 0.5 W networked standby
  MOE-11:
    name: Keep-warm plate temperature
    target: 80–85 °C carafe contents for 120 min
  MOE-12:
    name: Offline operation
    target: 100 % of core functions without cloud
needs:
  N-01:
    stk: STK-CONSUMER
    text: 'Brew coffee that tastes consistently good (Golden Cup: 92–96 °C, 18–22 % extraction)'
    moe: MOE-01
  N-02:
    stk: STK-CONSUMER
    text: Brew 10 cups in under 6 minutes
    moe: MOE-02
  N-03:
    stk: STK-CONSUMER
    text: Schedule a brew from the app and from the machine, and know when it's ready
    moe: MOE-03
  N-04:
    stk: STK-CONSUMER
    text: Know when to descale, and descale easily
    moe: MOE-04
  N-05:
    stk: STK-SAFETY
    text: Never overheat, boil dry, or expose hot surfaces beyond limits
    moe: MOE-05
  N-06:
    stk: STK-SAFETY
    text: Comply with US and EU appliance safety, EMC, radio, food-contact and energy rules
    moe: MOE-06
  N-07:
    stk: STK-SERVICE
    text: Diagnose and replace the main board in under 15 minutes
    moe: MOE-07
  N-08:
    stk: STK-MFG
    text: Assemble and test every unit end-of-line in under 4 minutes
    moe: MOE-08
  N-09:
    stk: STK-PLATFORM
    text: Share controller, radio, HMI and app with the kettle and grinder
    moe: MOE-09
  N-10:
    stk: STK-RETAIL
    text: Use ≤0.5 W in standby and carry the EU energy/standby compliance
    moe: MOE-10
  N-11:
    stk: STK-CONSUMER
    text: Keep coffee warm without burning it for 2 hours (plate variant)
    moe: MOE-11
  N-12:
    stk: STK-CONSUMER
    text: 'Work without the cloud: brew, schedule and alerts on the machine'
    moe: MOE-12
actors:
  AC-USER:
    name: Household consumer
  AC-APP:
    name: Mobile app / cloud
  AC-SVC:
    name: Service technician
  AC-OPS:
    name: Line operator
use_cases:
  UC-01:
    name: Brew a pot now
    actors:
    - AC-USER
    needs:
    - N-01
    - N-02
  UC-02:
    name: Schedule tomorrow morning
    actors:
    - AC-USER
    - AC-APP
    needs:
    - N-03
    - N-12
    includes:
    - UC-01
  UC-03:
    name: Keep coffee warm
    actors:
    - AC-USER
    needs:
    - N-11
  UC-04:
    name: Descale
    actors:
    - AC-USER
    - AC-APP
    needs:
    - N-04
  UC-05:
    name: Replace the main board
    actors:
    - AC-SVC
    needs:
    - N-07
  UC-06:
    name: Test at end of line
    actors:
    - AC-OPS
    needs:
    - N-08
  UC-07:
    name: Brew with Wi-Fi down
    actors:
    - AC-USER
    needs:
    - N-12
    includes:
    - UC-01
scenarios:
  SC-01:
    uc: UC-01
    name: Dial press → 10 cups in 6 min
    steps:
    - F-12
    - F-06
    - F-01
    - F-02
    - F-03
    - F-04
    - F-11
    concurrent:
    - F-07
    - F-14
    kind: nominal
  SC-02:
    uc: UC-02
    name: App schedule 07:00, notify when done
    steps:
    - F-10
    - F-08
    - F-01
    - F-02
    - F-03
    - F-08
    kind: nominal
  SC-03:
    uc: UC-03
    name: Warm for 120 min then off
    steps:
    - F-05
    - F-12
    kind: nominal
  SC-04:
    uc: UC-04
    name: Prompt, run descale cycle
    steps:
    - F-09
    - F-11
    - F-02
    - F-01
    kind: nominal
  SC-05:
    uc: UC-05
    name: Fault code → board swap → self-test
    steps:
    - F-11
    - F-13
    kind: nominal
  SC-06:
    uc: UC-06
    name: Hipot, ground bond, brew, flow cal
    steps:
    - F-13
    - F-01
    - F-02
    - F-06
    kind: nominal
  SC-07:
    uc: UC-07
    name: Offline brew and schedule from the dial
    steps:
    - F-12
    - F-08
    - F-01
    - F-02
    kind: alternate
    response: 'Router down: dial and on-machine schedule work; app commands queue until reconnect (TST-16, 23/23 functions)'
  SC-08:
    uc: UC-01
    name: 'Dry boil: reservoir reads water but is empty'
    steps:
    - F-06
    - F-07
    - F-11
    concurrent: []
    kind: exception
    triggers:
    - FA-F-01-unintended
    - FA-F-06-unintended
    response: 'Flow = 0 for 3 s while heating, or level and flow disagree: triac off within 5 s (TST-03 worst 3.4 s), E03 on HMI and app alert; stays in fault until refilled and power-cycled'
    ends_in: S-FAULT
  SC-09:
    uc: UC-01
    name: NTC opens during brew
    steps:
    - F-07
    - F-11
    concurrent: []
    kind: exception
    triggers:
    - FA-F-07-wrong_timing
    response: 'NTC input reads above 3.2 V: heater off in 0.3 s, E02 on HMI and app; service replaces the thermoblock (UC-05)'
    ends_in: S-FAULT
  SC-10:
    uc: UC-01
    name: 'Software protection fails: TCO trips'
    steps:
    - F-07
    concurrent: []
    kind: exception
    triggers:
    - FA-F-07-loss
    response: 'TCO opens at 192 °C rating (TST-04: 9.1 s, block 196 to 198 °C); heater circuit permanently open, display stays on with E05; warranty replacement of the thermoblock assembly'
    ends_in: S-FAULT
  SC-11:
    uc: UC-01
    name: Carafe removed mid-brew
    steps:
    - F-04
    - F-02
    - F-12
    concurrent: []
    kind: alternate
    triggers:
    - FA-F-04-unintended
    response: 'Carafe switch opens: pump pauses, drip-stop closes (≤ 2 g over 60 s, TST-19); brew resumes within 2 s of return, aborted if absent for more than 5 min'
    ends_in: S-BREW
  SC-12:
    uc: UC-01
    name: Water spilled on the top cover while brewing
    steps:
    - F-14
    - F-11
    concurrent: []
    kind: exception
    triggers:
    - FA-F-14-unintended
    response: Drip ledge and labyrinth carry water away from HMI and mains wiring; no function lost, insulation stays above limit (TST-25, 310 MΩ)
    ends_in: S-BREW
  SC-13:
    uc: UC-01
    name: Housing cracked in transit, user tries to brew
    steps:
    - F-14
    - F-12
    concurrent: []
    kind: exception
    triggers:
    - FA-F-14-loss
    response: Cord anchorage holds and live parts stay behind inner barriers (ISTA 3A, TST-21); quick-start card tells the user not to use a damaged unit; retailer replacement
    ends_in: S-OFF
  SC-14:
    uc: UC-02
    name: Power cut before the scheduled brew
    steps:
    - F-08
    - F-11
    concurrent: []
    kind: alternate
    triggers: []
    response: Schedule kept in flash and RTC re-synced on reconnect; if power returns more than 30 min after the scheduled time the brew is skipped and the app is told
    ends_in: S-IDLE
  SC-15:
    uc: UC-03
    name: Carafe lifted and replaced during keep-warm
    steps:
    - F-05
    - F-12
    concurrent: []
    kind: alternate
    triggers:
    - FA-F-05-degraded
    response: Keep-warm state retained for up to 30 s carafe absence (FW 2.3, CAPA-04); plate off if absent longer
    ends_in: S-WARM
  SC-16:
    uc: UC-04
    name: Reservoir runs dry during descale
    steps:
    - F-09
    - F-06
    - F-11
    concurrent: []
    kind: exception
    triggers:
    - FA-F-06-loss
    response: Descale pauses with heater off, prompts refill on HMI and app, resumes at the interrupted step
    ends_in: S-DESCALE
  SC-17:
    uc: UC-05
    name: Replacement main board fails self-test
    steps:
    - F-13
    - F-11
    concurrent: []
    kind: exception
    triggers: []
    response: Self-test reports the failing channel; technician returns the board (RMA) and the unit is not handed back to the user
    ends_in: S-FAULT
  SC-18:
    uc: UC-06
    name: End-of-line tester stops catching hipot failures
    steps:
    - F-13
    concurrent: []
    kind: exception
    triggers:
    - FA-F-13-unintended
    - FA-F-13-loss
    response: Shift-start known-bad sample (5 MΩ leak) must fail; if it passes the line stops and units since the last good check are quarantined; MES blocks pack-out without an EoL pass record
    ends_in: S-OFF
regulations:
  REG-UL1082:
    name: UL 1082 — Household electric coffee makers
    market: US/CA
    trigger: coffee maker sold in the US
    standard: UL 1082
  REG-60335-2-15:
    name: IEC/EN 60335-2-15 — Appliances for heating liquids
    market: EU
    trigger: coffee maker sold in the EU
    standard: IEC 60335-2-15
  REG-60730:
    name: IEC/UL 60730-1 Annex H — Automatic controls, software class B
    market: EU/US
    trigger: software-controlled thermal cutoff
    standard: IEC 60730-1
  REG-FCC:
    name: FCC Part 15 B/C
    market: US
    trigger: digital electronics + Wi-Fi/BLE module
    standard: 47 CFR 15
  REG-RED:
    name: Radio Equipment Directive incl. art. 3.3 cybersecurity
    market: EU
    trigger: connected appliance
    standard: EN 300 328; EN 18031
  REG-EMC:
    name: EN 55014-1/-2, IEC 61000-3-2/-3-3
    market: EU
    trigger: mains-powered appliance with heater
    standard: EN 55014; IEC 61000-3-2
  REG-FOOD:
    name: FDA 21 CFR 174–178 / EU 1935/2004 food contact
    market: US/EU
    trigger: water and coffee contact materials
    standard: 21 CFR 177; EU 10/2011
  REG-STANDBY:
    name: EU 2023/826 standby & networked standby
    market: EU
    trigger: networked appliance
    standard: EU 2023/826
  REG-ROHS:
    name: RoHS / REACH / WEEE
    market: EU
    trigger: electronics sold in the EU
    standard: 2011/65/EU; 2012/19/EU
  REG-PROP65:
    name: California Proposition 65
    market: US-CA
    trigger: consumer product sold in California
    standard: Cal. HSC §25249
requirements:
  R-01:
    type: PERF
    text: Water at the shower head shall be 92–96 °C throughout a 10-cup brew after the first 100 ml.
    verify: test
    tests:
    - TST-01
    - TST-30
    from_:
    - N-01
    regs:
    - REG-UL1082
    uc:
    - UC-01
    attr: brew_temp_c >= 92
  R-02:
    type: PERF
    text: A 10-cup (1,500 ml) brew shall complete in ≤ 360 s from start to drip-stop at 230 V and 120 V.
    verify: test
    tests:
    - TST-02
    from_:
    - N-02
    regs: []
    uc:
    - UC-01
    attr: brew_time_s <= 360
  R-03:
    type: SAFE
    text: The heater shall be de-energised within 5 s of the water system detecting an empty reservoir or no flow, independently by software (class B) and by the TCO.
    verify: test
    tests:
    - TST-03
    - TST-04
    - TST-28
    from_:
    - N-05
    regs:
    - REG-60730
    - REG-UL1082
    - REG-60335-2-15
    uc:
    - UC-01
    attr: dry_boil_cutoff_s <= 5
  R-04:
    type: SAFE
    text: Accessible surfaces shall not exceed the 60335-1 limits (metal 60 K rise, plastic 75 K rise) during and after brew.
    verify: test
    tests:
    - TST-05
    from_:
    - N-05
    regs:
    - REG-60335-2-15
    uc:
    - UC-01
    attr: surface_rise_K <= 60
  R-05:
    type: REGU
    text: The product shall obtain UL 1082 (US) and EN 60335-1/-2-15 (EU) certification before PVT.
    verify: inspection
    tests:
    - TST-06
    from_:
    - N-06
    regs:
    - REG-UL1082
    - REG-60335-2-15
    uc:
    - UC-01
    attr: certification = granted
  R-06:
    type: FUNC
    text: The user shall be able to schedule a brew from the app and from the dial; the machine shall notify ready state on the display, by tone and by push within 30 s.
    verify: test
    tests:
    - TST-07
    from_:
    - N-03
    regs: []
    uc:
    - UC-02
    attr: notify_latency_s <= 30
  R-07:
    type: FUNC
    text: The controller shall estimate scale build-up from water hardness and volume and prompt descaling within ±10 % of the 60 L (15 °dH) reference.
    verify: analysis
    tests:
    - TST-08
    from_:
    - N-04
    regs: []
    uc:
    - UC-04
    attr: descale_error_pct <= 10
  R-08:
    type: PERF
    text: Networked standby power shall be ≤ 0.5 W; the display shall power down after 5 min idle.
    verify: test
    tests:
    - TST-09
    from_:
    - N-10
    regs:
    - REG-STANDBY
    uc:
    - UC-02
    attr: standby_W <= 0.5
  R-09:
    type: REGU
    text: All water- and coffee-contact materials shall have FDA and EU 10/2011 declarations of compliance.
    verify: inspection
    tests:
    - TST-10
    from_:
    - N-06
    regs:
    - REG-FOOD
    uc:
    - UC-01
    attr: food_contact_doc = complete
  R-10:
    type: REGU
    text: Radiated/conducted emissions shall meet FCC 15B class B and EN 55014-1; harmonics IEC 61000-3-2 class A with the 1,400 W heater.
    verify: test
    tests:
    - TST-11
    from_:
    - N-06
    regs:
    - REG-FCC
    - REG-EMC
    uc:
    - UC-01
    attr: emc = pass
  R-11:
    type: MAINT
    text: The main board shall be replaceable in ≤ 15 min with a Torx T20 and no soldering; the HMI shall display a fault code for every detected failure.
    verify: demonstration
    tests:
    - TST-12
    from_:
    - N-07
    regs: []
    uc:
    - UC-05
    attr: board_swap_min <= 15
  R-12:
    type: MFG
    text: Every unit shall pass an end-of-line test (hipot, ground bond, brew cycle with water, Wi-Fi provisioning) in ≤ 240 s.
    verify: test
    tests:
    - TST-13
    from_:
    - N-08
    regs: []
    uc:
    - UC-06
    attr: eol_s <= 240
  R-13:
    type: IFACE
    text: Controller, radio module, HMI and app shall interface through the platform ICD so the same parts serve the kettle and grinder.
    verify: inspection
    tests:
    - TST-14
    from_:
    - N-09
    regs: []
    uc:
    - UC-05
    attr: platform_icd = conformant
  R-14:
    type: PERF
    text: The keep-warm plate shall hold carafe contents at 80–85 °C for 120 min then shut off.
    verify: test
    tests:
    - TST-15
    from_:
    - N-11
    regs:
    - REG-UL1082
    uc:
    - UC-03
    attr: keepwarm_c >= 80
  R-15:
    type: FUNC
    text: All brew, schedule and alert functions shall work with no network; cloud adds remote start and telemetry only.
    verify: test
    tests:
    - TST-16
    from_:
    - N-12
    regs:
    - REG-RED
    uc:
    - UC-07
    attr: offline = true
  R-16:
    type: SEC
    text: Firmware updates shall be signed; no default passwords; Wi-Fi credentials stored encrypted (EN 18031).
    verify: inspection
    tests:
    - TST-17
    - TST-29
    from_:
    - N-06
    regs:
    - REG-RED
    uc:
    - UC-02
    attr: security = EN18031
  R-17:
    type: PERF
    text: Shower head shall wet ≥ 90 % of the coffee bed within the first 60 s (extraction uniformity).
    verify: test
    tests:
    - TST-18
    from_:
    - N-01
    regs: []
    uc:
    - UC-01
    attr: bed_wetting_pct >= 90
  R-18:
    type: SAFE
    text: The carafe-present switch shall stop drip within 2 s of carafe removal and resume on return.
    verify: test
    tests:
    - TST-19
    from_:
    - N-05
    regs:
    - REG-UL1082
    uc:
    - UC-01
    attr: dripstop_s <= 2
  R-19:
    type: PERF
    text: The packaged product shall pass ISTA 3A with no functional damage and no cosmetic defect on class-A surfaces.
    verify: test
    tests:
    - TST-21
    from_:
    - N-06
    regs: []
    attr: ista_3a == pass
    uc:
    - UC-01
  R-20:
    type: PERF
    text: The product shall complete 3,650 brew cycles (10 years at one pot per day) with brew time ≤ 400 s and no safety-relevant failure.
    verify: test
    tests:
    - TST-20
    from_:
    - N-02
    - N-05
    regs: []
    attr: brew_cycles >= 3650
    uc:
    - UC-01
  R-21:
    type: SAFE
    text: The carafe shall withstand a thermal shock of 96 °C contents into 0 °C water bath (ΔT ≥ 96 K) and a 120 K oven shock without fracture.
    verify: test
    tests:
    - TST-22
    from_:
    - N-05
    regs:
    - REG-60335-2-15
    attr: thermal_shock_K >= 120
    uc:
    - UC-03
  R-22:
    type: PERF
    text: The HMI dial shall survive 50,000 detent rotations and 20,000 presses with no missed or double counts.
    verify: test
    tests:
    - TST-23
    from_:
    - N-03
    regs: []
    attr: dial_cycles >= 50000
    uc:
    - UC-02
  R-23:
    type: SAFE
    text: Spilling 0.5 L of water on the top cover and overfilling the reservoir by 20 % shall not reduce insulation below 60335-1 cl. 15 limits.
    verify: test
    tests:
    - TST-25
    from_:
    - N-05
    regs:
    - REG-60335-2-15
    - REG-UL1082
    attr: insulation_after_spill_Mohm >= 2
    uc:
    - UC-01
  R-24:
    type: FUNC
    text: The descale prompt shall appear on the HMI and in the app with a step-by-step guided cycle; 7 of 8 untrained users shall complete descaling without help.
    verify: test
    tests:
    - TST-26
    from_:
    - N-04
    regs: []
    attr: descale_task_success >= 0.875
    uc:
    - UC-04
  R-25:
    type: REGU
    text: All homogeneous materials shall meet RoHS (EU 2011/65 + 2015/863) and REACH SVHC < 0.1 % w/w; Proposition 65 warning assessment documented for US.
    verify: inspection
    tests:
    - TST-27
    from_:
    - N-06
    regs:
    - REG-ROHS
    - REG-PROP65
    attr: rohs_declarations == 100%
    uc:
    - UC-01
functions:
  F-01:
    name: Heat brew water to setpoint
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-01
    - R-03
    - R-04
    - R-20
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-02:
    name: Meter and deliver water to the shower head
    alloc:
    - P-RES
    - P-LEVEL
    - P-PUMP
    - P-FLOW
    reqs:
    - R-02
    - R-17
    perf: ''
    safety_decision: ''
  F-03:
    name: Distribute water over the coffee bed
    alloc:
    - P-SHOWER
    - P-BASKET
    - P-CARAFE
    - P-CARSW
    reqs:
    - R-17
    perf: ''
    safety_decision: ''
  F-04:
    name: Control drip to the carafe
    alloc:
    - P-SHOWER
    - P-BASKET
    - P-CARAFE
    - P-CARSW
    reqs:
    - R-18
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-05:
    name: Keep coffee warm
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-14
    - R-04
    - R-21
    perf: ''
    safety_decision: ''
  F-06:
    name: Detect water level and flow
    alloc:
    - P-RES
    - P-LEVEL
    - P-PUMP
    - P-FLOW
    reqs:
    - R-03
    - R-07
    perf: ''
    safety_decision: ''
  F-07:
    name: Protect against dry boil and overtemperature
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-03
    - R-04
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-08:
    name: Run brew schedules and notify
    alloc:
    - P-MAIN
    - P-MCU
    - P-PSU
    - P-FW
    reqs:
