meta:
  name: BrewMaster One
  version: '0.1'
  method: OOSEM
  description: 10-cup connected drip coffee maker — first product of a connected-kitchen
    platform (fictional)
  system: P-BM1
  stage: Development
  business:
    price: 179
    target_cost: 58
    launch_date: '2027-09-01'
    channels:
    - Amazon
    - Target
    - D2C
    currency: USD
    builds:
      EVT: 25
      DVT: 120
      PVT: 600
    annual_volume: 150000
    incoterm: FCA Haiphong
    ppm_target: 500
    units_in_field: 0
stakeholders:
  STK-CONSUMER:
    name: Household consumer
    description: Wants consistent great coffee with zero fuss; schedules from the
      app; descales when told
    concerns: taste, speed, cleaning, safety
  STK-SAFETY:
    name: Safety & certification bodies (UL, NB)
    description: UL 1082 / IEC 60335-2-15 / 60730 compliance
    concerns: dry-boil, surface temp, leakage
  STK-SERVICE:
    name: Service network
    description: Repairs under 2-year warranty; needs field-replaceable board and
      clear diagnostics
    concerns: diagnosability, spares
  STK-MFG:
    name: Contract manufacturer (Vietnam)
    description: Molds, assembles, tests end-of-line
    concerns: yield, test time, cosmetic defects
  STK-PLATFORM:
    name: Connected-kitchen platform owner
    description: Controller/radio/HMI/app reused across kettle and grinder
    concerns: variant control, OTA
  STK-RETAIL:
    name: Retail & e-commerce
    description: Price point $179, packaging, energy label, reviews
    concerns: returns, star rating
moes:
  MOE-01:
    name: Brew water temperature at shower head
    target: '>= 92 and <= 96 °C, 10-cup brew, steady state'
  MOE-02:
    name: 10-cup brew time
    target: <= 360 s from start to drip-stop
  MOE-03:
    name: Schedule-to-ready notification latency
    target: <= 30 s app and machine
  MOE-04:
    name: Descale detection accuracy
    target: alert within ±10 % of 60 L at 15 °dH
  MOE-05:
    name: Dry-boil protection
    target: heater off within 5 s of empty, TCO never trips in normal use
  MOE-06:
    name: Certifications granted
    target: UL 1082, EN 60335-2-15, FCC/RED, food-contact DoC before PVT
  MOE-07:
    name: Main board replacement time
    target: <= 15 min with standard tools
  MOE-08:
    name: End-of-line test time
    target: <= 240 s
  MOE-09:
    name: Platform reuse
    target: controller, radio, HMI, app unchanged across 3 products
  MOE-10:
    name: Standby power
    target: <= 0.5 W networked standby
  MOE-11:
    name: Keep-warm plate temperature
    target: 80–85 °C carafe contents for 120 min
  MOE-12:
    name: Offline operation
    target: 100 % of core functions without cloud
needs:
  N-01:
    stk: STK-CONSUMER
    text: 'Brew coffee that tastes consistently good (Golden Cup: 92–96 °C, 18–22
      % extraction)'
    moe: MOE-01
  N-02:
    stk: STK-CONSUMER
    text: Brew 10 cups in under 6 minutes
    moe: MOE-02
  N-03:
    stk: STK-CONSUMER
    text: Schedule a brew from the app and from the machine, and know when it's ready
    moe: MOE-03
  N-04:
    stk: STK-CONSUMER
    text: Know when to descale, and descale easily
    moe: MOE-04
  N-05:
    stk: STK-SAFETY
    text: Never overheat, boil dry, or expose hot surfaces beyond limits
    moe: MOE-05
  N-06:
    stk: STK-SAFETY
    text: Comply with US and EU appliance safety, EMC, radio, food-contact and energy
      rules
    moe: MOE-06
  N-07:
    stk: STK-SERVICE
    text: Diagnose and replace the main board in under 15 minutes
    moe: MOE-07
  N-08:
    stk: STK-MFG
    text: Assemble and test every unit end-of-line in under 4 minutes
    moe: MOE-08
  N-09:
    stk: STK-PLATFORM
    text: Share controller, radio, HMI and app with the kettle and grinder
    moe: MOE-09
  N-10:
    stk: STK-RETAIL
    text: Use ≤0.5 W in standby and carry the EU energy/standby compliance
    moe: MOE-10
  N-11:
    stk: STK-CONSUMER
    text: Keep coffee warm without burning it for 2 hours (plate variant)
    moe: MOE-11
  N-12:
    stk: STK-CONSUMER
    text: 'Work without the cloud: brew, schedule and alerts on the machine'
    moe: MOE-12
actors: {}
use_cases: {}
scenarios: {}
regulations:
  REG-UL1082:
    name: UL 1082 — Household electric coffee makers
    market: US/CA
    trigger: coffee maker sold in the US
    standard: UL 1082
  REG-60335-2-15:
    name: IEC/EN 60335-2-15 — Appliances for heating liquids
    market: EU
    trigger: coffee maker sold in the EU
    standard: IEC 60335-2-15
  REG-60730:
    name: IEC/UL 60730-1 Annex H — Automatic controls, software class B
    market: EU/US
    trigger: software-controlled thermal cutoff
    standard: IEC 60730-1
  REG-FCC:
    name: FCC Part 15 B/C
    market: US
    trigger: digital electronics + Wi-Fi/BLE module
    standard: 47 CFR 15
  REG-RED:
    name: Radio Equipment Directive incl. art. 3.3 cybersecurity
    market: EU
    trigger: connected appliance
    standard: EN 300 328; EN 18031
  REG-EMC:
    name: EN 55014-1/-2, IEC 61000-3-2/-3-3
    market: EU
    trigger: mains-powered appliance with heater
    standard: EN 55014; IEC 61000-3-2
  REG-FOOD:
    name: FDA 21 CFR 174–178 / EU 1935/2004 food contact
    market: US/EU
    trigger: water and coffee contact materials
    standard: 21 CFR 177; EU 10/2011
  REG-STANDBY:
    name: EU 2023/826 standby & networked standby
    market: EU
    trigger: networked appliance
    standard: EU 2023/826
  REG-ROHS:
    name: RoHS / REACH / WEEE
    market: EU
    trigger: electronics sold in the EU
    standard: 2011/65/EU; 2012/19/EU
  REG-PROP65:
    name: California Proposition 65
    market: US-CA
    trigger: consumer product sold in California
    standard: Cal. HSC §25249
requirements:
  R-01:
    type: PERF
    text: Water at the shower head shall be 92–96 °C throughout a 10-cup brew after
      the first 100 ml.
    verify: test
    tests:
    - TST-01
    from_:
    - N-01
    regs:
    - REG-UL1082
    uc: []
    attr: brew_temp_c >= 92
  R-02:
    type: PERF
    text: A 10-cup (1,500 ml) brew shall complete in ≤ 360 s from start to drip-stop
      at 230 V and 120 V.
    verify: test
    tests:
    - TST-02
    from_:
    - N-02
    regs: []
    uc: []
    attr: brew_time_s <= 360
  R-03:
    type: SAFE
    text: The heater shall be de-energised within 5 s of the water system detecting
      an empty reservoir or no flow, independently by software (class B) and by the
      TCO.
    verify: test
    tests:
    - TST-03
    - TST-04
    from_:
    - N-05
    regs:
    - REG-60730
    - REG-UL1082
    - REG-60335-2-15
    uc: []
    attr: dry_boil_cutoff_s <= 5
  R-04:
    type: SAFE
    text: Accessible surfaces shall not exceed the 60335-1 limits (metal 60 K rise,
      plastic 75 K rise) during and after brew.
    verify: test
    tests:
    - TST-05
    from_:
    - N-05
    regs:
    - REG-60335-2-15
    uc: []
    attr: surface_rise_K <= 60
  R-05:
    type: REGU
    text: The product shall obtain UL 1082 (US) and EN 60335-1/-2-15 (EU) certification
      before PVT.
    verify: inspection
    tests:
    - TST-06
    from_:
    - N-06
    regs:
    - REG-UL1082
    - REG-60335-2-15
    uc: []
    attr: certification = granted
  R-06:
    type: FUNC
    text: The user shall be able to schedule a brew from the app and from the dial;
      the machine shall notify ready state on the display, by tone and by push within
      30 s.
    verify: test
    tests:
    - TST-07
    from_:
    - N-03
    regs: []
    uc: []
    attr: notify_latency_s <= 30
  R-07:
    type: FUNC
    text: The controller shall estimate scale build-up from water hardness and volume
      and prompt descaling within ±10 % of the 60 L (15 °dH) reference.
    verify: analysis
    tests:
    - TST-08
    from_:
    - N-04
    regs: []
    uc: []
    attr: descale_error_pct <= 10
  R-08:
    type: PERF
    text: Networked standby power shall be ≤ 0.5 W; the display shall power down after
      5 min idle.
    verify: test
    tests:
    - TST-09
    from_:
    - N-10
    regs:
    - REG-STANDBY
    uc: []
    attr: standby_W <= 0.5
  R-09:
    type: REGU
    text: All water- and coffee-contact materials shall have FDA and EU 10/2011 declarations
      of compliance.
    verify: inspection
    tests:
    - TST-10
    from_:
    - N-06
    regs:
    - REG-FOOD
    uc: []
    attr: food_contact_doc = complete
  R-10:
    type: REGU
    text: Radiated/conducted emissions shall meet FCC 15B class B and EN 55014-1;
      harmonics IEC 61000-3-2 class A with the 1,400 W heater.
    verify: test
    tests:
    - TST-11
    from_:
    - N-06
    regs:
    - REG-FCC
    - REG-EMC
    uc: []
    attr: emc = pass
  R-11:
    type: MAINT
    text: The main board shall be replaceable in ≤ 15 min with a Torx T20 and no soldering;
      the HMI shall display a fault code for every detected failure.
    verify: demonstration
    tests:
    - TST-12
    from_:
    - N-07
    regs: []
    uc: []
    attr: board_swap_min <= 15
  R-12:
    type: MFG
    text: Every unit shall pass an end-of-line test (hipot, ground bond, brew cycle
      with water, Wi-Fi provisioning) in ≤ 240 s.
    verify: test
    tests:
    - TST-13
    from_:
    - N-08
    regs: []
    uc: []
    attr: eol_s <= 240
  R-13:
    type: IFACE
    text: Controller, radio module, HMI and app shall interface through the platform
      ICD so the same parts serve the kettle and grinder.
    verify: inspection
    tests:
    - TST-14
    from_:
    - N-09
    regs: []
    uc: []
    attr: platform_icd = conformant
  R-14:
    type: PERF
    text: The keep-warm plate shall hold carafe contents at 80–85 °C for 120 min then
      shut off.
    verify: test
    tests:
    - TST-15
    from_:
    - N-11
    regs:
    - REG-UL1082
    uc: []
    attr: keepwarm_c >= 80
  R-15:
    type: FUNC
    text: All brew, schedule and alert functions shall work with no network; cloud
      adds remote start and telemetry only.
    verify: test
    tests:
    - TST-16
    from_:
    - N-12
    regs:
    - REG-RED
    uc: []
    attr: offline = true
  R-16:
    type: SEC
    text: Firmware updates shall be signed; no default passwords; Wi-Fi credentials
      stored encrypted (EN 18031).
    verify: inspection
    tests:
    - TST-17
    from_:
    - N-06
    regs:
    - REG-RED
    uc: []
    attr: security = EN18031
  R-17:
    type: PERF
    text: Shower head shall wet ≥ 90 % of the coffee bed within the first 60 s (extraction
      uniformity).
    verify: test
    tests:
    - TST-18
    from_:
    - N-01
    regs: []
    uc: []
    attr: bed_wetting_pct >= 90
  R-18:
    type: SAFE
    text: The carafe-present switch shall stop drip within 2 s of carafe removal and
      resume on return.
    verify: test
    tests:
    - TST-19
    from_:
    - N-05
    regs:
    - REG-UL1082
    uc: []
    attr: dripstop_s <= 2
functions:
  F-01:
    name: Heat brew water to setpoint
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-01
    - R-03
    - R-04
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-02:
    name: Meter and deliver water to the shower head
    alloc:
    - P-RES
    - P-LEVEL
    - P-PUMP
    - P-FLOW
    reqs:
    - R-02
    - R-17
    perf: ''
    safety_decision: ''
  F-03:
    name: Distribute water over the coffee bed
    alloc:
    - P-SHOWER
    - P-BASKET
    - P-CARAFE
    - P-CARSW
    reqs:
    - R-17
    perf: ''
    safety_decision: ''
  F-04:
    name: Control drip to the carafe
    alloc:
    - P-SHOWER
    - P-BASKET
    - P-CARAFE
    - P-CARSW
    reqs:
    - R-18
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-05:
    name: Keep coffee warm
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-14
    - R-04
    perf: ''
    safety_decision: ''
  F-06:
    name: Detect water level and flow
    alloc:
    - P-RES
    - P-LEVEL
    - P-PUMP
    - P-FLOW
    reqs:
    - R-03
    - R-07
    perf: ''
    safety_decision: ''
  F-07:
    name: Protect against dry boil and overtemperature
    alloc:
    - P-TB
    - P-NTC
    - P-TCO
    - P-PLATE
    - P-TRIAC
    reqs:
    - R-03
    - R-04
    perf: ''
    safety_decision: safety-critical (60730 class B)
  F-08:
    name: Run brew schedules and notify
    alloc:
    - P-MAIN
    - P-MCU
    - P-PSU
    - P-FW
    reqs:
    - R-06
    - R-15
    perf: ''
    safety_decision: ''
  F-09:
    name: Estimate scale and prompt descaling
    alloc:
    - P-RES
    - P-LEVEL
    - P-PUMP
    - P-FLOW
    reqs:
    - R-07
    perf: ''
    safety_decision: ''
  F-10:
    name: Connect to app and cloud securely
    alloc:
    - P-RADIO
    - P-APP
    reqs:
    - R-15
    - R-16
    perf: ''
    safety_decision: ''
  F-11:
    name: Present status and faults on the HMI
    alloc:
    - P-HMI
    reqs:
    - R-06
    - R-11
    perf: ''
    safety_decision: ''
  F-12:
    name: Manage power and standby
    alloc:
    - P-MAIN
    - P-MCU
    - P-PSU
    - P-FW
    reqs:
    - R-08
    perf: ''
    safety_decision: ''
  F-13:
    name: Self-test at end of line and in service
    alloc:
    - P-MAIN
    - P-MCU
    - P-PSU
    - P-FW
    reqs:
    - R-12
    - R-11
    perf: ''
    safety_decision: ''
logical_components:
  LC-THERMAL:
    name: Thermal control
    role: Thermal control
    funcs:
    - F-01
