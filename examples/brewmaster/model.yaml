findings:
  FD-01:
    title: No independent cutoff if the triac shorts and software is healthy
    severity: critical
    status: closed
    element: IF-02
    source: RV-01
    owner: Tom Becker
    action: TCO in heater line (IF-04) confirmed; relay backup rejected on cost
    due: '2026-02-15'
    gate: G1
    closed: '2026-02-10'
  FD-02:
    title: Dry-boil detection threshold not derived from thermoblock thermal mass
    severity: critical
    status: closed
    element: C-05
    source: RV-01
    owner: Dev Patel
    action: 3 s threshold derived from SIM-01; verified on TST-03 (worst 3.4 s)
    due: '2026-05-30'
    gate: EVT
    closed: '2026-05-22'
  FD-03:
    title: Requirement R-17 wetting has no sample size
    severity: minor
    status: closed
    element: R-17
    source: RV-01
    owner: Priya Raman
    action: n = 5 units × 3 brews added to TP-118
    due: '2026-02-28'
    gate: G1
    closed: '2026-02-20'
  FD-04:
