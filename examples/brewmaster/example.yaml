title: BrewMaster One
company: Fictional connected-kitchen appliance maker
url: ""
process: appliance_npi
spacing_days: 42
category: Consumer appliance · connected 10-cup drip coffee maker
summary: 1,400 W thermoblock drip coffee maker with Wi-Fi/BLE scheduling, descale estimation, keep-warm plate and a controller/radio/HMI platform shared with a kettle and grinder. US + EU, $179.
why: >
  The archetypal small-team appliance program: UL 1082 vs EN 60335-2-15, 60730 class-B software for the thermal cutoff,
  food-contact declarations, EMC with a big resistive heater, RED cybersecurity for the radio, EU networked-standby limits,
  a contract manufacturer with an end-of-line test budget, and a platform reused across products. The seed leaves the
  DFMEA, PFMEA, suppliers and the appliance NPI deliverables for the agents and teams to close.
seeded: 6 stakeholders, 12 needs with MoEs, 10 regulations, 18 requirements, 13 functions, 6 logical components, 23 parts with disciplines, 16 interfaces incl. mains/sensor nets, 7-state machine, 19 tests, 10 teams (brew, thermal & water, controls & connectivity, ID & enclosure + functional), 3 suppliers, 5 process steps
assess:
  - Adopt the "Appliance NPI" process (G0 → G1 → EVT → DVT → PVT → MP) under Lifecycle → PDP and look at the gate × team deliverable matrix.
  - Run the risk agent on the thermal subsystem — dry boil, NTC drift, triac short, TCO nuisance trip should come out High AP with tests, and the 60730 class-B software items should land in the firmware part.
  - Ask the dfx agent to run Design for Safety, Manufacturing, Service and Testability — the EoL test budget (R-12) and board swap (R-11) are the anchors.
  - Ask the cad agent to model the brew basket and shower head natively, then check envelope and mates against IF-14/IF-15.
  - Open Design definition → Electrical: the netlist from the interfaces gives the mains, heater, pump and sensor nets; export the KiCad netlist and the wire list.
  - Ask the compliance agent to complete the regulation → requirement coverage (standby and RoHS have no requirement yet) and build the certification plan.
prompts:
  - Assess every failure-mode candidate of the thermal control and water delivery components; derive causes from the architecture and tie High AP items to tests
  - Run the Design for Safety and Design for Manufacturing reviews with evidence
  - Write the missing requirements for the standby and RoHS regulations and plan UL 1082 / EN 60335-2-15 certification
  - Model the shower head in CAD: 70 mm diameter, 2 mm wall, 19 holes of 1.2 mm in a hex pattern, boss for IF-14
  - Plan the EVT gate — work items and handoffs for every failing deliverable
