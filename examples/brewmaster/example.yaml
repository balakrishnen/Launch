title: BrewMaster One
company: Fictional connected-kitchen appliance maker
url: ''
process: appliance_npi
spacing_days: 42
category: Consumer appliance · connected 10-cup drip coffee maker
summary: 1,400 W thermoblock drip coffee maker with Wi-Fi/BLE scheduling, descale estimation, keep-warm plate and a controller/radio/HMI platform shared with a kettle and grinder. US + EU, $179. Passed
  DVT on 2026-11-13 (conditional); PVT build February 2027.
why: 'A complete program one week after DVT exit: every artifact a hardware company keeps is filled from the same graph. 183-row AIAG-VDA DFMEA/PFMEA with optimization actions, owners and evidence; a 30-test
  DVP&R with EVT and DVT results; an AIAG control plan for 10 process steps; 145 serialised EVT/DVT units with station data; tooling through T2 and PPAP; six CAPAs in 8D form; six ECOs; quotes, POs and
  incoming inspection for 22 suppliers'' parts; four gate reviews with findings; beta-field FRACAS; approved claims. What is still open is what is really open going into PVT.'
seeded: 7 stakeholders, 12 needs, 10 regulations, 25 requirements, 14 functions, 7 logical components, 23 parts, 16 interfaces with ICD characteristics, 30 tests and 120+ runs, 27 staffed teams, 12 suppliers,
  10 process steps, 6 tools, 6 CAPAs, 6 ECOs, 145 units, 4 gate reviews
assess:
- 'Open Lifecycle → PDP: G0 to DVT are passed; DVT shows the one waived deliverable (CAPA-06) behind the conditional exit, and PVT shows what is left.'
- 'Open the DFMEA form: every High and Medium AP row has prevention and detection actions, owner, dates, evidence and revised S/O/D/AP.'
- 'Open the DVP&R: 30 tests with procedures, acceptance criteria, sample sizes, timing and results from EVT and DVT runs; TST-20 life test is the open DVT condition.'
- 'Open Industrialization → control plan and PFMEA: 10 process steps, characteristics with spec, measurement, sample size, frequency and reaction plan.'
- 'Open Quality → CAPA and FRACAS: EVT/DVT problems closed through 8D; beta field events tied to failure modes.'
- 'Ask the program agent: what must close before the PVT build on 2027-02-01?'
prompts:
- What must close before the PVT build on 2027-02-01, by team?
- Which DFMEA actions are still open and which tests verify them?
- Draft the PVT entry review agenda from the open findings, CAPAs, risks and deliverables
- Show the impact of ECO-005 on tests, tooling and open purchase orders
- Why is SUP-03 over the PPM target and what is the plan?
process_start: '2025-12-01'
waivers:
  D-LQ-CAPA:
    reason: 'Conditional DVT exit (RV-04): CAPA-06 from the DVT build is open with containment in place; closure due 2027-01-31, before the PVT build'
    by: Maya Torres
    date: '2026-11-13'
