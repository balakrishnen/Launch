    - F-10
states:
  S-OFF:
    name: De-energised
  S-FILL:
    name: Filled & leak-checked
  S-BOOT:
    name: Booting & attesting
  S-RUN:
    name: In fleet
  S-DEGRADED:
    name: Degraded (tray isolated)
  S-SERVICE:
    name: Tray service
transitions:
  T-01:
    frm: S-OFF
    to: S-FILL
    trigger: coolant filled, pressure hold passed
    guard: ''
    sensor: P-LEAK
    func: F-05
  T-02:
    frm: S-FILL
    to: S-BOOT
    trigger: 48 V enabled
    guard: no leak
    sensor: P-LEAK
    func: F-01
  T-03:
    frm: S-BOOT
    to: S-RUN
    trigger: all trays attested
    guard: ''
    sensor: P-BMC
    func: F-06
  T-04:
    frm: S-RUN
    to: S-DEGRADED
    trigger: leak or tray fault
    guard: ''
    sensor: P-LEAK
    func: F-05
  T-05:
    frm: S-DEGRADED
    to: S-SERVICE
    trigger: technician dispatched
    guard: tray isolated
    sensor: null
    func: F-08
  T-06:
    frm: S-SERVICE
    to: S-BOOT
    trigger: tray replaced
    guard: QD dripless check
    sensor: P-LEAK
    func: F-08
constraints:
  C-01:
    name: Rack power budget
    formula: P_rack = 64 * P_acc + 2 * P_host + 2 * P_sw + P_aux <= 120000
    inputs:
      P_acc: 1400
      P_host: 1600
      P_sw: 2200
      P_aux: 3000
    reqs:
    - R-02
    tests:
    - TST-01
  C-02:
    name: Cold-plate thermal resistance
    formula: Tj = T_inlet + P_acc * (R_tim + R_cp) + dT_fluid/2 <= 85
    inputs:
      T_inlet: 30
      P_acc: 1400
      R_tim: 0.012
      R_cp: 0.018
      dT_fluid: 10
    reqs:
    - R-03
    tests:
    - TST-02
  C-03:
    name: Flow per rack
    formula: Q_lpm = P_rack_W / (4186 * rho * dT) * 60 ; dT <= 10
    inputs:
      P_rack_W: 118000
      dT: 10
    reqs:
    - R-03
    tests:
    - TST-02
  C-04:
    name: Wet mass
    formula: m_wet = m_dry + V_coolant * rho <= 1600
    inputs:
      m_dry: 1480
      V_coolant: 60
      rho: 1.03
    reqs:
    - R-12
    tests:
    - TST-11
  C-05:
    name: Leak response
    formula: t_detect + t_bmc + t_valve <= 2.0 s
    inputs:
      t_detect: 0.5
      t_bmc: 0.3
      t_valve: 0.8
    reqs:
    - R-06
    tests:
    - TST-05
  C-06:
    name: Tray failure budget
    formula: AFR_tray = sum(FIT_i) * 8760 / 1e9 <= 0.02
    inputs:
      FIT_acc_x8: 1200
      FIT_cp: 150
      FIT_bmc: 80
      FIT_leak: 120
    reqs:
    - R-11
    tests:
    - TST-10
trades:
  TD-01:
    name: 'Cooling: direct-to-chip vs immersion vs rear-door'
    question: Which cooling architecture meets Tj ≤ 85 °C at 120 kW with serviceable trays?
    options:
    - Direct-to-chip cold plates
    - Single-phase immersion
    - Rear-door heat exchanger + air
    criteria:
    - Tj at 120 kW
    - Tray swap time
    - Leak risk
    - Cost per rack
    - Facility change
    weights:
    - 5
    - 4
    - 4
    - 3
    - 3
    criteria_meta:
      Tj at 120 kW:
        direction: min
        unit: °C
        req: R-03
        limit: 85
      Tray swap time:
        direction: min
        unit: min
        req: R-05
        limit: 15
      Leak risk:
        direction: max
        unit: 1-5
      Cost per rack:
        direction: min
        unit: USD
      Facility change:
        direction: max
        unit: 1-5
        basis: datacenter team
    raw:
      Direct-to-chip cold plates:
        Tj at 120 kW: 78
        Tray swap time: 12
        Cost per rack: 42000
      Single-phase immersion:
        Tj at 120 kW: 72
        Tray swap time: 45
        Cost per rack: 68000
      Rear-door heat exchanger + air:
        Tj at 120 kW: 96
        Tray swap time: 8
        Cost per rack: 21000
    scores:
      Direct-to-chip cold plates:
        Leak risk: 3
        Facility change: 4
      Single-phase immersion:
        Leak risk: 4
        Facility change: 1
      Rear-door heat exchanger + air:
        Leak risk: 5
        Facility change: 5
    affects:
    - R-03
    - R-05
    - R-06
    elements:
    - LC-COOL
    - P-CP
    - P-MAN
    decision: Direct-to-chip cold plates
    rationale: Rear-door is knocked out on Tj; immersion fails the 15-min swap. Direct-to-chip with per-tray leak isolation (R-06) carries the leak risk.
    status: decided
    decided_by: systems
    date: '2026-10-20'
    owner_team: TM-COOL
arch_decisions:
  AD-01:
    title: Direct-to-chip liquid cooling
    decision: Cold plates on every accelerator, rack manifold with dripless QDs, facility CDU
    rationale: 'TD-01: immersion blocks hot swap and CM yield; rear-door air cannot hold 1.4 kW/accelerator at 30 °C inlet'
    reqs:
    - R-03
    - R-05
    trade: TD-01
    consequences:
    - leak detection + isolation per tray (R-06)
    - wet mass in the floor-loading budget
  AD-02:
    title: 48 V busbar, N+1 power shelves
    decision: 48 V DC distribution with on-tray conversion
    rationale: Efficiency and copper mass vs 12 V; shelf redundancy for the failure budget
    reqs:
    - R-02
    - R-11
    consequences:
    - blind-mate 48 V connector qualification
    - hot-joint survey in integration
  AD-03:
    title: Scale-up over copper within the rack, optics to the pod
    decision: Copper cable set for tray↔switch; 800G optics for scale-out
    rationale: Cost and power per bit at ≤ 2 m; optics only where reach demands
    reqs:
    - R-04
    consequences:
    - cable bend-radius control at PS-03
    - BER qualification across cable lots
  AD-04:
    title: Hardware root of trust on every tray BMC
    decision: BMC with RoT; secure boot and attestation gate the run state
    rationale: N-05; fleet integrity
    reqs:
    - R-07
    consequences:
    - fuse provisioning at the CM
    - golden-value release process
  AD-05:
    title: Two CM sites with common fixtures
    decision: Identical test software and fixtures at sites A and B
    rationale: N-06 and FPY parity
    reqs:
    - R-09
    consequences:
    - fixture duplication cost
    - site qualification builds at DVT
