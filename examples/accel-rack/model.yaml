meta:
  name: Kiln accelerator rack
  version: '0.1'
  method: OOSEM
  description: Liquid-cooled AI accelerator rack — reconstructed from Anthropic data-center hardware postings (fictional name)
  system: P-RACK
  stage: Development
  business:
    target_cost: 1950000
    currency: USD
    builds:
      EVT: 2
      DVT: 10
      PVT: 40
    annual_volume: 2000
    ppm_target: 200
stakeholders:
  STK-ML:
    name: ML performance & training teams
    description: Need tokens/s per rack and a fabric that scales
    concerns: interconnect bandwidth, failure budget
  STK-DC:
    name: Datacenter design & operations
    description: Power, cooling, floor loading, serviceability
    concerns: kW/rack, CDU interface, leak response
  STK-FLEET:
    name: Fleet hardware health
    description: Telemetry, RAS, derating policy
    concerns: failure budget per 1,000 nodes, attestation
  STK-CM:
    name: CM / ODM partners
    description: Build racks at two sites
    concerns: yield, takt, leak/fill test time
  STK-SEC:
    name: Security
    description: Secure boot, root of trust, supply-chain integrity
    concerns: attestation, firmware provenance
  STK-SAFETY:
    name: Safety & compliance
    description: UL/IEC 62368-1, FCC 15A, CE EMC, seismic, fluid safety
    concerns: HVDC, coolant
moes:
  MOE-01:
    name: Accelerators per rack at ≤ 120 kW
    target: '64'
  MOE-02:
    name: Scale-out bandwidth per accelerator
    target: '>= 800 Gb/s, link BER <= 1e-12'
  MOE-03:
    name: Rack power at full load
    target: <= 120 kW; inlet coolant 30 °C, ΔT <= 10 K
  MOE-04:
    name: Tray swap time / annual failure rate
    target: <= 15 min; <= 2 % AFR per tray
  MOE-05:
    name: Attestation coverage
    target: 100 % of trays, secure boot enforced
  MOE-06:
    name: First-pass yield at rack integration
    target: '>= 95 % at both sites'
  MOE-07:
    name: Leak detection to shutdown
    target: <= 2 s, isolated to tray
  MOE-08:
    name: Telemetry coverage
    target: 100 % of power rails and cold plates
needs:
  N-01:
    stk: STK-ML
    text: Maximise accelerators per rack within the datacenter power and cooling envelope
    moe: MOE-01
  N-02:
    stk: STK-ML
    text: Scale-up fabric within the rack and scale-out to the pod with predictable bandwidth
    moe: MOE-02
  N-03:
    stk: STK-DC
    text: Stay within 120 kW per rack and the facility CDU interface
    moe: MOE-03
  N-04:
    stk: STK-FLEET
    text: Meet the failure budget and swap any tray in under 15 minutes
    moe: MOE-04
  N-05:
    stk: STK-SEC
    text: Every tray boots only signed firmware and attests to the fleet
    moe: MOE-05
  N-06:
    stk: STK-CM
    text: Build and test a rack at two sites with the same yield
    moe: MOE-06
  N-07:
    stk: STK-SAFETY
    text: Safe under leak, HVDC fault, seismic event
    moe: MOE-07
  N-08:
    stk: STK-DC
    text: Telemetry for every power and thermal domain
    moe: MOE-08
actors:
  AC-ML:
    name: Training job scheduler
  AC-DC:
    name: Datacenter technician
  AC-FLEET:
    name: Fleet health service
  AC-CM:
    name: CM integration line
  AC-FAC:
    name: Facility CDU
use_cases:
  UC-01:
    name: Commission a rack
    actors:
    - AC-DC
    - AC-FAC
    needs:
    - N-03
    - N-07
  UC-02:
    name: Run a training job across the pod
    actors:
    - AC-ML
    needs:
    - N-01
    - N-02
  UC-03:
    name: Swap a failed tray hot
    actors:
    - AC-DC
    - AC-FLEET
    needs:
    - N-04
  UC-04:
    name: Contain a coolant leak
    actors:
    - AC-FLEET
    - AC-DC
    needs:
    - N-07
  UC-05:
    name: Update firmware fleet-wide
    actors:
    - AC-FLEET
    needs:
    - N-05
  UC-06:
    name: Build and test at the CM
    actors:
    - AC-CM
    needs:
    - N-06
scenarios:
  SC-01:
    uc: UC-01
    name: Fill, pressure hold, power, attest
    steps:
    - F-05
    - F-01
    - F-06
    - F-07
  SC-02:
    uc: UC-02
    name: Full-load training step
    steps:
    - F-01
    - F-02
    - F-03
    - F-04
    concurrent:
    - F-07
  SC-03:
    uc: UC-03
    name: Degraded → service → run
    steps:
    - F-07
    - F-08
    - F-06
  SC-04:
    uc: UC-04
    name: Leak detected and isolated in 2 s
    steps:
    - F-05
    - F-07
    - F-08
  SC-05:
    uc: UC-05
    name: Signed rollout with attestation
    steps:
    - F-06
    - F-07
  SC-06:
    uc: UC-06
    name: Tray build → integration → fill → burn-in
    steps:
    - F-09
    - F-10
    - F-05
    - F-01
    - F-06
regulations:
  REG-62368:
    name: UL/IEC 62368-1 ICT safety
    market: US/EU
    trigger: ITE rack & power shelves
    standard: IEC 62368-1
  REG-FCC15A:
    name: FCC Part 15 Class A
    market: US
    trigger: digital device, industrial
    standard: 47 CFR 15A
  REG-CEEMC:
    name: EN 55032 / EN 55035 EMC
    market: EU
    trigger: ITE in EU
    standard: EN 55032
  REG-HVDC:
    name: IEC 62477-1 / UL 62368-1 HVDC power
    market: US/EU
    trigger: 48 V busbar, HVDC-ready shelves
    standard: IEC 62477-1
  REG-OCP:
    name: OCP liquid cooling & fluid safety guidelines
    market: global
    trigger: direct liquid cooling
    standard: OCP ACS
  REG-SEISMIC:
    name: GR-63 / IEC 60068-3-3 seismic
    market: US/EU
    trigger: rack in seismic zones
    standard: GR-63-CORE
  REG-ROHS:
    name: RoHS / REACH / WEEE
    market: EU
    trigger: electronics in EU
    standard: 2011/65/EU
requirements:
  R-01:
    type: PERF
    text: The rack shall host 8 accelerator trays × 8 accelerators and 2 host trays and 2 scale-up switch trays within 42U.
    verify: inspection
    tests:
    - TST-12
    from_:
    - N-01
    regs: []
    uc: []
    attr: accelerators = 64
  R-02:
    type: PERF
    text: Rack power at full load shall be ≤ 120 kW from 48 V busbars fed by N+1 power shelves; 12 V and 48 V rails derated per fleet policy.
    verify: test
    tests:
    - TST-01
    from_:
    - N-03
    regs:
    - REG-HVDC
    - REG-62368
    uc: []
    attr: rack_kw <= 120
  R-03:
    type: PERF
    text: Direct-to-chip liquid cooling shall hold accelerator junction ≤ 85 °C at 30 °C inlet with ΔT ≤ 10 K and ≤ 1.2 L/min per cold plate.
    verify: test
    tests:
    - TST-02
    from_:
    - N-03
    regs:
    - REG-OCP
    uc: []
    attr: tj_c <= 85
  R-04:
    type: PERF
    text: Scale-out links shall deliver ≥ 800 Gb/s per accelerator with BER ≤ 1e-12 over the pod optics; scale-up copper within rack ≤ 1.5 m.
    verify: test
    tests:
    - TST-03
    from_:
    - N-02
    regs: []
    uc: []
    attr: ber <= 1e-12
  R-05:
    type: MAINT
    text: Any tray shall be hot-swappable with quick-disconnect coolant couplings, dripless, in ≤ 15 min with one technician.
    verify: demonstration
    tests:
    - TST-04
    from_:
    - N-04
    regs:
    - REG-OCP
    uc: []
    attr: swap_min <= 15
  R-06:
    type: SAFE
    text: Leak detection per tray shall isolate coolant and power to the tray within 2 s and alert the fleet.
    verify: test
    tests:
    - TST-05
    from_:
    - N-07
    regs:
    - REG-OCP
    - REG-62368
    uc: []
    attr: leak_cutoff_s <= 2
  R-07:
    type: SEC
    text: Every tray BMC shall enforce secure boot with a hardware root of trust and attest firmware measurements to the fleet before joining.
    verify: inspection
    tests:
    - TST-06
    from_:
    - N-05
    regs: []
    uc: []
    attr: attestation = 100%
  R-08:
    type: FUNC
    text: Telemetry shall cover every power rail, cold-plate inlet/outlet temperature and flow, and fabric link health at ≥ 1 Hz.
    verify: test
    tests:
    - TST-07
    from_:
    - N-08
    regs: []
    uc: []
    attr: telemetry_coverage = 100%
  R-09:
    type: MFG
    text: Rack integration shall achieve ≥ 95 % first-pass yield at both CM sites with leak/fill, hipot, burn-in and fabric BER in the EoL sequence ≤ 6 h.
    verify: test
    tests:
    - TST-08
    from_:
    - N-06
    regs: []
    uc: []
    attr: fpy_pct >= 95
  R-10:
    type: REGU
    text: The rack shall obtain UL/IEC 62368-1, FCC 15A and CE EMC, and pass GR-63 seismic zone 4 before fleet deployment.
    verify: inspection
    tests:
    - TST-09
    from_:
    - N-07
    regs:
    - REG-62368
    - REG-FCC15A
    - REG-CEEMC
    - REG-SEISMIC
    uc: []
    attr: certification = granted
  R-11:
    type: PERF
    text: Annual failure rate per accelerator tray shall be ≤ 2 % with field-replaceable fans/pumps excluded.
    verify: analysis
    tests:
    - TST-10
    from_:
    - N-04
    regs: []
    uc: []
    attr: afr_pct <= 2
  R-12:
    type: PERF
    text: Rack mass ≤ 1,600 kg and floor loading within datacenter limits; wet weight accounted.
    verify: analysis
    tests:
    - TST-11
    from_:
    - N-03
    regs:
    - REG-SEISMIC
    uc: []
    attr: mass_kg <= 1600
functions:
  F-01:
    name: Distribute 48 V power to trays
    alloc:
    - P-PSH
    - P-BUS
    reqs:
    - R-02
    perf: ''
    safety_decision: safety-critical
  F-02:
    name: Remove heat with direct liquid cooling
    alloc:
    - P-CP
    - P-MAN
    - P-QD
    - P-LEAK
    - P-CDUI
    reqs:
    - R-03
    perf: ''
    safety_decision: ''
  F-03:
    name: Interconnect accelerators scale-up
    alloc:
    - P-ACCT
    - P-ACC
    - P-HOST
    - P-NIC
    - P-SW
    - P-OPT
    - P-CABLE
    reqs:
    - R-04
    perf: ''
    safety_decision: ''
  F-04:
    name: Connect to the pod scale-out
    alloc:
    - P-ACCT
    - P-ACC
    - P-HOST
    - P-NIC
    - P-SW
    - P-OPT
    - P-CABLE
    reqs:
    - R-04
    perf: ''
    safety_decision: ''
  F-05:
    name: Detect and isolate leaks
    alloc:
    - P-CP
    - P-MAN
    - P-QD
    - P-LEAK
    - P-CDUI
    reqs:
    - R-06
    perf: ''
    safety_decision: safety-critical
  F-06:
    name: Boot securely and attest
    alloc:
    - P-BMC
    - P-RMC
    - P-FW
    reqs:
    - R-07
    perf: ''
    safety_decision: ''
  F-07:
    name: Report telemetry
    alloc:
    - P-BMC
    - P-RMC
    - P-FW
    reqs:
    - R-08
    perf: ''
    safety_decision: ''
  F-08:
    name: Service trays hot
    alloc:
    - P-FRAME
    reqs:
    - R-05
    - R-11
    perf: ''
    safety_decision: ''
  F-09:
    name: Integrate and test at the CM
    alloc: []
    reqs:
    - R-09
    perf: ''
    safety_decision: ''
  F-10:
    name: Hold the structure and mass
    alloc:
    - P-FRAME
    reqs:
    - R-01
    - R-12
    perf: ''
    safety_decision: ''
