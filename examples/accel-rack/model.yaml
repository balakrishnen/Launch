states:
  S-OFF:
    name: De-energised
  S-FILL:
    name: Filled & leak-checked
  S-BOOT:
    name: Booting & attesting
  S-RUN:
    name: In fleet
  S-DEGRADED:
    name: Degraded (tray isolated)
  S-SERVICE:
    name: Tray service
transitions:
  T-01:
    frm: S-OFF
    to: S-FILL
    trigger: coolant filled, pressure hold passed
    guard: ''
    sensor: P-LEAK
    func: F-05
  T-02:
    frm: S-FILL
    to: S-BOOT
    trigger: 48 V enabled
    guard: no leak
    sensor: P-LEAK
    func: F-01
  T-03:
    frm: S-BOOT
    to: S-RUN
    trigger: all trays attested
    guard: ''
    sensor: P-BMC
    func: F-06
  T-04:
    frm: S-RUN
    to: S-DEGRADED
    trigger: leak or tray fault
    guard: ''
    sensor: P-LEAK
    func: F-05
  T-05:
    frm: S-DEGRADED
    to: S-SERVICE
    trigger: technician dispatched
    guard: tray isolated
    sensor: null
    func: F-08
  T-06:
    frm: S-SERVICE
    to: S-BOOT
    trigger: tray replaced
    guard: QD dripless check
    sensor: P-LEAK
    func: F-08
constraints: {}
trades:
  TD-01:
    name: 'Cooling: direct-to-chip vs immersion vs rear-door'
    question: Which cooling architecture meets Tj ≤ 85 °C at 120 kW with serviceable
      trays?
    options:
    - Direct-to-chip cold plates
    - Single-phase immersion
    - Rear-door heat exchanger + air
    criteria:
    - Tj at 120 kW
    - Tray swap time
    - Leak risk
    - Cost per rack
    - Facility change
    weights:
    - 5
    - 4
    - 4
    - 3
    - 3
    criteria_meta:
      Tj at 120 kW:
        direction: min
        unit: °C
        req: R-03
        limit: 85
      Tray swap time:
        direction: min
        unit: min
        req: R-05
        limit: 15
      Leak risk:
        direction: max
        unit: 1-5
      Cost per rack:
        direction: min
        unit: USD
      Facility change:
        direction: max
        unit: 1-5
        basis: datacenter team
    raw:
      Direct-to-chip cold plates:
        Tj at 120 kW: 78
        Tray swap time: 12
        Cost per rack: 42000
      Single-phase immersion:
        Tj at 120 kW: 72
        Tray swap time: 45
        Cost per rack: 68000
      Rear-door heat exchanger + air:
        Tj at 120 kW: 96
        Tray swap time: 8
        Cost per rack: 21000
    scores:
      Direct-to-chip cold plates:
        Leak risk: 3
        Facility change: 4
      Single-phase immersion:
        Leak risk: 4
        Facility change: 1
      Rear-door heat exchanger + air:
        Leak risk: 5
        Facility change: 5
    affects:
    - R-03
    - R-05
    - R-06
    elements:
    - LC-COOL
    - P-CP
    - P-MAN
    decision: Direct-to-chip cold plates
    rationale: Rear-door is knocked out on Tj; immersion fails the 15-min swap. Direct-to-chip
      with per-tray leak isolation (R-06) carries the leak risk.
    status: decided
    decided_by: systems
    date: '2026-10-20'
    owner_team: TM-COOL
arch_decisions: {}
tests:
  TST-01:
    name: Rack power at full load
    method: Load test, PMBus telemetry
    gate: DVT
    passfail: meets requirement attribute
    status: planned
    owner_team: TM-TEST
  TST-02:
    name: 'Thermal: Tj at 30 °C inlet'
    method: Thermal test vehicle, flow sweep
    gate: DVT
    passfail: meets requirement attribute
    status: planned
    owner_team: TM-TEST
  TST-03:
    name: Fabric BER
    method: BERT, 72 h
    gate: DVT
    passfail: meets requirement attribute
