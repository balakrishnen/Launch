nodes: {}
interfaces:
  IF-01:
    name: Pedal generator → VCU torque/cadence
    a: P-PEDGEN
    b: P-VCU
    items:
    - PedalTorque
    - Cadence
    - GeneratorPower
    kind: electrical+CAN
    funcs:
    - F-01
    - F-02
  IF-02:
    name: VCU → motor controller torque command
    a: P-VCU
    b: P-MCU
    items:
    - TorqueCommand
    - SpeedLimit
    kind: CAN
    funcs:
    - F-03
    - F-06
  IF-03:
    name: Pack ↔ motor controller HV bus
    a: P-PACK
    b: P-MCU
    items:
    - DCPower48V
    kind: electrical 48 V
    funcs:
    - F-03
    - F-04
  IF-04:
    name: Top frame ↔ frame (mechanical + ID)
    a: P-TOPFRAME
    b: P-FRAME
    items:
    - MechanicalLoad
    - FrameID
    kind: mechanical+electrical
    funcs:
    - F-11
  IF-05:
    name: BMS ↔ VCU
    a: P-BMS
    b: P-VCU
    items:
    - SoC
    - PackTemp
    - Faults
    kind: CAN
    funcs:
    - F-04
  IF-06:
    name: TCU ↔ cloud/app
    a: P-TCU
    b: P-APP
    items:
    - Telemetry
    - OTA
    - LockCommand
    kind: LTE/BLE
    funcs:
    - F-09
    - F-07
  IF-07:
    name: VCU → wheel lock
    a: P-VCU
    b: P-LOCK
    items:
    - LockCommand
    - LockState
    kind: electrical
    funcs:
    - F-07
  IF-08:
    name: USB-C PD ↔ pack
    a: P-CHG
    b: P-PACK
    items:
    - PDPower240W
    kind: USB-C PD 240 W
    funcs:
    - F-10
  IF-09:
    name: Motor → belt → rear wheel
    a: P-MOTOR
    b: P-BELT
    items:
    - Torque
    kind: mechanical
    funcs:
    - F-03
  IF-10:
    name: Brake lever → VCU regen request
    a: P-BRAKE
    b: P-VCU
    items:
    - BrakeLeverPosition
    kind: electrical
    funcs:
    - F-05
states:
  S-OFF:
    name: Off / locked
  S-UNLOCK:
    name: Unlocked, standby
  S-RIDE:
    name: Riding
  S-REGEN:
    name: Regenerating
  S-CHARGE:
    name: Charging
  S-FAULT:
    name: Fault / limp
  S-EOL:
    name: End-of-line test
transitions:
  T-01:
    frm: S-OFF
    to: S-UNLOCK
    trigger: rider authenticated (key/NFC/app)
    guard: ''
    sensor: null
    func: F-08
  T-02:
    frm: S-UNLOCK
    to: S-RIDE
    trigger: pedal torque or throttle > threshold
    guard: ''
    sensor: null
    func: F-03
  T-03:
    frm: S-RIDE
    to: S-REGEN
    trigger: brake lever or coast with regen enabled
    guard: ''
    sensor: null
    func: F-05
  T-04:
    frm: S-RIDE
    to: S-FAULT
    trigger: BMS/motor fault
    guard: ''
    sensor: null
    func: F-06
  T-05:
    frm: S-UNLOCK
    to: S-OFF
    trigger: lock command or 10 min idle
    guard: ''
    sensor: null
    func: F-07
  T-06:
    frm: S-OFF
    to: S-CHARGE
    trigger: USB-C PD source connected
    guard: ''
    sensor: null
    func: F-10
  T-07:
    frm: S-UNLOCK
    to: S-EOL
    trigger: EoL fixture command
    guard: ''
    sensor: null
    func: F-12
constraints: {}
trades: {}
arch_decisions: {}
tests:
  TST-01:
    name: Range test, urban cycle, 75 kg rider
    method: Dyno + road, SAE J1082-style cycle
    gate: CDR
    passfail: meets the requirement attribute
    status: planned
    owner_team: TM-TEST
  TST-02:
    name: Pedal-to-torque latency
    method: 'Bench: step pedal torque, log motor torque'
    gate: CDR
    passfail: meets the requirement attribute
    status: planned
    owner_team: TM-TEST
  TST-03:
    name: Virtual resistance sweep
    method: Bench generator load 0–60 Nm
    gate: CDR
    passfail: meets the requirement attribute
    status: planned
