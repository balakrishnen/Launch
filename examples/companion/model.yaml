    status: open
    owner_team: TM-EXPR
arch_decisions:
  AD-01:
    title: Screenless, voice-first with a light ring
    decision: No display; a 24-LED ring and motion carry state
    rationale: Cost, battery and the companion concept; a screen pulls attention and doubles idle power
    reqs:
    - R-03
    - R-12
    consequences:
    - light semantics must be accessible (F-06)
    - setup needs the phone app
  AD-02:
    title: Always-on audio on an RTOS co-processor
    decision: MCU runs wake-word with SoC asleep; SoC wakes on detection
    rationale: R-12 idle ≤ 2.5 W is impossible with the application SoC awake
    reqs:
    - R-12
    - R-02
    consequences:
    - dual-firmware update path (IF-09)
    - wake-to-listen handshake in the latency budget
  AD-03:
    title: 'Hardware privacy: mechanical shutter + mic rail cut'
    decision: Shutter is a mechanical slide with a hall sensor; mute cuts the mic power rail and drives the LED from the rail
    rationale: Trust requirement R-04 cannot depend on software state
    reqs:
    - R-04
    - R-09
    consequences:
    - shutter independent of the expression actuator
    - EoL test of the rail cut
  AD-04:
    title: Matter controller over Thread and Wi-Fi
    decision: Device is a Matter controller and Thread border router
    rationale: N-05 without a hub; Thread for low-power devices
    reqs:
    - R-05
    consequences:
    - coexistence test with music streaming
    - fabric persistence across OTA
  AD-05:
    title: Pre-certified radio module
    decision: Wi-Fi 6 / BLE / Thread module with modular approval
    rationale: Removes radio certification from the critical path; antenna integration still needs SAR
    reqs:
    - R-07
    - R-14
    consequences:
    - BOM +$1.1 vs discrete
    - antenna slot in aluminium enclosure
  AD-06:
    title: Expression mechanism — open
    decision: Pending TD-01 (gearmotor vs voice-coil vs light/haptic only)
    rationale: Noise, life and cost unresolved; TRL 4 on the gearmotor
    reqs:
    - R-06
    trade: TD-01
    concerns:
    - 500k-cycle life
    - ≤ 25 dBA at 0.5 m
    - motor noise into mics
