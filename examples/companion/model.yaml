    - CSI_D1
    - CSI_CLK
    - 1V8
    - GND
    - SHUTTER_SENSE
    kind: electrical MIPI CSI-2
    funcs:
    - F-05
  IF-04:
    name: Shutter ↔ camera (mechanical)
    a: P-SHUT
    b: P-CAM
    items:
    - Blade
    - Detent
    kind: mechanical
    funcs:
    - F-09
  IF-05:
    name: Mute switch → MCU & mic power
    a: P-MUTE
    b: P-MAIN
    items:
    - MUTE_N
    - MIC_PWR_EN
    - LED_MUTE
    kind: electrical
    funcs:
    - F-09
  IF-06:
    name: Actuators ← driver
    a: P-MAIN
    b: P-ACT
    items:
    - M1+
    - M1-
    - M2+
    - M2-
    - ENC
    kind: electrical H-bridge
    funcs:
    - F-06
  IF-07:
    name: Battery → PMIC
    a: P-BATT
    b: P-MAIN
    items:
    - VBAT
    - GND
    - SMBus_SCL
    - SMBus_SDA
    - NTC
    kind: electrical
    funcs:
    - F-08
  IF-08:
    name: USB-C → PD controller
    a: P-USBC
    b: P-BATT
    items:
    - VBUS
    - CC1
    - CC2
    - GND
    kind: electrical PD
    funcs:
    - F-08
  IF-09:
    name: SoC ↔ MCU
    a: P-SOC
    b: P-MCU
    items:
    - UART_TX
    - UART_RX
    - I2S
    - WAKE
    kind: electrical UART/I2S
    funcs:
    - F-02
    - F-08
  IF-10:
    name: Radio ↔ cloud/OTA
    a: P-RADIO
    b: P-OTA
    items:
    - Conversation
    - OTA
    - Telemetry
    kind: wireless TLS
    funcs:
    - F-03
    - F-10
  IF-11:
    name: Radio ↔ smart-home devices
    a: P-RADIO
    b: P-OTA
    items:
    - Matter commands
    kind: Thread/Matter
    funcs:
    - F-07
  IF-12:
    name: Enclosure ↔ driver/radiator (acoustic seal)
    a: P-ENCL
    b: P-DRV
    items:
    - Gasket
    - Volume
    kind: mechanical/acoustic
    funcs:
    - F-04
  IF-13:
    name: Secure element ↔ SoC
    a: P-SE
    b: P-SOC
    items:
    - I2C
    - RST
    kind: electrical I2C
    funcs:
    - F-10
states:
  S-OFF:
    name: 'Off'
  S-IDLE:
    name: Idle, listening for wake
  S-CONV:
    name: Conversation
  S-MUTED:
    name: Muted / shuttered
  S-CHARGE:
    name: Charging
  S-OTA:
    name: Updating
  S-FAULT:
    name: Fault / safe
transitions:
  T-01:
    frm: S-IDLE
    to: S-CONV
    trigger: wake word
    guard: not muted
    sensor: P-MICS
    func: F-02
  T-02:
    frm: S-CONV
    to: S-IDLE
    trigger: end of turn + 8 s silence
    guard: ''
    sensor: null
    func: F-03
  T-03:
    frm: S-IDLE
    to: S-MUTED
    trigger: mute switch or shutter closed
    guard: ''
    sensor: P-MUTE
    func: F-09
  T-04:
    frm: S-MUTED
    to: S-IDLE
    trigger: mute switch open and shutter open
    guard: ''
    sensor: P-MUTE
    func: F-09
  T-05:
    frm: S-IDLE
    to: S-CHARGE
    trigger: USB-C PD attached
    guard: pack temp 0–45 °C
    sensor: P-BATT
    func: F-08
  T-06:
    frm: S-IDLE
    to: S-OTA
    trigger: signed update staged
    guard: battery > 30 % or charging
    sensor: null
    func: F-10
  T-07:
    frm: S-CHARGE
    to: S-FAULT
    trigger: pack over-temperature
    guard: ''
    sensor: P-BATT
    func: F-08
constraints:
  C-01:
    name: Battery energy budget
    formula: E_Wh = P_active_W * t_active_h + P_idle_W * t_idle_h <= 0.9 * 20
    inputs:
      P_active_W: 2.1
      t_active_h: 8
      P_idle_W: 0.6
      t_idle_h: 16
    reqs:
    - R-03
    - R-12
    tests:
    - TST-03
    - TST-12
  C-02:
    name: Latency budget
    formula: capture_ms + wake_ms + uplink_ms + model_ms + tts_first_ms + playout_ms <= 700 (p50)
    inputs:
      capture_ms: 80
      wake_ms: 120
      uplink_ms: 60
      model_ms: 280
      tts_first_ms: 90
      playout_ms: 40
    reqs:
    - R-01
    tests:
    - TST-01
  C-03:
    name: Acoustic output
    formula: SPL_1m = sensitivity_dB + 10*log10(P_amp_W) - 3 >= 85
    inputs:
      sensitivity_dB: 84
      P_amp_W: 10
    reqs:
    - R-13
    tests:
    - TST-13
  C-04:
    name: Mass budget
    formula: m_total_g = sum(part mass) <= 650
    inputs:
      m_pack_g: 176
      m_encl_g: 210
      m_acoustic_g: 95
      m_pcba_g: 48
      m_mech_g: 60
    reqs:
    - R-03
    tests:
    - TST-03
  C-05:
    name: Charge thermal window
    formula: T_cell_C in [0, 45] during charge; cut at 50
    inputs:
      T_cut_C: 50
    reqs:
    - R-08
    tests:
    - TST-08
  C-06:
    name: RF exposure
    formula: SAR_1g_W_kg = f(P_tx_dBm, distance_mm) <= 1.6
    inputs:
      P_tx_dBm: 18
      distance_mm: 5
    reqs:
    - R-14
    tests:
    - TST-14
trades:
  TD-01:
    name: 'Expression mechanism: gearmotor vs voice-coil vs none'
    question: Does 'alive' motion earn its cost, noise and reliability risk?
    options:
    - 2× micro-gearmotor
    - Voice-coil tilt
    - Light & haptic only
    criteria:
    - Mechanism noise
    - Perceived liveliness
    - Reliability over 500k cycles
    - BOM cost
    - Mass
    weights:
    - 4
    - 5
    - 4
    - 3
    - 1
    criteria_meta:
      Mechanism noise:
        direction: min
        unit: dBA
        moe: MOE-06
        limit: 25
      Perceived liveliness:
        direction: max
        unit: 1-5
        basis: ID studio panel
      Reliability over 500k cycles:
        direction: max
        unit: 1-5
        req: R-06
      BOM cost:
        direction: min
        unit: USD
      Mass:
        direction: min
        unit: g
    raw:
      2× micro-gearmotor:
        Mechanism noise: 27
        BOM cost: 3.2
        Mass: 38
      Voice-coil tilt:
        Mechanism noise: 19
        BOM cost: 5.6
        Mass: 52
      Light & haptic only:
        Mechanism noise: 0
        BOM cost: 1.1
        Mass: 6
    scores:
