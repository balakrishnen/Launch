nodes: {}
interfaces:
  IF-01:
    name: Mics → main board
    a: P-MICS
    b: P-MAIN
    items:
    - PDM_CLK
    - PDM_D0
    - PDM_D1
    - 3V3
    - GND
    kind: electrical PDM
    funcs:
    - F-01
  IF-02:
    name: Amp → driver
    a: P-AMP
    b: P-DRV
    items:
    - SPK+
    - SPK-
    kind: electrical
    funcs:
    - F-04
  IF-03:
    name: Camera → SoC
    a: P-CAM
    b: P-MAIN
    items:
    - CSI_D0
    - CSI_D1
    - CSI_CLK
    - 1V8
    - GND
    - SHUTTER_SENSE
    kind: electrical MIPI CSI-2
    funcs:
    - F-05
  IF-04:
    name: Shutter ↔ camera (mechanical)
    a: P-SHUT
    b: P-CAM
    items:
    - Blade
    - Detent
    kind: mechanical
    funcs:
    - F-09
  IF-05:
    name: Mute switch → MCU & mic power
    a: P-MUTE
    b: P-MAIN
    items:
    - MUTE_N
    - MIC_PWR_EN
    - LED_MUTE
    kind: electrical
    funcs:
    - F-09
  IF-06:
    name: Actuators ← driver
    a: P-MAIN
    b: P-ACT
    items:
    - M1+
    - M1-
    - M2+
    - M2-
    - ENC
    kind: electrical H-bridge
    funcs:
    - F-06
  IF-07:
    name: Battery → PMIC
    a: P-BATT
    b: P-MAIN
    items:
    - VBAT
    - GND
    - SMBus_SCL
    - SMBus_SDA
    - NTC
    kind: electrical
    funcs:
    - F-08
  IF-08:
    name: USB-C → PD controller
    a: P-USBC
    b: P-BATT
    items:
    - VBUS
    - CC1
    - CC2
    - GND
    kind: electrical PD
    funcs:
    - F-08
  IF-09:
    name: SoC ↔ MCU
    a: P-SOC
    b: P-MCU
    items:
    - UART_TX
    - UART_RX
    - I2S
    - WAKE
    kind: electrical UART/I2S
    funcs:
    - F-02
    - F-08
  IF-10:
    name: Radio ↔ cloud/OTA
    a: P-RADIO
    b: P-OTA
    items:
    - Conversation
    - OTA
    - Telemetry
    kind: wireless TLS
    funcs:
    - F-03
    - F-10
  IF-11:
    name: Radio ↔ smart-home devices
    a: P-RADIO
    b: P-OTA
    items:
    - Matter commands
    kind: Thread/Matter
    funcs:
    - F-07
  IF-12:
    name: Enclosure ↔ driver/radiator (acoustic seal)
    a: P-ENCL
    b: P-DRV
    items:
    - Gasket
    - Volume
    kind: mechanical/acoustic
    funcs:
    - F-04
  IF-13:
    name: Secure element ↔ SoC
    a: P-SE
    b: P-SOC
    items:
    - I2C
    - RST
    kind: electrical I2C
    funcs:
    - F-10
states:
  S-OFF:
    name: 'Off'
  S-IDLE:
    name: Idle, listening for wake
  S-CONV:
    name: Conversation
  S-MUTED:
    name: Muted / shuttered
  S-CHARGE:
    name: Charging
  S-OTA:
    name: Updating
  S-FAULT:
    name: Fault / safe
transitions:
  T-01:
    frm: S-IDLE
    to: S-CONV
    trigger: wake word
    guard: not muted
    sensor: P-MICS
    func: F-02
  T-02:
    frm: S-CONV
    to: S-IDLE
    trigger: end of turn + 8 s silence
    guard: ''
    sensor: null
    func: F-03
  T-03:
    frm: S-IDLE
    to: S-MUTED
    trigger: mute switch or shutter closed
    guard: ''
    sensor: P-MUTE
    func: F-09
  T-04:
    frm: S-MUTED
    to: S-IDLE
    trigger: mute switch open and shutter open
    guard: ''
    sensor: P-MUTE
    func: F-09
  T-05:
    frm: S-IDLE
    to: S-CHARGE
    trigger: USB-C PD attached
    guard: pack temp 0–45 °C
    sensor: P-BATT
    func: F-08
  T-06:
    frm: S-IDLE
    to: S-OTA
    trigger: signed update staged
    guard: battery > 30 % or charging
    sensor: null
    func: F-10
  T-07:
    frm: S-CHARGE
    to: S-FAULT
    trigger: pack over-temperature
    guard: ''
    sensor: P-BATT
    func: F-08
