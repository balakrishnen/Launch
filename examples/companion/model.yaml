    safety_decision: safety/privacy-critical
  F-10:
    name: Update and attest firmware
    alloc:
    - P-SHUT
    - P-MUTE
    - P-FW
    - P-SE
    reqs:
    - R-09
    - R-11
    perf: ''
    safety_decision: ''
  F-11:
    name: Self-test at end of line
    alloc: []
    reqs:
    - R-10
    perf: ''
    safety_decision: ''
  F-12:
    name: Connect over Wi-Fi, BLE and Thread
    alloc:
    - P-RADIO
    - P-OTA
    reqs:
    - R-05
    - R-14
    perf: ''
    safety_decision: ''
