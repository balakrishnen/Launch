meta:
  name: Hearth companion speaker
  version: '0.1'
  method: OOSEM
  description: Screenless portable AI companion speaker — reconstructed from OpenAI consumer-device postings and press (fictional name)
  system: P-HRT
  stage: Development
  business:
    price: 249
    target_cost: 95
    launch_date: '2027-03-01'
    channels:
    - D2C
    - Retail
    currency: USD
    builds:
      EVT: 50
      DVT: 300
      PVT: 2000
    annual_volume: 2000000
    ppm_target: 300
stakeholders:
  STK-USER:
    name: Household user
    description: Talks to it; moves it between rooms; expects privacy
    concerns: latency, voice quality, privacy, battery
  STK-SAFETY:
    name: Safety & regulatory bodies
    description: FCC, RED, IEC 62368-1, battery transport
    concerns: RF, battery, cybersecurity
  STK-TRUST:
    name: Device safety & risk operations
    description: Abuse, child interaction, data handling policies
    concerns: camera/mic indicators, parental controls
  STK-CM:
    name: Contract manufacturer
    description: Builds and tests at volume
    concerns: yield, test time, cosmetic defects
  STK-CLOUD:
    name: Model & cloud platform team
    description: Serves the conversation model; owns OTA
    concerns: on-device fallback, telemetry
  STK-ID:
    name: Industrial design studio
    description: Form, materials, the 'alive' motion
    concerns: craft, surfaces, sound of mechanisms
moes:
  MOE-01:
    name: Voice-to-first-audio latency
    target: <= 700 ms p50, <= 1.2 s p95 on Wi-Fi
  MOE-02:
    name: Wake-word recall at 5 m with 65 dBA music
    target: '>= 95 %'
  MOE-03:
    name: Battery life, mixed use
    target: '>= 8 h active, >= 24 h standby'
  MOE-04:
    name: Indicator-to-mute latency
    target: <= 100 ms; hardware shutter
  MOE-05:
    name: Matter device control success
    target: '>= 99 % within 2 s'
  MOE-06:
    name: Mechanism noise
    target: <= 25 dBA at 0.5 m
  MOE-07:
    name: Certifications
    target: FCC, RED, IEC 62368-1, IEC 62133-2, UN 38.3 before PVT
  MOE-08:
    name: Privacy design review
    target: passed; camera/mic indicators non-defeatable
  MOE-09:
    name: End-of-line test time
    target: <= 180 s
  MOE-10:
    name: Offline core functions
    target: wake, timers, local Matter control, 100 %
needs:
  N-01:
    stk: STK-USER
    text: 'Conversation feels immediate: reply starts within a beat of finishing speaking'
    moe: MOE-01
  N-02:
    stk: STK-USER
    text: Hears me across the room over music and household noise
    moe: MOE-02
  N-03:
    stk: STK-USER
    text: Lasts a day between charges when carried around
    moe: MOE-03
  N-04:
    stk: STK-USER
    text: I can see when it is listening or looking, and stop it instantly
    moe: MOE-04
  N-05:
    stk: STK-USER
    text: Controls my lights and thermostat without a hub
    moe: MOE-05
  N-06:
    stk: STK-ID
    text: Feels alive — subtle motion and light, silent mechanisms
    moe: MOE-06
  N-07:
    stk: STK-SAFETY
    text: Safe battery and RF in every market we ship to
    moe: MOE-07
  N-08:
    stk: STK-TRUST
    text: Children and bystanders are protected; data handling is auditable
    moe: MOE-08
  N-09:
    stk: STK-CM
    text: Every unit tested for audio, camera, RF and battery in under 3 minutes
    moe: MOE-09
  N-10:
    stk: STK-CLOUD
    text: Works usefully offline and updates itself safely
    moe: MOE-10
actors:
  AC-USER:
    name: Household member
  AC-GUEST:
    name: Guest / bystander
  AC-CLOUD:
    name: Cloud model service
  AC-HOME:
    name: Smart-home devices (Matter)
  AC-OPS:
    name: Line operator
  AC-OTA:
    name: OTA service
use_cases:
  UC-01:
    name: Ask and converse
    actors:
    - AC-USER
    - AC-CLOUD
    needs:
    - N-01
    - N-02
  UC-02:
    name: Play music and talk over it
    actors:
    - AC-USER
    needs:
    - N-02
    includes:
    - UC-01
  UC-03:
    name: Control the home by voice
    actors:
    - AC-USER
    - AC-HOME
    needs:
    - N-05
    includes:
    - UC-01
  UC-04:
    name: Mute and cover
    actors:
    - AC-USER
    - AC-GUEST
    needs:
    - N-04
    - N-08
  UC-05:
    name: Carry and charge
    actors:
    - AC-USER
    needs:
    - N-03
    - N-07
  UC-06:
    name: Update overnight
    actors:
    - AC-OTA
    needs:
    - N-10
  UC-07:
    name: Test and provision at end of line
    actors:
    - AC-OPS
    needs:
    - N-09
  UC-08:
    name: Work offline
    actors:
    - AC-USER
    needs:
    - N-10
scenarios:
  SC-01:
    uc: UC-01
    name: Wake, ask, answer
    steps:
    - F-01
    - F-02
    - F-03
    - F-04
    - F-06
    concurrent:
    - F-12
  SC-02:
    uc: UC-02
    name: Barge-in over 65 dBA music
    steps:
    - F-04
    - F-01
    - F-02
    - F-03
    - F-04
  SC-03:
    uc: UC-03
    name: Lights to 30 %
    steps:
    - F-02
    - F-07
    - F-06
  SC-04:
    uc: UC-04
    name: Guest closes the shutter
    steps:
    - F-09
    - F-06
  SC-05:
    uc: UC-05
    name: Day on battery, charge at night
    steps:
    - F-08
    - F-12
    - F-08
  SC-06:
    uc: UC-06
    name: A/B update with rollback
    steps:
    - F-10
    - F-12
    - F-10
  SC-07:
    uc: UC-07
    name: 'EoL: chamber, MTF, RF, charge, provision'
    steps:
    - F-11
    - F-04
    - F-05
    - F-12
    - F-08
    - F-10
  SC-08:
    uc: UC-08
    name: Timer and lights with Wi-Fi down
    steps:
    - F-02
    - F-07
regulations:
  REG-FCC:
    name: FCC Part 15 B/C
    market: US
    trigger: digital device + Wi-Fi/BLE/Thread radios
    standard: 47 CFR 15
  REG-RED:
    name: Radio Equipment Directive incl. EN 18031 cybersecurity
    market: EU
    trigger: connected radio device
    standard: EN 300 328; EN 18031
  REG-62368:
    name: IEC/UL 62368-1 audio/video & ICT safety
    market: US/EU
    trigger: mains-chargeable AV device
    standard: IEC 62368-1
  REG-62133:
    name: IEC 62133-2 lithium cells & batteries
    market: EU
    trigger: Li-ion pack
    standard: IEC 62133-2
  REG-UN38:
    name: UN 38.3 battery transport
    market: global
    trigger: shipping Li-ion
    standard: UN 38.3
  REG-MATTER:
    name: Matter / Thread certification
    market: global
    trigger: smart-home control
    standard: CSA Matter 1.x
  REG-ROHS:
    name: RoHS / REACH / WEEE
    market: EU
    trigger: electronics in EU
    standard: 2011/65/EU
  REG-PROP65:
    name: California Prop 65
    market: US-CA
    trigger: consumer product in CA
    standard: Cal. HSC §25249
  REG-COPPA:
    name: COPPA / child privacy
    market: US
    trigger: voice data from children
    standard: 16 CFR 312
requirements:
  R-01:
    type: PERF
    text: Voice-to-first-audio latency shall be ≤ 700 ms p50 and ≤ 1.2 s p95 over Wi-Fi; on-device fallback shall answer wake, timers and local control with no network.
    verify: test
    tests:
    - TST-01
    from_:
    - N-01
    regs: []
    uc: []
    attr: latency_ms <= 700
  R-02:
    type: PERF
    text: Wake-word recall shall be ≥ 95 % at 5 m with 65 dBA music playing from the device itself (AEC).
    verify: test
    tests:
    - TST-02
    from_:
    - N-02
    regs: []
    uc: []
    attr: wake_recall_pct >= 95
  R-03:
    type: PERF
    text: Battery shall deliver ≥ 8 h mixed active use and ≥ 24 h standby from a 20 Wh pack at 25 °C.
    verify: test
    tests:
    - TST-03
    from_:
    - N-03
    regs:
    - REG-62133
    uc: []
    attr: battery_h >= 8
  R-04:
    type: SAFE
    text: A hardware privacy shutter shall block the camera; mic mute shall be a hardware cut with an LED that cannot be overridden by software.
    verify: demonstration
    tests:
    - TST-04
    from_:
    - N-04
    regs:
    - REG-COPPA
    uc: []
    attr: mute_latency_ms <= 100
  R-05:
    type: FUNC
    text: The device shall act as a Matter controller over Thread and Wi-Fi with ≥ 99 % command success within 2 s.
    verify: test
    tests:
    - TST-05
    from_:
    - N-05
    regs:
    - REG-MATTER
    uc: []
    attr: matter_success_pct >= 99
  R-06:
    type: PERF
    text: The expressive mechanism shall produce ≤ 25 dBA at 0.5 m and survive 500,000 cycles.
    verify: test
    tests:
    - TST-06
    from_:
    - N-06
    regs: []
    uc: []
    attr: mech_noise_dba <= 25
  R-07:
    type: REGU
    text: The product shall obtain FCC 15B/15C, RED (incl. EN 18031), IEC 62368-1, IEC 62133-2 and UN 38.3 before PVT.
    verify: inspection
    tests:
    - TST-07
    from_:
    - N-07
    regs:
    - REG-FCC
    - REG-RED
    - REG-62368
    - REG-62133
    - REG-UN38
    uc: []
    attr: certification = granted
  R-08:
    type: SAFE
    text: Pack shall include cell-level protection, charge temperature window 0–45 °C, and thermal runaway containment per IEC 62133-2.
    verify: test
    tests:
    - TST-08
    from_:
    - N-07
    regs:
    - REG-62133
    uc: []
    attr: charge_temp_window = 0-45C
  R-09:
    type: SEC
    text: Audio and image data shall be processed on device for wake/intent; uploads require explicit indicator state; firmware shall be signed with rollback protection.
    verify: inspection
    tests:
    - TST-09
    from_:
    - N-08
    regs:
    - REG-RED
    - REG-COPPA
    uc: []
    attr: security = EN18031
  R-10:
    type: MFG
    text: End-of-line test shall cover audio chamber, camera MTF, RF, battery charge/discharge and provisioning in ≤ 180 s.
    verify: test
    tests:
    - TST-10
    from_:
    - N-09
    regs: []
    uc: []
    attr: eol_s <= 180
  R-11:
    type: FUNC
    text: OTA updates shall be A/B with automatic rollback; a failed update shall not brick the device.
    verify: test
    tests:
    - TST-11
    from_:
    - N-10
    regs: []
    uc: []
    attr: ota_rollback = true
  R-12:
    type: PERF
    text: System power shall stay ≤ 2.5 W average in always-listening idle with the application SoC asleep (RTOS co-processor owns wake).
    verify: test
    tests:
    - TST-12
    from_:
    - N-01
    regs: []
    uc: []
    attr: idle_w <= 2.5
  R-13:
    type: PERF
    text: Full-range driver + passive radiator shall deliver 85 dB SPL at 1 m with ≤ 3 % THD at 1 kHz.
    verify: test
    tests:
    - TST-13
    from_:
    - N-06
    regs: []
    uc: []
    attr: spl_db >= 85
  R-14:
    type: REGU
    text: RF exposure (SAR/MPE) shall comply for a device carried in hand and placed on a table.
    verify: test
    tests:
    - TST-14
    from_:
    - N-07
    regs:
    - REG-FCC
    - REG-RED
    uc: []
    attr: rf_exposure = compliant
functions:
