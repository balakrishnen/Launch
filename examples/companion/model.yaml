    safety_decision: ''
  F-07:
    name: Control smart-home devices
    alloc:
    - P-RADIO
    - P-OTA
    reqs:
    - R-05
    perf: ''
    safety_decision: ''
  F-08:
    name: Manage power and charging
    alloc:
    - P-MCU
    - P-BATT
    - P-USBC
    reqs:
    - R-03
    - R-08
    - R-12
    perf: ''
    safety_decision: safety/privacy-critical
  F-09:
    name: Enforce privacy controls
    alloc:
    - P-SHUT
    - P-MUTE
    - P-FW
    - P-SE
    reqs:
    - R-04
    - R-09
