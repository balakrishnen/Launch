meta:
  name: Sabi Cap
  version: '1.0'
  method: OOSEM
  description: Non-invasive EEG BCI beanie; reliability program derived from the model
stakeholders:
  STK-WEARER:
    name: Wearer
    role: Primary user; wears the cap 4 h/day
    concerns: comfort, safety, it works outdoors, privacy
  STK-SABI:
    name: Sabi (business)
    role: Ships by year-end; brand depends on first cohort
    concerns: returns, safety events, press
  STK-CM:
    name: Contract manufacturer
    role: Builds, tests, ships
    concerns: testable design, yield, clear acceptance criteria
  STK-REG:
    name: Regulators (FCC, EU, ISED)
    role: Market access
    concerns: RF, EMC, safety, substances, RF exposure
  STK-RETAIL:
    name: Retail / logistics
    role: Stocks and ships product
    concerns: battery transport, retailer safety marks, shelf life
  STK-SUPPORT:
    name: Support / field quality
    role: Handles returns and complaints
    concerns: diagnosable failures, telemetry
  STK-APP:
    name: Phone app / BFM backend
    role: Receives decoded text and telemetry
    concerns: link reliability, data integrity, security
moes:
  MOE-WEAR:
    name: Daily wear hours
    target: ≥ 4 h/day sustained over 2 weeks in wear trial; comfort score ≥ 4/5
  MOE-SAFETY:
    name: Safety events
    target: Zero burn, battery or skin-injury events in first 10,000 units
  MOE-ENV:
    name: Environmental survivability
    target: Operational after IPX4, sweat ×5, 1 m drop, −10 °C start
  MOE-LIFE:
    name: Design life
    target: R(2 yr) ≥ 0.90 at 90 % confidence
  MOE-SEC:
    name: Security
    target: No unauthenticated pairing; link encrypted; external audit passed
  MOE-AFR:
    name: Year-1 hardware AFR
    target: ≤ 3 % at launch, ≤ 2 % at 6 months; all-cause returns ≤ 5 % in 90 days
  MOE-SCHED:
    name: Launch
    target: Ship Dec 28, 2026 or founders' cohort with Q1 close-out
  MOE-TEST:
    name: EoL testability
    target: Functional test ≤ 90 s, DPPM escape ≤ 500
  MOE-CERT:
    name: Certification
    target: FCC grant/SDoC, CE DoC, ISED cert before ship
  MOE-SHIP:
    name: Shelf and transport
    target: Cell 40–60 % SoC after 6 months storage; UN 38.3 pass
  MOE-DIAG:
    name: Diagnosability
    target: ≥ 90 % of returns classified from telemetry before bench
  MOE-LINK:
    name: Link robustness
    target: Reconnect ≤ 5 s; packet loss ≤ 0.1 % with phone in pocket
needs:
  N-01:
    stk: STK-WEARER
    text: Wear it for hours every day without discomfort or skin reaction
    moe: MOE-WEAR
  N-02:
    stk: STK-WEARER
    text: It never burns me or exposes me to a battery event
    moe: MOE-SAFETY
  N-03:
    stk: STK-WEARER
    text: 'It works through a full day of normal life: sweat, rain, bag, drops, cold
      mornings'
    moe: MOE-ENV
  N-04:
    stk: STK-WEARER
    text: Decoding keeps working for two years of daily use
    moe: MOE-LIFE
  N-05:
    stk: STK-WEARER
    text: My neural data and text are private
    moe: MOE-SEC
  N-06:
    stk: STK-SABI
    text: Field returns and safety events stay low enough to protect the launch
    moe: MOE-AFR
  N-07:
    stk: STK-SABI
    text: Ship by year-end with a known, bounded risk
    moe: MOE-SCHED
    program: true
  N-08:
    stk: STK-CM
    text: Every unit can be functionally tested in under 90 s with measurable pass/fail
    moe: MOE-TEST
  N-09:
    stk: STK-REG
    text: Legal to sell in US, EU and Canada
    moe: MOE-CERT
  N-10:
    stk: STK-RETAIL
    text: Can be air-shipped and stocked for six months
    moe: MOE-SHIP
  N-11:
    stk: STK-SUPPORT
    text: Every field failure is diagnosable from device data
    moe: MOE-DIAG
  N-12:
    stk: STK-APP
    text: Link is robust and data arrives intact and authenticated
    moe: MOE-LINK
actors:
  ACT-WEARER:
    name: Wearer
  ACT-PHONE:
    name: Phone app
  ACT-DOCK:
    name: Charge dock
  ACT-CM:
    name: Factory / CM
  ACT-SUPPORT:
    name: Support
  ACT-ENV:
    name: Environment (sweat, rain, ESD, drops, cold)
use_cases:
  UC-01:
    name: Think to text
    actors:
    - ACT-WEARER
    - ACT-PHONE
    includes:
    - UC-02
    - UC-03
    needs:
    - N-04
    - N-12
  UC-02:
    name: Wear for hours
    actors:
    - ACT-WEARER
    - ACT-ENV
    includes: []
    needs:
    - N-01
    - N-02
    - N-03
  UC-03:
    name: Pair with phone
    actors:
    - ACT-PHONE
    includes: []
    needs:
    - N-05
    - N-12
  UC-04:
    name: Charge
    actors:
    - ACT-DOCK
    includes: []
    needs:
    - N-02
  UC-05:
    name: Update firmware
    actors:
    - ACT-PHONE
    - ACT-SUPPORT
    includes: []
    needs:
    - N-06
  UC-06:
    name: Report health
    actors:
    - ACT-PHONE
    - ACT-SUPPORT
    includes: []
    needs:
    - N-11
  UC-07:
    name: Manufacture and test
    actors:
    - ACT-CM
    includes: []
    needs:
    - N-08
  UC-08:
    name: Store and ship
    actors:
    - ACT-CM
    includes: []
    needs:
    - N-10
scenarios:
  SC-WEAR:
    uc: UC-01
    name: WearSession
    steps:
    - F01
    - F02
    - F03
    - F07
    - F04
    - F05
    - F06
    - F07
    - F12
    - F03
    concurrent:
    - F10
    - F08
    - F11
    - F12
  SC-CHARGE:
    uc: UC-04
    name: ChargeSession
    steps:
    - F09a
    - F09b
    - F09c
    - F09d
    - F09e
    - F08b
    concurrent: []
  SC-UPDATE:
    uc: UC-05
    name: FirmwareUpdate
    steps:
    - F13a
    - F13b
    - F13c
    - F13d
    concurrent: []
  SC-SHIP:
    uc: UC-08
    name: StoreAndShip
    steps:
    - F14a
    - F14b
    - F14c
    concurrent: []
  SC-EOL:
    uc: UC-07
    name: EndOfLineTest
    steps:
    - F15a
    - F15b
    - F15c
    concurrent: []
regulations:
  REG-FCC15B:
    name: FCC Part 15 Subpart B
    market: US
    trigger: digital device
    standard: 47 CFR 15.107/15.109
  REG-FCC15C:
    name: FCC Part 15 Subpart C (or module grant)
    market: US
    trigger: 2.4 GHz intentional radiator
    standard: 47 CFR 15.247; KDB 996369
  REG-FCCRF:
    name: FCC RF exposure
    market: US
    trigger: body-worn transmitter < 20 cm
    standard: 47 CFR 2.1093; KDB 447498
  REG-RED:
    name: Radio Equipment Directive 2014/53/EU
    market: EU
    trigger: radio equipment
    standard: EN 300 328; EN 301 489-1/-17; EN IEC 62368-1; EN 62479 / EN 50566
  REG-ISED:
    name: ISED Canada
    market: CA
    trigger: radio equipment
    standard: RSS-Gen; RSS-247; RSS-102; ICES-003
  REG-UN383:
    name: UN 38.3 lithium battery transport
    market: all
    trigger: lithium cell/pack shipped
    standard: UN Manual of Tests and Criteria III.38.3
  REG-62133:
    name: IEC 62133-2 / UL 2054
    market: EU, retail
    trigger: portable lithium pack
    standard: IEC 62133-2; UL 2054; UL 1642 cell
  REG-62368:
    name: IEC/UL 62368-1 product safety
    market: all
    trigger: ICT/AV equipment with battery and charger
    standard: IEC 62368-1
  REG-ROHS:
    name: RoHS 2011/65/EU + 2015/863
    market: EU
    trigger: electrical equipment
    standard: EN IEC 63000
  REG-REACH:
    name: REACH SVHC, SCIP
    market: EU
    trigger: articles with chemicals
    standard: EC 1907/2006 Art. 33
  REG-PROP65:
    name: California Prop 65
    market: US-CA
    trigger: listed chemicals
    standard: Cal. Health & Safety Code 25249
  REG-10993:
    name: ISO 10993 biocompatibility
    market: all (expected under RED 3.1a safety)
    trigger: prolonged intact-skin contact
    standard: ISO 10993-1, -5, -10, -23
  REG-WEEE:
    name: WEEE / battery marking and take-back
    market: EU
    trigger: EEE with battery
    standard: 2012/19/EU; 2023/1542
requirements:
  R-001:
    type: PERF
    text: The cap shall operate ≥ 4 h continuously on-head per charge.
    from_:
    - N-01
    uc:
    - UC-02
    attr: runtime_h >= 4
    verify: test
    tests:
    - T-E4
    - T-B13
    regs: []
  R-002:
    type: PERF
    text: The cap shall maintain contact impedance within range on ≥ 99 % of sensor
      sites during a session.
    from_:
    - N-04
    uc:
    - UC-01
    attr: usable_fraction >= 0.99
    verify: test
    tests:
    - T-M5
    - T-I2
    - T-H1
    regs: []
  R-003:
    type: PERF
    text: The cap shall decode with end-to-end latency ≤ 1.0 s under reference noise.
    from_:
    - N-04
    uc:
    - UC-01
    attr: latency_s <= 1.0
    verify: test
    tests:
    - T-X2
    regs: []
  R-004:
    type: REL
    text: The cap shall achieve 2-year design life (≥ 2,920 on-head hours, ≥ 730 charge
      cycles, ≥ 1,460 don/doff) with R ≥ 0.90 at 90 % confidence.
    from_:
    - N-04
    - N-06
    uc:
    - UC-02
    attr: R(2yr) >= 0.90 @ C=0.90
    verify: analysis
    tests:
    - T-L2
    - T-M5
    - T-M6
    - T-B1
    regs: []
  R-005:
    type: REL
    text: No single sensor-site failure shall remove a contiguous region larger than
      2 % of sites.
    from_:
    - N-04
    uc:
    - UC-01
    attr: clustered_loss <= 0.02
    verify: analysis
    tests:
    - T-E1
    - T-L1
    regs: []
  R-010:
    type: SAFE
    text: Scalp-side surface temperature shall not exceed 41 °C sustained or 43 °C
      for > 10 min in any state.
    from_:
    - N-02
    uc:
    - UC-02
    - UC-04
    attr: T_scalp <= 41
    verify: test
    tests:
    - T-E5
    - T-B12
    regs: []
  R-011:
    type: SAFE
    text: Charging shall be inhibited while the cap is detected as worn.
    from_:
    - N-02
    uc:
    - UC-04
    attr: charge_enabled -> not worn
    verify: test
    tests:
    - T-F1
    - T-B12
    regs: []
  R-012:
    type: SAFE
    text: Charging shall occur only within the cell JEITA window (0–45 °C) and shall
      terminate at C/20.
    from_:
    - N-02
    uc:
    - UC-04
    attr: JEITA
    verify: test
    tests:
    - T-B11
    - T-X5
    regs: []
  R-013:
    type: SAFE
    text: DC leakage current into skin through any electrode shall be ≤ 10 µA under
      single-fault conditions.
    from_:
    - N-02
    uc:
    - UC-02
    attr: I_leak <= 10e-6
    verify: test
    tests:
    - T-X6
    regs: []
  R-014:
    type: SAFE
    text: Skin-contact materials shall show no cytotoxicity, irritation or sensitization
      per ISO 10993-5/-23/-10.
    from_:
    - N-01
    - N-02
    uc:
    - UC-02
    regs:
    - REG-10993
    verify: test
    tests:
    - T-BIO
    attr: ''
  R-015:
    type: SAFE
    text: The fault handler shall disable charging and acquisition within 1 s of a
      thermal or battery fault.
    from_:
    - N-02
    uc:
    - UC-04
    - UC-02
    attr: t_fault_cut <= 1 s
    verify: test
    tests:
    - T-F1
    regs: []
  R-020:
    type: REL
    text: The battery shall retain ≥ 80 % capacity after 500 cycles at 25 °C and ≥
      80 % after 300 cycles at 45 °C.
    from_:
    - N-04
    uc:
    - UC-04
    attr: Q500 >= 0.80
    verify: test
    tests:
    - T-B1
    - T-B2
    - T-B3
    regs: []
  R-021:
    type: SAFE
    text: Cell swelling shall not exceed 8 % thickness at end of life and the housing
      shall retain ≥ 10 % headroom.
    from_:
    - N-02
    uc:
    - UC-04
    attr: swell <= 0.08
    verify: test
    tests:
    - T-B4
    regs: []
  R-022:
    type: REGU
    text: The pack shall pass UN 38.3 T1–T8 and IEC 62133-2 (or UL 2054).
    from_:
    - N-09
    - N-10
    regs:
    - REG-UN383
    - REG-62133
    verify: test
    tests:
    - T-UN383
    - T-62133
    uc: []
    attr: ''
  R-023:
    type: PERF
    text: Fuel gauge state-of-charge error shall be ≤ 5 % across −10 to 45 °C and
      across life.
    from_:
    - N-01
    uc:
    - UC-04
    attr: soc_err <= 0.05
    verify: test
    tests:
    - T-B13
    regs: []
  R-030:
    type: ENV
    text: The cap shall be operational after IEC 60529 IPX4 water spray.
    from_:
    - N-03
    uc:
    - UC-02
    regs: []
    verify: test
    tests:
    - T-I1
    attr: ''
  R-031:
    type: ENV
    text: Electrode impedance drift shall be ≤ 15 % after five 24 h artificial-sweat
      soaks (ISO 105-E04).
    from_:
    - N-03
    - N-04
    uc:
    - UC-02
    verify: test
    tests:
    - T-I2
    regs: []
    attr: ''
  R-032:
    type: ENV
    text: The cap shall be operational after 1.0 m drops onto concrete in 6 orientations
      and after 50 tumble falls.
    from_:
    - N-03
    uc:
    - UC-02
    verify: test
    tests:
    - T-M3
    - T-M4
    regs: []
    attr: ''
  R-033:
    type: ENV
    text: The cap shall meet IEC 61000-4-2 criterion B at ±8 kV contact / ±15 kV air
      and criterion A at ±4/±8 kV.
    from_:
    - N-03
    uc:
    - UC-02
    verify: test
    tests:
    - T-X1
    regs: []
    attr: ''
  R-034:
    type: ENV
    text: The cap shall boot and hold a BLE link at −10 °C and operate at +45 °C.
    from_:
    - N-03
    uc:
    - UC-02
    verify: test
    tests:
    - T-E4
    - T-E5
    regs: []
    attr: ''
  R-035:
    type: ENV
    text: The cap shall be functional after IEC 60068-2-14 thermal cycling (−20/+60
      °C, 100 cycles) and 60068-2-30 damp heat.
    from_:
    - N-03
    - N-04
    uc:
    - UC-02
    verify: test
    tests:
    - T-E1
    - T-E2
    - T-E3
    regs: []
    attr: ''
  R-036:
    type: ENV
    text: The knit shall show no exposed conductor after 20,000 Martindale rubs and
      20 cleaning cycles.
    from_:
    - N-01
    - N-03
    uc:
    - UC-02
    verify: test
    tests:
    - T-M7
    - T-I4
    regs: []
    attr: ''
  R-040:
    type: IFACE
    text: The flex bus shall deliver channel data with bit error rate ≤ 1e-9 across
      the full stretch range.
    from_:
    - N-04
    uc:
    - UC-01
    attr: BER <= 1e-9
    verify: test
    tests:
    - T-M5
    - T-M6
    regs: []
  R-041:
    type: IFACE
    text: The BLE link shall reconnect within 5 s and sustain ≤ 0.1 % packet loss
      with the phone in a pocket at 1 m.
    from_:
    - N-12
    uc:
    - UC-03
    attr: reconnect <= 5 s
    verify: test
    tests:
    - T-R1
    regs: []
  R-042:
    type: SEC
    text: Pairing shall require user confirmation and the link shall be encrypted
      and authenticated.
    from_:
    - N-05
    - N-12
    uc:
    - UC-03
    verify: inspection
    tests:
    - T-SEC
    regs: []
    attr: ''
  R-043:
    type: IFACE
    text: Knit stretch limit shall be ≤ the flex array strain limit at every size
      (design interface requirement).
    from_:
    - N-04
    uc:
    - UC-02
    attr: stretch_knit <= strain_flex
    verify: analysis
    tests:
    - T-M5
    regs: []
  R-050:
    type: FUNC
    text: Don/doff shall be detected within 10 s with false on-head rate < 1 % (bag/table)
      on dry, wet and hair-covered head forms.
    from_:
    - N-01
    - N-11
    uc:
    - UC-02
    attr: t_detect <= 10 s
    verify: test
    tests:
    - T-F1
    regs: []
  R-051:
    type: FUNC
    text: 'Firmware update shall be atomic: power loss at any point shall leave a
      bootable image.'
    from_:
    - N-06
    uc:
    - UC-05
    verify: test
    tests:
    - T-F2
    regs: []
    attr: ''
  R-052:
    type: FUNC
    text: Every fault class (open channel, hot battery, drop, thermal limit, charger
      fault) shall be detected, classified and reported within one sync.
    from_:
    - N-11
    uc:
    - UC-06
    verify: test
    tests:
    - T-F1
    regs: []
    attr: ''
  R-053:
    type: FUNC
    text: Acquisition shall stop within 60 s of contact loss and the device shall
      enter Idle.
    from_:
    - N-01
    uc:
    - UC-02
    verify: test
    tests:
    - T-F1
    regs: []
    attr: ''
  R-060:
    type: MFG
    text: Every unit shall complete an end-of-line functional test (impedance map,
      battery, RF link, diagnostics) in ≤ 90 s with numeric pass/fail.
    from_:
    - N-08
    uc:
    - UC-07
    verify: demonstration
    tests:
    - T-EOL
    regs: []
    attr: ''
  R-061:
    type: MFG
    text: Units shall leave the factory in ship mode at 40–60 % SoC and wake on first
      dock after 6 months of storage.
    from_:
    - N-10
    uc:
    - UC-08
    verify: test
    tests:
    - T-S1
    regs: []
    attr: ''
  R-062:
    type: ENV
    text: Packaged units shall be functional after IEC 60068-2-64 random vibration
      (1.5 Grms, 1 h/axis).
    from_:
    - N-10
    uc:
    - UC-08
    verify: test
    tests:
    - T-M1
    regs: []
    attr: ''
  R-070:
    type: REGU
    text: The cap shall comply with FCC Part 15 B (and 15 C or module grant) and FCC
      RF exposure rules for body-worn devices.
    from_:
    - N-09
    regs:
    - REG-FCC15B
    - REG-FCC15C
    - REG-FCCRF
    verify: test
    tests:
    - T-FCC
    - T-X4
    uc: []
    attr: ''
  R-071:
    type: REGU
    text: The cap shall comply with RED 2014/53/EU via harmonized standards EN 300
      328, EN 301 489-1/-17, EN IEC 62368-1, EN 62479/EN 50566.
    from_:
    - N-09
    regs:
    - REG-RED
    - REG-62368
    verify: test
    tests:
    - T-RED
    uc: []
    attr: ''
  R-072:
    type: REGU
    text: The cap shall comply with ISED RSS-Gen, RSS-247, RSS-102 and ICES-003.
    from_:
    - N-09
    regs:
    - REG-ISED
    verify: test
    tests:
    - T-ISED
    uc: []
    attr: ''
  R-073:
    type: REGU
    text: All materials shall comply with RoHS (10 substances) and REACH SVHC disclosure;
      Prop 65 labeling where applicable.
    from_:
    - N-09
    regs:
    - REG-ROHS
    - REG-REACH
    - REG-PROP65
    verify: inspection
    tests:
    - T-MAT
    uc: []
    attr: ''
  R-074:
    type: REGU
    text: The product shall carry WEEE and battery marks and support take-back.
    from_:
    - N-09
    regs:
    - REG-WEEE
    verify: inspection
    tests:
    - T-LABEL
    uc: []
    attr: ''
  R-080:
    type: REL
    text: Year-1 hardware AFR shall be ≤ 3 % at launch and ≤ 2 % by month 6, measured
      from telemetry unit-years.
    from_:
    - N-06
    uc:
    - UC-06
    attr: AFR <= 0.03
    verify: analysis
    tests:
    - T-FIELD
    regs: []
functions:
  F01:
    name: Don cap / fit and retain
    alloc:
    - P-TEXTILE
    - P-ARRAY
    reqs:
    - R-002
    - R-043
    perf: stays in place 4 h; stretch ≤ 20 %
    safety_decision: ''
  F02:
    name: Make and hold electrode–scalp contact
    alloc:
    - P-ARRAY
    - P-TEXTILE
    reqs:
    - R-002
    perf: ≥ 99 % sites in range
    safety_decision: ''
  F03:
    name: Detect don/doff and usable channels
    alloc:
    - P-FW-ACQ
    - P-ASIC
    reqs:
    - R-050
    - R-053
    perf: ≤ 10 s; false on-head < 1 %
    safety_decision: worn-detect threshold
  F04:
    name: Acquire neural signals
    alloc:
    - P-ASIC
    - P-FLEX
    - P-MCU
    reqs:
    - R-002
    - R-004
    - R-005
    - R-034
    perf: noise floor ≤ spec
    safety_decision: ''
  F05:
    name: Transfer channel data array → module
    alloc:
    - P-FLEX
    - P-MCU
    reqs:
    - R-040
    perf: BER ≤ 1e-9
    safety_decision: ''
  F06:
    name: Decode signals to text
    alloc:
    - P-FW-DEC
    - P-MCU
    reqs:
    - R-003
    perf: latency ≤ 1 s
    safety_decision: ''
  F07:
    name: Pair and stream to phone
    alloc:
    - P-RADIO
    - P-FW-BLE
    reqs:
    - R-041
    - R-042
    perf: reconnect ≤ 5 s
    safety_decision: ''
  F08:
    name: Supply and manage power
    alloc:
    - P-BATT
    - P-FW-PWR
    reqs:
    - R-001
    - R-004
    - R-021
    - R-034
    perf: 4 h runtime; no brown-out
    safety_decision: ''
  F08b:
    name: Update fuel gauge
    alloc:
    - P-GAUGE
    - P-FW-CHG
    reqs:
    - R-023
    perf: SoC error ≤ 5 %
    safety_decision: SoC gates update and low-battery behaviour
  F09a:
    name: Detect dock
    alloc:
    - P-CHARGER
    - P-FW-CHG
    reqs:
    - R-061
    perf: ''
    safety_decision: ''
  F09b:
    name: Check not worn before charging
    alloc:
    - P-FW-CHG
    - P-FW-ACQ
    reqs:
    - R-011
    perf: ''
    safety_decision: worn-detect impedance
  F09c:
    name: Check cell temperature (JEITA)
    alloc:
    - P-NTC
    - P-FW-CHG
    reqs:
    - R-012
    perf: ''
    safety_decision: NTC reading
  F09d:
    name: Charge CC-CV
    alloc:
    - P-CHARGER
    - P-BATT
    reqs:
    - R-012
    - R-020
    perf: 0.5 C to 4.2 V
    safety_decision: ''
  F09e:
    name: Terminate charge at cutoff
    alloc:
    - P-CHARGER
    - P-FW-CHG
    reqs:
    - R-012
    perf: C/20
    safety_decision: ''
  F10:
    name: Protect wearer from heat, current and materials
    alloc:
    - P-HOUSING
    - P-NTC2
    - P-FW-DIAG
    - P-COATING
    reqs:
    - R-010
    - R-013
    - R-014
    - R-015
    perf: scalp ≤ 41 °C
    safety_decision: scalp thermistor
  F11:
    name: Protect electronics from environment
    alloc:
    - P-TEXTILE
    - P-ENCAP
    - P-HOUSING
    - P-ASIC
    reqs:
    - R-030
    - R-031
    - R-032
    - R-033
    - R-035
    - R-036
    perf: IPX4, sweat, ESD, drop
    safety_decision: ''
  F12:
    name: Monitor health and report telemetry
    alloc:
    - P-FW-DIAG
    - P-FW-BLE
    reqs:
    - R-052
    - R-080
    perf: all fault classes within one sync
    safety_decision: ''
  F13a:
    name: Receive firmware image
    alloc:
    - P-FW-BLE
    reqs:
    - R-051
    perf: ''
    safety_decision: ''
  F13b:
    name: Verify image signature
    alloc:
    - P-FW-PWR
    reqs:
    - R-042
    - R-051
    perf: ''
    safety_decision: ''
  F13c:
    name: Write image to inactive bank
    alloc:
    - P-FW-PWR
    - P-MCU
    reqs:
    - R-051
    perf: ''
    safety_decision: SoC > 30 % gate
  F13d:
    name: Reboot and confirm
    alloc:
    - P-FW-PWR
    reqs:
    - R-051
    perf: ''
    safety_decision: ''
  F14a:
    name: Enter ship mode at factory
    alloc:
    - P-FW-PWR
    - P-CM
    reqs:
    - R-061
    perf: 40–60 % SoC
    safety_decision: ''
  F14b:
    name: Survive storage and transport
    alloc:
    - P-BATT
    - P-PACKAGING
    reqs:
    - R-061
    - R-062
    perf: 6 months
    safety_decision: ''
  F14c:
    name: Wake on first dock
    alloc:
    - P-FW-PWR
    - P-CHARGER
    reqs:
    - R-061
    perf: ''
    safety_decision: ''
  F15a:
    name: Run EoL functional test
    alloc:
    - P-CM
    - P-FW-DIAG
    reqs:
    - R-060
    perf: ≤ 90 s
    safety_decision: ''
  F15b:
    name: Record serial and test data
    alloc:
    - P-CM
    reqs:
    - R-060
    perf: ''
    safety_decision: ''
  F15c:
    name: Apply HASS screen
    alloc:
    - P-CM
    reqs:
    - R-060
    perf: inside operating margin
    safety_decision: ''
logical_components:
  LC-FIT:
    name: Head Interface
    role: Hold the system on the head and keep sensing elements against the scalp
    funcs:
    - F01
    - F02
    quality:
    - comfort
    - retention
    - size range
    parts:
    - P-TEXTILE
    - P-ARRAY
  LC-SENSE:
    name: Neural Sensing
    role: Transduce scalp potentials into digitized channel data
    funcs:
    - F04
    - F05
    quality:
    - noise floor
    - channel count
    - robustness to motion
    parts:
    - P-ASIC
    - P-FLEX
    - P-MCU
  LC-COND:
    name: Contact Supervision
    role: Decide when the system is worn and which channels are usable
    funcs:
    - F03
    quality:
    - false on-head rate
    - latency
    parts:
    - P-FW-ACQ
    - P-ASIC
  LC-DEC:
    name: Decoding
    role: Convert channel data to text with the Brain Foundation Model
    funcs:
    - F06
    quality:
    - accuracy
    - latency
    parts:
    - P-FW-DEC
    - P-MCU
  LC-COMM:
    name: Communication
    role: Pair with and stream to the phone; receive updates
    funcs:
    - F07
    - F13a
    quality:
    - link robustness
    - security
    parts:
    - P-RADIO
    - P-FW-BLE
  LC-PWR:
    name: Energy Storage and Management
    role: Store energy, supply it, estimate state of charge
    funcs:
    - F08
    - F08b
    quality:
    - runtime
    - cycle life
    - SoC accuracy
    parts:
    - P-BATT
    - P-CELL
    - P-PCM
    - P-GAUGE
    - P-FW-PWR
    - P-FW-CHG
  LC-CHG:
    name: Charging Control
    role: Replenish energy safely
    funcs:
    - F09a
    - F09b
    - F09c
    - F09d
    - F09e
    quality:
    - safety
    - charge time
    parts:
    - P-CHARGER
    - P-NTC
    - P-FW-CHG
    - P-FW-ACQ
    - P-BATT
  LC-SAFE:
    name: Wearer Protection
    role: Keep heat, current and materials within safe limits
    funcs:
    - F10
    quality:
    - scalp temperature
    - leakage
    - biocompatibility
    parts:
    - P-HOUSING
    - P-NTC2
    - P-FW-DIAG
    - P-COATING
  LC-ENV:
    name: Environmental Protection
    role: Isolate electronics from sweat, water, ESD and impact
    funcs:
    - F11
    quality:
    - ingress
    - ESD
    - drop
    parts:
    - P-TEXTILE
    - P-ENCAP
    - P-HOUSING
    - P-ASIC
  LC-HEALTH:
    name: Health Monitoring
    role: Detect, classify and report faults
    funcs:
    - F12
    quality:
    - coverage
    - attribution accuracy
    parts:
    - P-FW-DIAG
    - P-FW-BLE
  LC-UPD:
    name: Software Update
    role: Replace firmware atomically
    funcs:
    - F13b
    - F13c
    - F13d
    quality:
    - atomicity
    - authenticity
    parts:
    - P-FW-PWR
    - P-MCU
    - P-FW-BLE
  LC-LIFE:
    name: Lifecycle Support
    role: Manufacturing test, ship mode, storage
    funcs:
    - F14a
    - F14b
    - F14c
    - F15a
    - F15b
    - F15c
    quality:
    - testability
    - shelf life
    parts:
    - P-FW-PWR
    - P-CM
    - P-BATT
    - P-PACKAGING
    - P-CHARGER
    - P-FW-DIAG
logical_interfaces:
  LI-01:
    a: LC-FIT
    b: LC-SENSE
    flow: mechanical placement of sensing elements; shared strain
  LI-02:
    a: LC-SENSE
    b: LC-COND
    flow: per-site impedance
  LI-03:
    a: LC-SENSE
    b: LC-DEC
    flow: channel data stream
  LI-04:
    a: LC-COND
    b: LC-CHG
    flow: worn / not-worn decision
  LI-05:
    a: LC-DEC
    b: LC-COMM
    flow: decoded text
  LI-06:
    a: LC-HEALTH
    b: LC-COMM
    flow: telemetry; fault reports
  LI-07:
    a: LC-PWR
    b: LC-CHG
    flow: cell voltage, temperature, SoC
  LI-08:
    a: LC-PWR
    b: LC-SENSE
    flow: regulated power
  LI-09:
    a: LC-SAFE
    b: LC-CHG
    flow: thermal inhibit
  LI-10:
    a: LC-SAFE
    b: LC-HEALTH
    flow: thermal and leakage events
  LI-11:
    a: LC-COMM
    b: LC-UPD
    flow: firmware image
  LI-12:
    a: LC-PWR
    b: LC-UPD
    flow: SoC gate for update
  LI-13:
    a: LC-LIFE
    b: LC-HEALTH
    flow: end-of-line diagnostics
  LI-14:
    a: LC-LIFE
    b: LC-PWR
    flow: ship-mode command; wake
