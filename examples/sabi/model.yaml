    name: array.bus ↔ module.bus (flex-to-rigid)
    a: P-ARRAY
    b: P-MODULE
    items:
    - ChannelData
    - ElectricalPower
    kind: electrical + mechanical
    funcs:
    - F05
  IF-2:
    name: battery.bus ↔ module.batt
    a: P-BATT
    b: P-MODULE
    items:
    - ElectricalPower
    - cellTemp
    - SoC
    kind: electrical + thermal
    funcs:
    - F08
    - F09c
    - F08b
  IF-3:
    name: textile.skin ↔ array.electrodes (co-located)
    a: P-TEXTILE
    b: P-ARRAY
    items:
    - Sweat
    - MechanicalLoad
    kind: material + mechanical
    funcs:
    - F02
    - F11
  IF-4:
    name: textile.fit = array.mech (shared head load)
    a: P-TEXTILE
    b: P-ARRAY
    items:
    - MechanicalLoad
    kind: mechanical
    funcs:
    - F01
  IF-5:
    name: array.electrodes ↔ head.scalp
    a: P-ARRAY
    b: P-HEAD
    items:
    - NeuralSignal
    - Sweat
    - Heat
    - DC leakage
    kind: bio-electrical
    funcs:
    - F02
    - F04
  IF-6:
    name: module.skinSide ↔ head.scalp
    a: P-MODULE
    b: P-HEAD
    items:
    - Heat
    kind: thermal
    funcs:
    - F10
  IF-7:
    name: module.radio ↔ phone.link
    a: P-MODULE
    b: P-PHONE
    items:
    - DecodedText
    - Telemetry
    - FirmwareImage
    kind: RF + protocol
    funcs:
    - F07
    - F12
    - F13a
  IF-8:
    name: dock.power ↔ module.charge
    a: P-DOCK
    b: P-MODULE
    items:
    - ElectricalPower
    kind: electrical + mechanical
    funcs:
    - F09a
    - F09d
  IF-9:
    name: head.shape ↔ textile.fit
    a: P-HEAD
    b: P-TEXTILE
    items:
    - MechanicalLoad
    kind: mechanical + human factors
    funcs:
    - F01
states:
  S-SHIPMODE:
    name: ShipMode
  S-OFF:
    name: 'Off'
  S-IDLE:
    name: Idle
  S-PAIRING:
    name: Pairing
  S-ACQUIRING:
    name: Acquiring
  S-STREAMING:
    name: Streaming
  S-CHARGING:
    name: Charging
  S-UPDATING:
    name: Updating
  S-FAULT:
    name: Fault
transitions:
  TR-01:
    frm: S-SHIPMODE
    to: S-IDLE
    trigger: dockDetected
    guard: ''
    sensor: P-CHARGER
    func: F14c
  TR-02:
    frm: S-OFF
    to: S-IDLE
    trigger: powerButton
    guard: ''
    sensor: null
    func: F08
  TR-03:
    frm: S-IDLE
    to: S-ACQUIRING
    trigger: contactDetected
    guard: ''
    sensor: P-FW-ACQ
    func: F03
  TR-04:
    frm: S-ACQUIRING
    to: S-STREAMING
    trigger: linkUp
    guard: ''
    sensor: null
    func: F07
  TR-05:
    frm: S-STREAMING
    to: S-ACQUIRING
    trigger: linkLost
    guard: ''
    sensor: null
    func: F07
  TR-06:
    frm: S-ACQUIRING
    to: S-IDLE
    trigger: contactLost
    guard: after 60 s
    sensor: P-FW-ACQ
    func: F03
  TR-07:
    frm: S-IDLE
    to: S-CHARGING
    trigger: dockDetected
    guard: not worn
    sensor: P-FW-ACQ
    func: F09b
  TR-08:
    frm: S-CHARGING
    to: S-IDLE
    trigger: chargeComplete or undocked
    guard: ''
    sensor: P-GAUGE
    func: F09e
  TR-09:
    frm: S-IDLE
    to: S-UPDATING
    trigger: fwAvailable
    guard: soc > 30 %
    sensor: P-GAUGE
    func: F13c
  TR-10:
    frm: S-UPDATING
    to: S-IDLE
    trigger: updateConfirmed
    guard: ''
    sensor: null
    func: F13d
  TR-11:
    frm: S-IDLE
    to: S-OFF
    trigger: idleTimeout
    guard: ''
    sensor: null
    func: F08
  TR-12:
    frm: S-STREAMING
    to: S-FAULT
    trigger: thermal or battery fault
    guard: scalpTemp > 41 or cellTemp > 50
    sensor: P-NTC2
    func: F10
  TR-13:
    frm: S-CHARGING
    to: S-FAULT
    trigger: charge fault
    guard: cellTemp outside JEITA or OVP or NTC fault
    sensor: P-NTC
    func: F09c
  TR-14:
    frm: S-FAULT
    to: S-IDLE
    trigger: faultCleared
    guard: userAck
    sensor: null
    func: F10
  TR-15:
    frm: S-IDLE
    to: S-PAIRING
    trigger: pairRequest
    guard: ''
    sensor: null
    func: F07
  TR-16:
    frm: S-PAIRING
    to: S-ACQUIRING
    trigger: paired
    guard: user confirmed
    sensor: null
    func: F07
constraints:
  C-THERM:
    name: ScalpTemperature
    formula: T_scalp = T_ambient + P_module · R_th(housing→scalp) ≤ 41 °C
    inputs:
    - P-MODULE.power_W
    - P-HOUSING.R_th_scalp
    reqs:
    - R-010
    tests:
    - T-E5
    - T-B12
  C-FLEX:
    name: FlexLife (inverse power law)
    formula: N_fail = N_ref · (ε_ref/ε_use)^n, n ≈ 2; require N_fail ≥ 3 × 1,460
    inputs:
    - P-TEXTILE.stretchLimit
    - P-FLEX.strainLimit
    reqs:
    - R-004
    - R-043
    tests:
    - T-L2
    - T-M5
    - T-M6
  C-SOLDER:
    name: SolderFatigue (Coffin-Manson)
    formula: AF = (ΔT_test/ΔT_use)^2; 100 cycles at ΔT 80 ≈ 7.7 yr at ΔT 15
    inputs:
    - P-ARRAY.nSites
    reqs:
    - R-004
    - R-005
    tests:
    - T-E1
    - T-L2
  C-PECK:
    name: SweatCorrosion (Peck)
    formula: AF = (RH_t/RH_u)^2.7 · exp[(Ea/k)(1/T_u − 1/T_t)], Ea 0.8 eV; 500 h at
      60 °C/90 % ≈ 5 yr
    inputs:
    - use profile scalp microclimate
    reqs:
    - R-004
    - R-031
    tests:
    - T-E3
    - T-I2
    - T-L2
  C-BATT:
    name: BatteryLife
    formula: Q(n,T) = Q0·(1 − k·n)·exp(−Ea/k(1/T_u − 1/T_r)·t); Q(500, 25 °C) ≥ 0.8
      Q0; swelling(Q) ≤ 8 %
    inputs:
    - P-CELL
    - P-CHARGER.Vcv
    reqs:
    - R-020
    - R-021
    tests:
    - T-B1
    - T-B2
    - T-B3
    - T-B4
  C-WEIB:
    name: Reliability (Weibull)
    formula: R(t) = exp[−(t/η)^β] ≥ 0.90 at 2 yr, 90 % confidence; n = ln(1−C)/ln(R)
      traded with (t_test/t_use)^β
    inputs:
    - all life tests
    reqs:
    - R-004
    tests:
    - T-L2
  C-AFR:
    name: FieldAFR
    formula: AFR = failures / unit-years (telemetry); ≤ 3 % → ≤ 2 %
    inputs:
    - telemetry on-head hours
    reqs:
    - R-080
    tests:
    - T-FIELD
  C-SAMPLE:
    name: SampleSize
    formula: 'success-run n = ln(1−C)/ln(R): 22 at 90/90; reduced by (t_test/t_use)^β'
    inputs:
    - C-WEIB
    reqs:
    - R-004
    tests:
    - T-L2
trades:
  TD-01:
    name: 'Radio: pre-certified module vs custom'
    options:
    - module (modular grant, host SDoC)
    - custom (full 15C/RED radio test)
    criteria:
    - schedule
    - RF margin
    - cost
    - size
    recommendation: module for launch; custom for v2
    affects:
    - R-070
    - R-071
    - R-072
  TD-02:
    name: 'Charging while worn: allow vs inhibit'
    options:
    - allow with thermal limit
    - inhibit via worn-detect
    criteria:
    - safety (R-010)
    - UX
    - complexity
    recommendation: inhibit; makes R-011 a requirement
    affects:
    - R-011
    - R-010
  TD-03:
    name: 'Scalp thermistor: present vs rely on cell NTC'
    options:
    - dedicated scalp-side NTC
    - infer from cell NTC + model
    criteria:
    - detection latency (FM on TR-12)
    - cost
    recommendation: dedicated NTC at thermal-map hotspot
    affects:
    - R-010
    - R-015
  TD-04:
    name: 'Firmware update: single bank vs dual bank'
    options:
    - single bank + bootloader
    - dual bank A/B
    criteria:
    - brick risk (R-051)
    - flash cost
    recommendation: dual bank
    affects:
    - R-051
  TD-05:
    name: 'Electrode finish: Ag/AgCl vs carbon vs gold'
    options:
    - Ag/AgCl
    - carbon-loaded polymer
    - gold
    criteria:
    - impedance
    - corrosion (R-031)
    - biocompat (R-014)
    - cost
    recommendation: carbon-loaded for v1 pending 10993
    affects:
    - R-014
    - R-031
    - R-013
arch_decisions:
  AD-01:
    title: Single electronics module at the crown
    decision: Concentrate MCU, radio, charger and battery in one rigid module at the
      crown; sensor array is passive flex with distributed ASICs
    rationale: Minimises rigid mass on the scalp sides; one flex-to-rigid interface
      (IF-1) instead of many; drop energy absorbed at crown
    trade: null
    reqs:
    - R-005
    - R-032
    - R-010
    consequences:
    - IF-1 becomes the dominant fatigue interface (FM on F05)
    - crown thermal path must be managed (C-THERM)
  AD-02:
    title: Pre-certified radio module
    decision: Use a modular-approved BLE module for v1
    rationale: Removes 15C/RED radio test from the critical path; host SDoC only
    trade: TD-01
    reqs:
    - R-070
    - R-071
    - R-072
    consequences:
    - Antenna placement constrained by module
    - v2 may integrate
  AD-03:
    title: Charging inhibited while worn
    decision: Charging is gated by worn-detect; no charging on head
    rationale: Removes the dominant burn scenario rather than mitigating it
    trade: TD-02
    reqs:
    - R-011
    - R-010
    consequences:
    - Worn-detect becomes a safety function (F09b)
    - needs multi-feature detection
  AD-04:
    title: Dedicated scalp-side thermistor
    decision: Place a second NTC at the thermal-map hotspot on the scalp side
    rationale: Cell NTC cannot see scalp temperature; latency of inferred temperature
      too high
    trade: TD-03
    reqs:
    - R-010
    - R-015
    consequences:
    - Thermal map test required on every build (T-E5)
  AD-05:
    title: Dual-bank firmware
    decision: A/B banks with signed images and rollback
    rationale: Eliminates brick-on-power-loss
    trade: TD-04
    reqs:
    - R-051
    - R-042
    consequences:
    - Flash cost
    - SoC gate for update
  AD-06:
    title: Ship mode at factory
    decision: Deep-sleep ship mode at 40–60 % SoC, exit on first dock
    rationale: Six-month shelf without deep discharge
    trade: null
    reqs:
    - R-061
    consequences:
    - EoL step; wake test per lot (T-S1)
  AD-07:
    title: Carbon-loaded electrode finish, nickel-free
    decision: Carbon-loaded polymer electrode surface; no nickel anywhere in skin
      contact
    rationale: Corrosion and sensitization risk lower than metal finishes
    trade: TD-05
    reqs:
    - R-013
    - R-014
    - R-031
    consequences:
    - Higher impedance than Ag/AgCl; ASIC input range must accommodate
  AD-08:
    title: Serpentine flex with strain relief; knit stretch bounded
    decision: Flex traces serpentine; bend radius rule at IF-1; knit stretch limit
      ≤ flex strain limit (R-043)
    rationale: Interconnect fatigue is the dominant life mechanism (C-FLEX)
    trade: null
    reqs:
    - R-004
    - R-043
    consequences:
    - Knit sizing range limited by flex
