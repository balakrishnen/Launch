process_steps:
  PS-01:
    name: Knit cap body with conductive yarn routing
    station: ST-10 Knitting
    seq: 1
    parts:
    - P-KNIT
    output: null
    characteristics:
    - yarn tension 2.0±0.2 cN
    - sensor-site pitch ±1 mm
    controls: program lock, first-article check per lot
    cycle_s: 420
    team: TM-MFG
    eol_test: null
  PS-02:
    name: Place and bond flex array to knit
    station: ST-20 Lamination
    seq: 2
    parts:
    - P-FLEX
    - P-KNIT
    output: null
    characteristics:
    - bond peel strength ≥ 8 N/25 mm
    - alignment ±0.5 mm
    controls: fixture with datum pins, cure profile logged
    cycle_s: 300
    team: TM-MFG
    eol_test: null
  PS-03:
    name: Mount SoC module and battery pack
    station: ST-30 Electronics assembly
    seq: 3
    parts:
    - P-MODULE
    - P-CELL
    output: null
    characteristics:
    - connector fully seated (latch click)
    - torque 0.15 N·m
    controls: poka-yoke connector keying, torque driver with log
    cycle_s: 240
    team: TM-MFG
    eol_test: null
  PS-04:
    name: Functional and impedance EOL test
    station: ST-40 EOL test
    seq: 4
    parts: []
    output: P-CAP
    characteristics:
    - all channels < 50 kΩ on phantom head
    - charge current within ±5 %
    controls: TestRUNS sequence, serialized log
    cycle_s: 90
    team: TM-TEST
    eol_test: T-E1
