tests:
  T-001:
    name: Assisted range test (EN 17404)
    method: Dyno/track range run at 25 km/h assist from full charge to cut-off
    gate: DVT
    passfail: range >= 60 km
    units: km
    kind: test
  T-002:
    name: Drive noise measurement
    method: Sound pressure at 1 m, hemi-anechoic, dyno across assist levels to 25 km/h
    gate: DVT
    passfail: LpA < 55 dB(A) at all points
    units: dB(A)
    kind: test
  T-003:
    name: IPX6 water-jet test (IEC 60529)
    method: 12.5 mm nozzle, 100 L/min, 3 min min, all directions; functional check + teardown
    gate: DVT
    passfail: 0 functional failures, no water ingress into electronics
    units: failures
    kind: test
  T-004:
    name: Drive unit mass inspection
    method: Weigh n=5 production-intent units on calibrated scale
    gate: DVT
    passfail: max mass < 3.5 kg
    units: kg
    kind: inspection
  T-005:
    name: EN 15194 assist cut-off and rated power test
    method: 'Dyno: rated continuous power per EN 15194/EN 60034-1, assist vs speed sweep, no-pedal assist check'
    gate: Certification
    passfail: P_rated <= 250 W; assist = 0 at >= 25 km/h; no assist without pedalling
    units: W, km/h
    kind: test
  T-006:
    name: UN 38.3 battery transport tests
    method: Accredited lab T.1–T.8 (altitude, thermal, vibration, shock, ext. short, impact, overcharge, forced discharge)
    gate: Certification
    passfail: all T.1–T.8 pass; test summary issued
    units: pass/fail
    kind: test
gates: {}
fm_assessments: {}
program:
  lanes: []
