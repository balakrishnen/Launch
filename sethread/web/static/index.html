<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch</title>
<script src="/static/cytoscape.min.js"></script>
<script src="/static/marked.min.js"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2430;--quiet:#6b7280;--line:#e3e6eb;--accent:#1f6feb;--accent2:#0f766e;--warn:#b45309;--bad:#b91c1c;--good:#15803d;
 --s1:#c2410c;--s2:#b45309;--s3:#1d4ed8;--s4:#0f766e;--s5:#7e22ce;--s6:#15803d;--sr:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:grid;grid-template-rows:48px 1fr;grid-template-columns:240px 1fr 420px;grid-template-areas:"top top top" "nav main chat"}
header{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.3px}header .proj{color:var(--quiet)}
header input{flex:1;max-width:480px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.pill{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef2ff;color:var(--accent)}.pill.good{background:#dcfce7;color:var(--good)}.pill.warn{background:#fef3c7;color:var(--warn)}
button{font:inherit;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}button:hover{border-color:#bbb}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.good{background:var(--good);color:#fff;border-color:var(--good)}button.bad{background:#fff;color:var(--bad);border-color:#f3b4b4}button.sm{padding:3px 8px;font-size:12px}
nav{grid-area:nav;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
nav h4{margin:12px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--quiet)}
nav a{display:flex;justify-content:space-between;padding:5px 10px;border-radius:7px;color:var(--ink);text-decoration:none;cursor:pointer}nav a:hover{background:#f0f3f8}nav a.active{background:#e8efff;color:var(--accent);font-weight:600}nav a .n{color:var(--quiet);font-size:12px}
main{grid-area:main;overflow:auto;padding:18px 22px}
aside{grid-area:chat;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#log{flex:1;overflow:auto;padding:12px}#composer{border-top:1px solid var(--line);padding:10px}
#composer textarea{width:100%;min-height:64px;resize:vertical;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:#fafafa;cursor:pointer}.chip:hover{background:#eef2ff}
.msg{margin:8px 0;padding:9px 12px;border-radius:10px;max-width:100%}.msg.user{background:#e8efff;margin-left:30px}.msg.assistant{background:#f6f7f9}.msg p{margin:4px 0}.msg code{background:#eef;padding:1px 4px;border-radius:4px}
.tool{font-size:12px;color:var(--quiet);padding:1px 10px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool.err{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}.card.perm{border-color:#c4b5fd;background:#f5f3ff}.card.patch{border-color:#fcd34d;background:#fffbeb}.card.patch.applied{border-color:#86efac;background:#f0fdf4}.card.patch.rejected{opacity:.55}
.card h5{margin:0 0 6px;font-size:13px}.ops{margin:6px 0;font-size:12px}.ops div{padding:2px 0;cursor:pointer}.ops .op{display:inline-block;width:52px;font-weight:600;color:var(--quiet)}.ops .add .op{color:var(--good)}.ops .remove .op{color:var(--bad)}
pre.diff{font:11.5px/1.35 ui-monospace,Menlo,monospace;background:#0f172a;color:#e2e8f0;padding:8px;border-radius:7px;overflow:auto;max-height:260px;white-space:pre}pre.diff .a{color:#86efac}pre.diff .d{color:#fca5a5}
.delta{font-size:12px;color:var(--quiet)}.delta b.good{color:var(--good)}.delta b.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{background:#f3f5f8;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--quiet)}tr:hover td{background:#fafbff}
a.id{color:var(--accent);text-decoration:none;font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;cursor:pointer}a.id:hover{text-decoration:underline}
.crumb{color:var(--quiet);font-size:12px;margin-bottom:6px}.stage{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--quiet)}
dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0}dt{color:var(--quiet)}dd{margin:0}
.link{display:flex;gap:8px;padding:3px 0;align-items:baseline}.link .rel{color:var(--quiet);font-size:12px;min-width:110px}
#cy{height:calc(100vh - 140px);background:#fff;border:1px solid var(--line);border-radius:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.gallery img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.mdoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 26px;max-width:1100px}.mdoc img{max-width:100%}.mdoc table{font-size:12px}
.empty{color:var(--quiet);padding:30px;text-align:center}
body.nochat{grid-template-columns:240px 1fr 0}body.nochat aside{display:none}
.gridwrap{overflow:auto;max-height:calc(100vh - 170px);border:1px solid var(--line);border-radius:10px;background:#fff}
table.grid{border:0;border-radius:0;width:auto;min-width:100%;table-layout:auto;font-size:12px}table.grid th{position:sticky;background:#f3f5f8;z-index:2;white-space:normal;line-height:1.2}
table.grid thead tr:first-child th{top:0;padding:4px 8px;background:#B8CCE4;color:#1d2430;text-align:center;letter-spacing:.3px}table.grid thead tr:nth-child(2) th{padding:4px 8px;cursor:pointer;user-select:none;vertical-align:middle}table.grid thead tr:nth-child(3) th{padding:3px 6px;background:#fff}
table.grid thead input{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:5px;font-size:11px}
table.grid td{padding:5px 8px;vertical-align:top}table.grid td.merged{background:#fafbfd;border-right:1px solid #e3e6eb}table.grid td.num{text-align:center;font-weight:600}
table.grid td[contenteditable]{outline:1px dashed transparent}table.grid td[contenteditable]:hover{outline-color:#c7d2fe;background:#fbfcff}table.grid td[contenteditable]:focus{outline:2px solid var(--accent);background:#fff}table.grid td.dirty{background:#fff7d6}
.gridbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.gridbar .count{color:var(--quiet);font-size:12px}
.sortmark{font-size:10px;color:var(--accent)}.ap-H{color:var(--bad);font-weight:700}.ap-M{color:var(--warn);font-weight:600}.ap-L{color:var(--good)}
.toggle{font-size:12px;color:var(--quiet);display:flex;gap:6px;align-items:center}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid #c7d2fe;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" style="color:inherit;text-decoration:none">Launch</a><span class="proj" id="projName">…</span>
  <span class="pill" id="covPill">…</span>
  <input id="search" placeholder="Search anything — R-012, battery, IPX6, burn…" autocomplete="off">
  <button id="btnBuild">Build artifacts</button>
  <button id="btnPatches">Patches <span class="pill" id="stagedN">0</span></button>
  <span id="userBadge" class="toggle"></span>
  <button class="sm" id="btnChat" title="show / hide the agent pane">Agent ▸</button>
</header>
<div id="overlay" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto"></div>
<nav id="nav"></nav>
<main id="main"><div class="empty">Loading…</div></main>
<aside>
  <div id="log"></div>
  <div id="composer">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span id="agentState" class="toggle">idle</span>
      <span class="row">
        <label class="toggle"><input type="checkbox" id="autoApprove"> auto-approve patches</label>
        <button class="sm" id="btnStop">Stop</button>
      </span>
    </div>
    <textarea id="input" placeholder="Tell the agent what to do… e.g. “Read the PRD in docs/ and set up stakeholders, needs and MoEs”, “Design the charger for a 2S pack”, “Assess all failure modes of F07”. Ctrl/⌘-Enter to send."></textarea>
    <div class="chips" id="chips"></div>
  </div>
</aside>
<script>
const PID=(location.pathname.match(/^\/p\/([^/]+)/)||[])[1]||null;
const $=s=>document.querySelector(s), api=(p,o)=>fetch((p.startsWith('/projects')||p.startsWith('/me')||p.startsWith('/login')||p.startsWith('/logout')||p.startsWith('/oslc/')?'/api':'/api/p/'+PID)+p,o).then(r=>{if(!r.ok)return r.json().then(j=>{throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail||r.statusText))});return r.json()});
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
let P=null, view={type:'home'}, graphData=null, cy=null;
const STAGE_COLOR={'1 Needs':'var(--s1)','2 Requirements':'var(--s2)','3 Logical architecture':'var(--s3)','4 Physical architecture':'var(--s4)','5 Analysis':'var(--s5)','6 Verification':'var(--s6)','Risk (derived)':'var(--sr)'};
const LABEL={stakeholders:'Stakeholders',needs:'Needs',moes:'Measures of effectiveness',actors:'Actors',use_cases:'Use cases',scenarios:'Scenarios',regulations:'Regulations',requirements:'Requirements',functions:'Functions',logical_components:'Logical components',logical_interfaces:'Logical interfaces',parts:'Parts',nodes:'Physical nodes',interfaces:'Interfaces',states:'States',transitions:'Transitions',arch_decisions:'Architecture decisions',trades:'Trade studies',constraints:'Constraints',tests:'Tests',gates:'Gates',fm_assessments:'FMEA assessments (raw)'};
const ID_RE=/\b((?:STK|MOE|UC|SC|REG|LC|LI|ND|IF|TR|TD|AD|FM|FA|N|R|P|S|C|T|G)-[A-Za-z0-9_.-]+|F\d{2}[a-z]?)\b/g;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function linkify(html){return html.replace(ID_RE,m=>`<a class="id" data-id="${m}">${m}</a>`)}
function kindOf(id){ if(!graphData) return null; const n=graphData.nodes.find(n=>n.id===id); return n?n.kind:null }
document.addEventListener('click',e=>{const a=e.target.closest('a.id'); if(a){e.preventDefault(); openId(a.dataset.id)} const c=e.target.closest('[data-nav]'); if(c){e.preventDefault(); go(JSON.parse(c.dataset.nav))}});
async function openId(id){ if(!graphData) graphData=await api('/graph'); const k=kindOf(id); if(k) go({type:'element',kind:k,id}); else go({type:'search',q:id}) }

// ---------------- navigation ----------------
async function refreshProject(){ P=await api('/project'); $('#projName').textContent=P.meta.name||'(unnamed)'; const open=Object.entries(P.coverage).filter(([k,v])=>k!=='clean'&&v).reduce((a,[k,v])=>a+v,0);
  const pill=$('#covPill'); pill.textContent=P.coverage.clean?'trace clean':`${open} open gaps`; pill.className='pill '+(P.coverage.clean?'good':'warn'); pill.onclick=()=>go({type:'gaps'});
  $('#stagedN').textContent=P.staged; $('#autoApprove').checked=P.auto; renderNav(); graphData=await api('/graph') }
function renderNav(){ const stages={}; for(const [k,s] of Object.entries(P.stage_of)){(stages[s]??=[]).push(k)}
  let h=`<a data-nav='{"type":"home"}' class="${view.type==='home'?'active':''}">Overview</a><a data-nav='{"type":"graph"}' class="${view.type==='graph'?'active':''}">Graph</a><a data-nav='{"type":"scorecard"}' class="${view.type==='scorecard'?'active':''}">Scorecard</a><a data-nav='{"type":"gaps"}' class="${view.type==='gaps'?'active':''}">Open gaps <span class="n">${Object.entries(P.coverage).filter(([k,v])=>k!=='clean'&&v).length}</span></a>`;
  for(const [s,ks] of Object.entries(stages)){ if(s==='Risk (derived)') continue; h+=`<h4 style="color:${STAGE_COLOR[s]}">${s}</h4>`; for(const k of ks) h+=`<a data-nav='{"type":"collection","kind":"${k}"}' class="${view.kind===k?'active':''}">${LABEL[k]}<span class="n">${P.counts[k]}</span></a>` }
  h+=`<h4 style="color:var(--sr)">Derived</h4><a data-nav='{"type":"form","kind":"dfmea"}' class="${view.kind==='dfmea'?'active':''}">DFMEA (AIAG-VDA form) <span class="n">${P.fmea_counts.assessed}</span></a><a data-nav='{"type":"form","kind":"hazards"}' class="${view.kind==='hazards'?'active':''}">Hazard register</a><a data-nav='{"type":"collection","kind":"unassessed"}'>Unassessed candidates <span class="n">${P.coverage.unassessed_candidates}</span></a><a data-nav='{"type":"collection","kind":"screened"}'>Screened <span class="n">${P.fmea_counts.screened}</span></a><a data-nav='{"type":"form","kind":"fta"}' class="${view.kind==='fta'?'active':''}">Fault trees</a><a data-nav='{"type":"form","kind":"drbfm"}' class="${view.kind==='drbfm'?'active':''}">DRBFM</a><a data-nav='{"type":"form","kind":"dvpr"}' class="${view.kind==='dvpr'?'active':''}">DVP&amp;R</a><a data-nav='{"type":"form","kind":"vcrm"}' class="${view.kind==='vcrm'?'active':''}">VCRM / RTM</a><a data-nav='{"type":"form","kind":"reqspec"}' class="${view.kind==='reqspec'?'active':''}">Requirements spec (29148)</a><a data-nav='{"type":"budgets"}' class="${view.type==='budgets'?'active':''}">Budgets (mass / power / cost)</a><a data-nav='{"type":"collection","kind":"certification_plan"}'>Certification plan</a>`;
  h+=`<h4>Architecture forms</h4><a data-nav='{"type":"form","kind":"n2"}' class="${view.kind==='n2'?'active':''}">N² — physical</a><a data-nav='{"type":"form","kind":"n2l"}' class="${view.kind==='n2l'?'active':''}">N² — logical</a><a data-nav='{"type":"form","kind":"icd"}' class="${view.kind==='icd'?'active':''}">ICD index</a><a data-nav='{"type":"form","kind":"pugh"}' class="${view.kind==='pugh'?'active':''}">Trade matrices (Pugh)</a><a data-nav='{"type":"matrix","kind":"requirements/functions"}' class="${view.type==='matrix'?'active':''}">Dependency matrices</a>
  <h4>Artifacts</h4><a data-nav='{"type":"integrations"}' class="${view.type==='integrations'?'active':''}">Integrations (OSLC, tools)</a><a data-nav='{"type":"views"}'>Diagrams (SysML views)</a><a data-nav='{"type":"docs"}'>Design documentation</a><a data-nav='{"type":"sysml"}'>SysML v2 text</a><a data-nav='{"type":"documents"}'>Source documents</a>`;
  $('#nav').innerHTML=h }
function toHash(v){ return '#/'+encodeURIComponent(v.type)+(v.kind?'/'+v.kind:'')+(v.id?'/'+encodeURIComponent(v.id):'')+(v.focus?'/'+encodeURIComponent(v.focus):'')+(v.q?'/'+encodeURIComponent(v.q):'') }
function fromHash(){ const h=location.hash.replace(/^#\/?/,''); if(!h) return {type:'home'}; const [type,a,b]=h.split('/').map(decodeURIComponent);
  if(type==='element') return {type,kind:a,id:b}; if(type==='collection'||type==='form') return {type,kind:a}; if(type==='matrix') return {type,kind:a+'/'+b}; if(type==='graph') return {type,focus:a}; if(type==='search') return {type,q:a}; return {type} }
window.addEventListener('hashchange',()=>{ const v=fromHash(); if(JSON.stringify(v)!==JSON.stringify(view)) go(v,true) });
async function go(v,fromUrl){ view=v; if(!fromUrl){ const h=toHash(v); if(location.hash!==h) history.pushState(null,'',h) } renderNav(); const m=$('#main'); m.innerHTML='<div class="empty">Loading…</div>';
  try{ if(v.type==='home') m.innerHTML=await home(); else if(v.type==='collection') m.innerHTML=await collection(v.kind); else if(v.type==='element') m.innerHTML=await element(v.kind,v.id);
   else if(v.type==='graph'){ m.innerHTML='<div class="crumb">Trace graph — click a node to open it; double-click to focus its neighbourhood</div><div class="row" style="margin-bottom:8px"><input id="gfocus" placeholder="focus on id…" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px"><button class="sm" id="gall">whole graph</button></div><div id="cy"></div>'; await graph(v.focus) }
   else if(v.type==='gaps') m.innerHTML=await gaps(); else if(v.type==='budgets') m.innerHTML=await budgetsView(); else if(v.type==='views') m.innerHTML=await gallery(); else if(v.type==='docs') m.innerHTML=await docsView(); else if(v.type==='sysml') m.innerHTML=await sysmlView(); else if(v.type==='documents') m.innerHTML=await documentsView(); else if(v.type==='search') m.innerHTML=await searchView(v.q); else if(v.type==='patches') await showPatches(true); else if(v.type==='form') await formView(v.kind); else if(v.type==='matrix') await matrixView(v.kind); else if(v.type==='scorecard') m.innerHTML=await scorecardView(); else if(v.type==='integrations') m.innerHTML=await integrationsView() }
  catch(e){ m.innerHTML=`<div class="empty">${esc(e.message)}</div>` } }
function stageTag(s){return s?`<span class="stage" style="background:${STAGE_COLOR[s]||'#888'}">${s}</span>`:''}
function cell(v){ if(Array.isArray(v)) return v.map(x=>typeof x==='object'?esc(JSON.stringify(x)):linkify(esc(x))).join(', ')||'—'; if(v&&typeof v==='object') return Object.entries(v).map(([k,x])=>`<span style="color:var(--quiet)">${esc(k)}</span>=${esc(x)}`).join('; ')||'—'; return linkify(esc(v??'—')) }

async function home(){ const c=P.coverage; const art=await api('/artifacts');
  return `<h2 style="margin:0 0 4px">${esc(P.meta.name||'')}</h2><div class="crumb">${esc(P.meta.description||'')} · method ${esc(P.meta.method||'OOSEM')} · ${esc(P.root)}</div>
  <div class="grid2"><div class="box"><h4>Digital thread</h4>${Object.entries(P.stage_of).reduce((acc,[k,s])=>{(acc[s]??=[]).push(k);return acc},{})&&Object.entries(Object.entries(P.stage_of).reduce((acc,[k,s])=>{(acc[s]??=[]).push(k);return acc},{})).filter(([s])=>s!=='Risk (derived)').map(([s,ks])=>`<div class="link"><span class="rel" style="color:${STAGE_COLOR[s]}">${s}</span><span>${ks.map(k=>`<a class="id" data-nav='{"type":"collection","kind":"${k}"}' href="#">${LABEL[k]} ${P.counts[k]}</a>`).join(' · ')}</span></div>`).join('')}
  <div class="link"><span class="rel" style="color:var(--sr)">Risk (derived)</span><span><a class="id" data-nav='{"type":"form","kind":"dfmea"}' href="#">DFMEA</a> · ${P.fmea_counts.candidates} candidates · ${P.fmea_counts.assessed} assessed (${P.fmea_counts.high_ap} High AP, ${P.fmea_counts.safety_class} safety-class) · ${P.fmea_counts.screened} screened</span></div></div>
  <div class="box"><h4>Coverage (${c.clean?'clean':'gaps open'})</h4>${Object.entries(c).filter(([k])=>k!=='clean').map(([k,v])=>`<div class="link"><span class="rel" style="min-width:300px">${k.replaceAll('_',' ')}</span><b style="color:${v?'var(--warn)':'var(--good)'}">${v}</b></div>`).join('')}</div></div>
  <div class="box" style="margin-top:14px"><h4>Artifacts</h4>${art.views.length?`<a class="id" data-nav='{"type":"views"}' href="#">${art.views.length} diagrams</a> · `:''}${art.docs.length?`<a class="id" data-nav='{"type":"docs"}' href="#">design documentation</a> · `:''}${art.docx.map(f=>`<a class="id" href="/p/${PID}/out/${f}">${f}</a>`).join(' · ')}${!art.views.length?'<span style="color:var(--quiet)">none yet — click “Build artifacts”</span>':''}</div>
  <div class="box" style="margin-top:14px"><h4>Start here</h4><p>Drop your PRD, datasheets and standards into <b>Source documents</b>, then ask the agent in the chat. Typical first steps:</p><div class="chips">${['Read the documents in docs/ and set up stakeholders, needs and measures of effectiveness','Derive the regulatory context and write the system requirements','Define the logical architecture: functions, logical components, interfaces','Define the physical architecture by discipline with interfaces and states','Assess every failure-mode candidate systematically','Complete the verification plan and gates'].map(t=>`<span class="chip" onclick="send(${JSON.stringify(t)})">${t}</span>`).join('')}</div></div>` }

async function collection(kind){ const rows=await api('/collection/'+kind); if(!rows.length) return `<h2>${LABEL[kind]||kind}</h2><div class="empty">Nothing here yet. <span class="chip" onclick="send('Populate ${LABEL[kind]||kind} from the source documents and the model')">ask the agent</span></div>`;
  const derivedLink={fmea:r=>({kind:'fmea',id:r.id}),unassessed:r=>({kind:r.kind,id:r.element}),screened:r=>({kind:r.kind,id:r.element}),verification_matrix:r=>({kind:'tests',id:r.id}),certification_plan:r=>({kind:'regulations',id:r.id})}[kind];
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['disciplines'].includes(k)).slice(0,12);
  return `<h2 style="margin:0 0 4px">${LABEL[kind]||kind.replaceAll('_',' ')} <span class="pill">${rows.length}</span></h2><div class="crumb">${stageTag(P.stage_of[kind]||'Risk (derived)')} click a row to open the element and everything linked to it</div>

   <div class="row"><input id="cname" placeholder="consumer name, e.g. DOORS Next prod" style="flex:1;padding:7px;border:1px solid var(--line);border-radius:8px"><label class="toggle"><input type="checkbox" id="ctrusted"> trusted (no approval prompt)</label><button class="primary" onclick="addConsumer()">Create consumer</button></div><div id="cres" style="margin-top:6px"></div><div id="clist" style="margin-top:6px"></div></div>
  <div class="box" style="margin-bottom:12px"><h4>Connect Jama Connect / Codebeamer / Polarion</h4><div>These use HTTP Basic or OAuth2 bearer. In Jama: <i>Admin → Integrations → OSLC</i> (or the Jazz-style "friend" dialog in newer versions) with the catalog URL and your Launch API token below. To pull from Jama into Launch use the consumer form below with <code>OSLC_AUTH=oauth2-client</code> (Jama REST OAuth client id/secret) on the server.</div></div>
  <div class="box" style="margin-bottom:12px"><h4>OSLC consumer — pull from another tool</h4><div class="row"><input id="oslcurl" placeholder="query base URL from the other tool's ServiceProvider (requirements)" style="flex:1;padding:7px;border:1px solid var(--line);border-radius:8px"><select id="oslckind" style="padding:7px;border:1px solid var(--line);border-radius:8px"><option value="requirements">requirements</option><option value="tests">test cases</option></select><button class="primary" onclick="oslcPull()">Pull → staged patch</button></div><div class="delta" style="margin-top:6px">Credentials via server env OSLC_USER / OSLC_TOKEN or OSLC_BEARER. Imported elements keep their origin URI; re-pulling updates in place.</div><div id="oslcres"></div></div>
  <div class="box"><h4>Engineering tool adapters</h4><dl><dt>Pull</dt><dd>kicad (netlist) · cad-bom (CSV) · step · alm (CSV/JSON) · test-results (CSV/JSON) · oslc</dd><dt>Push</dt><dd>kicad constraints · cad-bom requirement sheet · modelica parameter record · alm CSV · test plan CSV · oslc creation factory</dd><dt>Run</dt><dd>FMU simulation (FMPy) with constraint checks; CadQuery/FreeCAD, KiCad CLI, OpenModelica, ngspice, firmware builds through the agent on this machine</dd><dt>MCP</dt><dd><code>launch serve-mcp &lt;dir&gt;</code> exposes the model tools to Claude Code, Cursor or any MCP client</dd></dl><div class="chips" style="margin-top:8px"><span class="chip" onclick="send('Import the KiCad netlist in elec/ with tool_pull and map the components to parts under the right assembly')">import a KiCad netlist</span><span class="chip" onclick="send('Import the CAD BOM CSV in mech/ with tool_pull')">import a CAD BOM</span><span class="chip" onclick="send('Export the requirement limits to a Modelica parameter record in sim/')">export limits to Modelica</span></div></div>` }
async function addConsumer(){ try{ const c=await post('/oslc/consumers',{name:$('#cname').value||'consumer',trusted:$('#ctrusted').checked}); $('#cres').innerHTML=`<b>Key</b> <code style="user-select:all">${c.key}</code> &nbsp; <b>Secret</b> <code style="user-select:all">${c.secret}</code> <span class="delta">— shown once; paste into ELM now</span>`; listConsumers() }catch(e){ $('#cres').textContent=e.message } }
async function listConsumers(){ const cs=await fetch('/api/oslc/consumers').then(r=>r.json()).catch(()=>[]); $('#clist').innerHTML=cs.length?cs.map(c=>`<div class="link"><span class="rel">${esc(c.name)}</span><span><code>${c.key}</code> · by ${esc(c.created_by)} ${c.trusted?'· trusted':''} <a class="id" onclick="fetch('/api/oslc/consumers/${c.key}',{method:'DELETE'}).then(listConsumers)">revoke</a></span></div>`).join(''):'<span class="delta">no consumers yet</span>' }
async function oslcPull(){ const url=$('#oslcurl').value.trim(); if(!url) return; $('#oslcres').textContent='pulling…'; try{ const r=await post('/sync',{direction:'pull',adapter:'oslc',path:url,kind:$('#oslckind').value}); $('#oslcres').innerHTML=`staged patch <a class="id" onclick="go({type:'patches'})">${r.patch_id}</a> (${r.ops} ops) — review under Patches` }catch(e){ $('#oslcres').textContent=e.message } }
async function gallery(){ const a=await api('/artifacts'); if(!a.views.length) return `<div class="empty">No diagrams yet. <button class="primary" onclick="build()">Build artifacts</button></div>`;
  return `<h2 style="margin:0 0 10px">Diagrams — rendered from the model</h2><div class="gallery">${a.views.map(v=>`<div><div class="crumb">${v.replace('.png','').replaceAll('_',' ')}</div><img src="/p/${PID}/out/views/${v}?t=${Date.now()}" onclick="window.open(this.src)"></div>`).join('')}</div>` }
async function docsView(){ const a=await api('/artifacts'); if(!a.docs.length) return `<div class="empty">Not built yet. <button class="primary" onclick="build()">Build artifacts</button></div>`;
  const md=await fetch('/p/'+PID+'/out/docs/design_documentation.md?t='+Date.now()).then(r=>r.text()); const html=marked.parse(md.replace(/^---[\s\S]*?---/,'').replaceAll('](../views/','](/p/'+PID+'/out/views/').replace(/\{width=[^}]*\}/g,''));
  return `<div class="row" style="margin-bottom:10px">${a.docx.map(f=>`<a class="id" href="/p/${PID}/out/${f}">⬇ ${f}</a>`).join(' ')}<button class="sm" onclick="build(true)">Rebuild with Word export</button></div><div class="mdoc">${linkify(html)}</div>` }
async function sysmlView(){ const a=await api('/artifacts'); if(!a.sysml.length) return `<div class="empty">Not built yet. <button class="primary" onclick="build()">Build artifacts</button></div>`;
  const texts=await Promise.all(a.sysml.map(f=>fetch('/p/'+PID+'/out/sysml/'+f).then(r=>r.text()))); return `<h2 style="margin:0 0 10px">SysML v2 — textual notation</h2>`+a.sysml.map((f,i)=>`<div class="box" style="margin-bottom:10px"><h4>${f}</h4><pre class="diff" style="max-height:420px">${esc(texts[i])}</pre></div>`).join('') }
async function documentsView(){ const a=await api('/artifacts'); return `<h2 style="margin:0 0 10px">Source documents</h2><div class="crumb">PRDs, datasheets, standards, test reports. The agent reads these and cites them as patch sources.</div><div class="box"><input type="file" id="up" multiple> <button class="sm" onclick="upload()">Upload</button></div><div class="box" style="margin-top:10px">${a.documents.map(d=>`<div class="link"><a class="id" href="/api/p/${PID}/file?path=docs/${encodeURIComponent(d)}" target="_blank">${esc(d)}</a><span class="chip" onclick="send('Read ${d} and extract everything relevant to the model (needs, requirements, regulations, parts, limits); stage patches')">ingest</span></div>`).join('')||'<span style="color:var(--quiet)">none yet</span>'}</div>` }
async function searchView(q){ const hits=await api('/search?q='+encodeURIComponent(q)); return `<h2 style="margin:0 0 10px">Search “${esc(q)}” <span class="pill">${hits.length}</span></h2>`+(hits.length?`<table><tbody>${hits.map(h=>`<tr data-nav='${JSON.stringify({type:'element',kind:h.kind,id:h.id})}' style="cursor:pointer"><td>${stageTag(P.stage_of[h.kind])}</td><td><a class="id">${h.id}</a></td><td>${esc(h.name)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">no matches</div>') }
async function upload(){ const fs=$('#up').files; for(const f of fs){ const fd=new FormData(); fd.append('file',f); await fetch('/api/p/'+PID+'/documents',{method:'POST',body:fd}) } go({type:'documents'}) }

async function graph(focus){ graphData=await api('/graph'); const el=$('#cy'); const col={'1 Needs':'#c2410c','2 Requirements':'#b45309','3 Logical architecture':'#1d4ed8','4 Physical architecture':'#0f766e','5 Analysis':'#7e22ce','6 Verification':'#15803d','Risk (derived)':'#b91c1c'};
  let nodes=graphData.nodes, edges=graphData.edges;
  if(focus){ const keep=new Set([focus]); for(const e of edges){ if(e.source===focus) keep.add(e.target); if(e.target===focus) keep.add(e.source) } const k2=new Set(keep); for(const e of edges){ if(keep.has(e.source)&&!keep.has(e.target)) k2.add(e.target); if(keep.has(e.target)&&!keep.has(e.source)) k2.add(e.source) } nodes=nodes.filter(n=>k2.has(n.id)); edges=edges.filter(e=>k2.has(e.source)&&k2.has(e.target)) }
  else if(nodes.length>400){ nodes=nodes.filter(n=>n.kind!=='fmea'&&n.kind!=='fm_assessments'); const ids=new Set(nodes.map(n=>n.id)); edges=edges.filter(e=>ids.has(e.source)&&ids.has(e.target)) }
  cy=cytoscape({container:el,elements:[...nodes.map(n=>({data:{...n,label:n.id}})),...edges.map((e,i)=>({data:{id:'e'+i,...e}}))],
    style:[{selector:'node',style:{'label':'data(label)','font-size':9,'background-color':e=>col[e.data('stage')]||'#888','color':'#1d2430','text-valign':'bottom','text-margin-y':3,'width':e=>e.data('id')===focus?34:16,'height':e=>e.data('id')===focus?34:16,'border-width':e=>e.data('id')===focus?3:0,'border-color':'#111'}},
           {selector:'edge',style:{'width':1,'line-color':'#cbd5e1','target-arrow-color':'#cbd5e1','target-arrow-shape':'triangle','arrow-scale':.7,'curve-style':'bezier','label':'data(rel)','font-size':7,'color':'#94a3b8','text-rotation':'autorotate'}}],
    layout:{name:focus?'concentric':'cose',concentric:n=>n.data('id')===focus?10:(n.degree()),levelWidth:()=>2,animate:false,nodeRepulsion:8000,idealEdgeLength:70,padding:30}});
  cy.on('tap','node',ev=>{const n=ev.target.data(); go({type:'element',kind:n.kind,id:n.id})}); cy.on('dbltap','node',ev=>go({type:'graph',focus:ev.target.data('id')}));
  $('#gfocus').onchange=e=>go({type:'graph',focus:e.target.value.trim()}); $('#gall').onclick=()=>go({type:'graph'}); if(focus) $('#gfocus').value=focus }

async function build(docx){ const b=$('#btnBuild'); b.disabled=true; b.textContent='Building…'; try{ await post('/build?docx='+(docx?'true':'false')); await refreshProject(); if(['views','docs','sysml','home'].includes(view.type)) go(view) } finally{ b.disabled=false; b.textContent='Build artifacts' } }
$('#btnBuild').onclick=()=>build(false); $('#btnPatches').onclick=()=>showPatches();
$('#search').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const q=e.target.value.trim(); if(q){ const k=kindOf(q); k?go({type:'element',kind:k,id:q}):go({type:'search',q}) } } });

// ---------------- chat ----------------
const log=$('#log'); function add(html,cls){ const d=document.createElement('div'); d.className=cls||''; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; return d }
async function send(text){ text=(text||$('#input').value).trim(); if(!text) return; $('#input').value=''; try{ await post('/chat',{text}) }catch(e){ add(`<div class="msg" style="color:var(--bad)">${esc(e.message)}</div>`) } }
async function runRole(role){ try{ await post('/chat',{text:'',role}) }catch(e){ add(`<div class="msg" style="color:var(--bad)">${esc(e.message)}</div>`) } }
$('#input').addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') send() }); $('#btnStop').onclick=()=>post('/interrupt'); $('#autoApprove').onchange=e=>post('/settings',{auto:e.target.checked});
function patchCard(p){ const d=document.createElement('div'); d.className='card patch '+(p.status==='applied'?'applied':p.status==='rejected'?'rejected':''); d.id='patch-'+p.id;
  const delta=Object.entries(p.coverage_delta||{}).map(([k,[a,b]])=>`<b class="${b<a?'good':'bad'}">${k.replaceAll('_',' ')} ${a}→${b}</b>`).join(' · ');
  d.innerHTML=`<h5>Patch ${p.id} <span style="color:var(--quiet);font-weight:400">· ${esc(p.author)} · ${p.ops.length} changes · ${p.status}</span></h5><div>${linkify(esc(p.rationale))}</div>${p.sources?.length?`<div class="delta">sources: ${p.sources.map(esc).join(', ')}</div>`:''}
  <div class="ops">${p.ops.map((o,i)=>`<div class="${o.op}" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'"><span class="op">${o.op}</span><a class="id" data-id="${o.id}">${o.id}</a> <span style="color:var(--quiet)">${o.kind} · ${esc(o.name||'')}</span></div><pre class="diff" style="display:none">${o.diff.split('\n').map(l=>`<span class="${l.startsWith('+')?'a':l.startsWith('-')?'d':''}">${esc(l)}</span>`).join('\n')}</pre>`).join('')}</div>
  ${p.errors?.length?`<div class="delta" style="color:var(--bad)">${p.errors.map(esc).join('<br>')}</div>`:''}${p.warnings?.length?`<div class="delta">⚠ ${p.warnings.map(esc).join('<br>⚠ ')}</div>`:''}${delta?`<div class="delta">coverage if approved: ${delta}</div>`:''}
  ${p.status==='staged'?`<div class="row" style="margin-top:8px"><button class="good sm" onclick="decide('${p.id}','approve')">Approve</button><button class="bad sm" onclick="decide('${p.id}','reject')">Reject</button><button class="sm" onclick="send('Revise patch ${p.id}: ')">Ask for changes</button></div>`:''}`; return d }
async function decide(id,what){ try{ await post(`/patches/${id}/${what}`); }catch(e){ add(`<div class="msg" style="color:var(--bad)">${esc(e.message)}</div>`) } }
async function showPatches(fromGo){ if(!fromGo) return go({type:'patches'}); const ps=await api('/patches'); const m=$('#main'); m.innerHTML=`<h2 style="margin:0 0 10px">Patches</h2>`+(ps.length?'':'<div class="empty">none</div>'); for(const p of ps.reverse()) m.appendChild(patchCard(p)) }
function renderChips(){ $('#chips').innerHTML=P.role_order.map(r=>`<span class="chip" title="${esc(P.roles[r])}" onclick="runRole('${r}')">▶ ${P.roles[r].split(' (')[0]}</span>`).join('') }
let busyEl=null;
function onEvent(ev){ switch(ev.type){
  case 'user': add(`<div class="msg user">${linkify(esc(ev.text))}</div>`); $('#agentState').innerHTML='<span class="spinner"></span>working…'; break;
  case 'assistant': add(`<div class="msg assistant">${linkify(marked.parse(ev.text))}</div>`); break;
  case 'tool': add(`<div class="tool">⚙ ${esc(ev.name)} <span style="opacity:.7">${esc(ev.arg)}</span></div>`); break;
  case 'tool_error': add(`<div class="tool err">✗ ${esc(ev.text)}</div>`); break;
  case 'permission': { const d=add(`<div class="card perm"><h5>The agent wants to run <code>${esc(ev.tool)}</code></h5><pre class="diff" style="max-height:120px">${esc(ev.detail)}</pre><div class="row"><button class="good sm" data-a="allow">Allow</button><button class="sm" data-a="always">Always this session</button><button class="bad sm" data-a="deny">Deny</button></div></div>`);
      d.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await post('/permission/'+ev.id,{answer:b.dataset.a}); d.querySelector('.row').innerHTML=`<span class="delta">${b.dataset.a}</span>`}); break }
  case 'patch_staged': log.appendChild(patchCard(ev.patch)); log.scrollTop=log.scrollHeight; refreshProject(); break;
  case 'patch_applied': { const c=$('#patch-'+ev.id); if(c){ c.classList.add('applied'); c.querySelector('.row')?.remove(); c.querySelector('h5').insertAdjacentHTML('beforeend',' <span style="color:var(--good)">✓ applied</span>') } refreshProject(); if(view.type==='element'||view.type==='collection'||view.type==='home'||view.type==='gaps') go(view); break }
  case 'patch_rejected': { const c=$('#patch-'+ev.id); if(c){ c.classList.add('rejected'); c.querySelector('.row')?.remove() } refreshProject(); break }
  case 'result': add(`<div class="tool">· ${ev.turns} turns · ${ev.seconds}s${ev.cost?` · $${ev.cost.toFixed(3)}`:''}</div>`); break;
  case 'error': add(`<div class="msg" style="color:var(--bad)">${esc(ev.text)}</div>`); break;
  case 'idle': $('#agentState').textContent='idle'; break;
  case 'model_changed': refreshProject(); break;
  case 'triage': { const d=Object.entries(ev.delta||{}).map(([k,[a,b]])=>`<b class="${b>=a?'good':'bad'}">${k.replaceAll('_',' ')} ${a}→${b}</b>`).join(' · '); if(!d && !ev.gaps.length) break;
      add(`<div class="card" style="border-color:#bfdbfe;background:#eff6ff"><h5>Model changed — scorecard ${ev.grade} · ${ev.overall}</h5>${d?`<div class="delta">${d}</div>`:''}${ev.gaps.length?`<div class="delta" style="margin-top:4px">open: ${ev.gaps.slice(0,5).map(g=>`${esc(g.gap.replaceAll('_',' '))} <a class="id" data-id="${g.item}">${esc(String(g.item))}</a>`).join(' · ')}${ev.gaps.length>5?' …':''}</div><div class="row" style="margin-top:6px"><button class="sm" onclick="send('Close the open gaps the watcher just listed, in reviewable patches')">Ask the agent to close them</button></div>`:'<div class="delta">no open gaps</div>'}</div>`); break }
  case 'built': refreshProject(); break; } }
function connect(){ const es=new EventSource('/api/p/'+PID+'/events'); es.addEventListener('ev',e=>onEvent(JSON.parse(e.data))); es.onerror=()=>{es.close(); setTimeout(connect,2000)} }
function loginView(me){ return `<div style="max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px"><h2 style="margin:0 0 4px">Launch</h2><div class="crumb">agentic systems engineering for hardware teams</div>
  <label>Work email<br><input id="lemail" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px" placeholder="you@company.com"></label>
  ${me.invite_required?`<label>Invite code<br><input id="linvite" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px"></label>`:''}
  <button class="primary" onclick="doLogin()">Continue</button><div id="lerr" style="color:var(--bad);margin-top:8px"></div></div>` }
async function doLogin(){ try{ await post('/login',{email:$('#lemail').value,invite:($('#linvite')||{}).value}); const nx=new URLSearchParams(location.search).get('next'); location.href=nx&&nx.startsWith('/')?nx:location.pathname }catch(e){ $('#lerr').textContent=e.message } }
async function landing(me){ const ps=await api('/projects'); const ov=$('#overlay');
  ov.innerHTML=`<div style="max-width:1000px;margin:40px auto;padding:0 20px"><div class="row" style="justify-content:space-between"><div><h1 style="margin:0">Projects</h1><div class="crumb">${esc(me.user)} · <a class="id" href="#" onclick="post('/logout').then(()=>location.reload());return false">sign out</a></div></div>
   <button class="primary" onclick="$('#newp').style.display='block'">New project</button></div>
   <div id="newp" class="box" style="display:none;margin:14px 0"><h4>New project</h4><div class="row"><input id="npid" placeholder="short id, e.g. ebike-v2" style="padding:7px;border:1px solid var(--line);border-radius:8px"><input id="npname" placeholder="Product name" style="padding:7px;border:1px solid var(--line);border-radius:8px;flex:1"><input id="npdesc" placeholder="one-line description" style="padding:7px;border:1px solid var(--line);border-radius:8px;flex:2"><button class="primary" onclick="newProject()">Create</button></div><div id="nperr" style="color:var(--bad)"></div></div>
   <div class="gallery" style="margin-top:16px">${ps.map(p=>`<a href="/p/${p.id}" style="text-decoration:none;color:inherit"><div class="box" style="height:100%"><h3 style="margin:0 0 4px">${esc(p.name)}</h3><div class="crumb">${esc(p.description||'')}</div>
     <div class="row" style="margin-top:8px"><span class="pill ${p.clean?'good':'warn'}">${p.clean?'trace clean':'gaps open'}</span>${p.staged?`<span class="pill">${p.staged} patches to review</span>`:''}${p.busy?'<span class="pill">agent working</span>':''}</div>
     <div class="delta" style="margin-top:8px">${p.counts.requirements} requirements · ${p.counts.parts} parts · ${p.counts.tests} tests${p.updated?` · updated ${new Date(p.updated*1000).toLocaleDateString()}`:''}</div></div></a>`).join('')||'<div class="empty">No projects yet — create one.</div>'}</div></div>`; ov.style.display='block' }
async function newProject(){ try{ const p=await post('/projects',{id:$('#npid').value,name:$('#npname').value,description:$('#npdesc').value}); location.href='/p/'+p.id }catch(e){ $('#nperr').textContent=e.message } }
(async()=>{ const me=await api('/me');
  if(!me.user){ $('#overlay').innerHTML=loginView(me); $('#overlay').style.display='block'; return }
  if(!PID){ if(me.single) { location.replace('/p/default'+location.hash); return } return landing(me) }
  $('#userBadge').innerHTML=`${esc(me.user)}${me.single?'':' · <a class="id" href="/">projects</a>'}`;
  await refreshProject(); renderChips(); go(fromHash(),true); connect(); if(P.busy) $('#agentState').innerHTML='<span class="spinner"></span>working…' })();
</script>
</body>
</html>
