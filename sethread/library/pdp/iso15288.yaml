name: ISO/IEC/IEEE 15288 / INCOSE decision gates
description: The handbook's life-cycle stages closed by MCR, SRR, SDR, PDR, CDR, TRR, SVR, PRR, ORR.
phases:
  - {id: PH-CONCEPT, name: Concept, order: 1, stage: Concept, gate: SRR}
  - {id: PH-DEV, name: Development, order: 2, stage: Development, gate: CDR}
  - {id: PH-VER, name: Verification, order: 3, stage: Development, gate: SVR}
  - {id: PH-PROD, name: Production, order: 4, stage: Production, gate: PRR}
  - {id: PH-UTIL, name: Utilization, order: 5, stage: Utilization, gate: ORR}
gates:
  - {id: SRR, name: System requirements review, exit: Needs, MoEs and system requirements baselined}
  - {id: PDR, name: Preliminary design review, exit: Architecture allocated; interfaces defined; risks assessed}
  - {id: CDR, name: Critical design review, exit: Detailed design complete; analyses complete; verification planned}
  - {id: TRR, name: Test readiness review, exit: Test procedures, articles and facilities ready}
  - {id: SVR, name: System verification review, exit: Verification complete; discrepancies closed}
  - {id: PRR, name: Production readiness review, exit: Processes, suppliers and quality controls ready}
  - {id: ORR, name: Operational readiness review, exit: Operations and support in place}
deliverables:
  - {id: D-SYS-NEEDS, name: Stakeholder needs & MoEs, gate: SRR, focus: systems, check: {type: coverage, key: needs_without_requirements, max: 0}}
  - {id: D-SYS-REQ, name: System requirements with verification, gate: SRR, focus: systems, check: {type: coverage, key: requirements_without_tests, max: 0}}
  - {id: D-SUB-ARCH, name: Subsystem architecture & ICD, gate: PDR, team_kind: subsystem, check: {type: scope, key: boundary_items}}
  - {id: D-SUB-DFMEA, name: Subsystem FMEA, gate: CDR, team_kind: subsystem, check: {type: scope, key: fmea_complete}}
  - {id: D-REL-HIGHAP, name: High-AP modes have tests, gate: CDR, focus: reliability, check: {type: coverage, key: high_ap_fm_without_tests, max: 0}}
  - {id: D-TEST-PLAN, name: Verification plan, gate: TRR, focus: test, check: {type: coverage, key: requirements_without_tests, max: 0}}
  - {id: D-SUB-VER, name: Subsystem verification complete, gate: SVR, team_kind: subsystem, check: {type: scope, key: tests_passed}}
  - {id: D-MFG, name: Process FMEA & control plan, gate: PRR, focus: manufacturing, check: {type: coverage, key: process_steps_without_pfmea, max: 0, min_count: {kind: process_steps, n: 1}}}
  - {id: D-OPS, name: Field loop in place, gate: ORR, focus: reliability, check: {type: coverage, key: field_events_without_fm, max: 0}}
