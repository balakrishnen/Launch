# Trigger → applicable regulations/standards. Used by the requirements agent (library tool) and the compliance check.
# trigger keys are product properties the agent detects: radio, battery_liion, skin_contact, mains, wearable, motor, medical_claim, children, outdoor, vehicle, iot_cloud
- id: FCC-15B
  trigger: [digital_electronics]
  market: US
  name: FCC Part 15 Subpart B (unintentional radiators)
  standard: ANSI C63.4; FCC 47 CFR 15.107/15.109
  requirement_hint: "Conducted and radiated emissions within Class B limits; SDoC labelling."
- id: FCC-15C
  trigger: [radio]
  market: US
  name: FCC Part 15 Subpart C (intentional radiators, 2.4 GHz)
  standard: ANSI C63.10; 47 CFR 15.247/15.249; KDB 447498 (RF exposure)
  requirement_hint: "Use a pre-certified module with modular grant where possible; host must keep antenna, placement and RF exposure within grant conditions."
- id: ISED-RSS
  trigger: [radio]
  market: CA
  name: ISED RSS-247 / RSS-Gen / RSS-102
  standard: RSS-247, RSS-Gen, RSS-102
- id: RED
  trigger: [radio]
  market: EU
  name: Radio Equipment Directive 2014/53/EU
  standard: EN 300 328; EN 301 489-1/-17; EN 62479 / EN 62311; EN IEC 62368-1
  requirement_hint: "Art. 3.1a safety, 3.1b EMC, 3.2 spectrum; from Aug 2025 also 3.3(d)(e)(f) cybersecurity (EN 18031)"
- id: RED-CYBER
  trigger: [radio, iot_cloud]
  market: EU
  name: RED delegated act 2022/30 — cybersecurity
  standard: EN 18031-1/-2/-3
- id: IEC-62368
  trigger: [digital_electronics, mains, battery_liion]
  market: [US, EU, CA]
  name: Audio/video, ICT equipment safety
  standard: IEC/UL/EN 62368-1
- id: IEC-62133
  trigger: [battery_liion]
  market: [EU, US]
  name: Secondary lithium cells and batteries — safety
  standard: IEC 62133-2; UL 1642 (cell); UL 2054 (pack)
- id: UN383
  trigger: [battery_liion]
  market: global
  name: UN 38.3 lithium battery transport tests
  standard: UN Manual of Tests and Criteria Part III 38.3 (T1–T8)
- id: ISO-10993
  trigger: [skin_contact]
