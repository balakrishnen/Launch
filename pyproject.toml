[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launch-se"
version = "0.1.0"
description = "Agentic systems-engineering digital thread for hardware products (OOSEM, SysML v2, derived FMEA / V&V / certification), with CAD/EDA/simulation/ALM adapters"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1", "rdflib>=7", "pyyaml>=6", "matplotlib>=3.7", "python-docx>=1.1", "claude-agent-sdk>=0.1", "fastapi>=0.110", "uvicorn>=0.27", "sse-starlette>=2", "python-multipart>=0.0.9", "rich>=13", "prompt_toolkit>=3"]

[project.optional-dependencies]
sim = ["fmpy>=0.3"]
dev = ["pytest"]

[project.scripts]
sethread = "sethread.cli:main"
launch = "sethread.cli:main"

[tool.setuptools.packages.find]
include = ["sethread*"]

[tool.setuptools.package-data]
sethread = ["web/static/*", "library/*.yaml"]
